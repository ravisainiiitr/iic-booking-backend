services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: iic_booking_local_django
    container_name: iic_booking_local_django
    depends_on:
      - redis
      - mailpit
    volumes:
      - /app/.venv
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
    environment:
      TZ: Asia/Kolkata
      COPILOT_LLM_PROVIDER: ${COPILOT_LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    ports:
      - '8000:8000'
    command: /start

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: iic_booking_local_mailpit
    ports:
      - "8025:8025"

  redis:
    image: docker.io/redis:8.10
    container_name: iic_booking_local_redis

  # Optional local LLM (AI.17). Start with: docker compose --profile ollama up -d ollama
  # Pull a model once: docker compose --profile ollama exec ollama ollama pull llama3.2:3b
  # Do NOT publish 11434 to the public Internet in production.
  ollama:
    profiles: ["ollama"]
    image: docker.io/ollama/ollama:latest
    container_name: iic_booking_local_ollama
    volumes:
      - iic_booking_local_ollama_data:/root/.ollama
    # Host bind for local debugging only; remove host mapping on shared/prod hosts.
    ports:
      - "11434:11434"
    # Hard caps so local AI cannot starve Django/Redis/Celery on the same machine.
    mem_limit: ${OLLAMA_MEM_LIMIT:-4g}
    cpus: ${OLLAMA_CPUS:-2.0}
    # Uncomment when NVIDIA Container Toolkit is available:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  celeryworker:
    <<: *django
    image: iic_booking_local_celeryworker
    container_name: iic_booking_local_celeryworker
    depends_on:
      - redis
      - mailpit
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: iic_booking_local_celerybeat
    container_name: iic_booking_local_celerybeat
    depends_on:
      - redis
      - mailpit
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: iic_booking_local_flower
    container_name: iic_booking_local_flower
    ports:
      - '5555:5555'
    command: /start-flower

volumes:
  iic_booking_local_ollama_data:
