# Optional Apache Guacamole stack for Remote Analysis.
# Prefer: docker compose -f docker-compose.ra-production.yml --profile guacamole up -d
#
# Standalone usage:
#   docker compose -f docker-compose.guacamole.yml up -d
#
# Then set portal env / RemoteAnalysisSettings:
#   RA_MOCK_GUACAMOLE=false
#   RA_GUACAMOLE_BASE_URL=https://guac.example.com/guacamole
#   RA_GUACAMOLE_API_URL=http://guacamole:8080/guacamole   # or host-mapped URL
#   RA_GUACAMOLE_ADMIN_USERNAME=guacadmin
#   RA_GUACAMOLE_ADMIN_PASSWORD=<rotated>
#   RA_GUACAMOLE_DATA_SOURCE=postgresql
# And run: python manage.py sync_remote_analysis_settings
#
# Agent (Windows Analysis PC) is documented in docs/deploy/AGENT_INSTALL.md — not a container.
#
# guacamole and guacd also join the portal stack's network (RA_BACKEND_NETWORK,
# default iic-booking-backend_default): Django calls http://guacamole:8080 and guacd
# must reach reverse-tunnel-gateway. The network must exist before `up`.
# Upgrading from 1.5.x: see docs/runbooks/guacamole-1.6-upgrade.md (schema upgrade required).
# GUACAMOLE_VERSION pins both guacamole and guacd (rollback: GUACAMOLE_VERSION=1.5.5).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  guacd:
    image: guacamole/guacd:${GUACAMOLE_VERSION:-1.6.0}
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
    volumes:
      - guac_drive:/drive
      - guac_record:/record
    networks:
      - guac_net
      - backend
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  guacamole-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: ${GUACAMOLE_DB_PASSWORD:-change-me}
    volumes:
      - guac_db:/var/lib/postgresql/data
    networks:
      - guac_net
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guacamole_user -d guacamole_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  guacamole:
    image: guacamole/guacamole:${GUACAMOLE_VERSION:-1.6.0}
    restart: unless-stopped
    depends_on:
      guacd:
        condition: service_started
      guacamole-db:
        condition: service_healthy
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_HOSTNAME: guacamole-db
      POSTGRESQL_DATABASE: guacamole_db
      # 1.6 prefers POSTGRESQL_USERNAME (logs a deprecation warning for _USER), but the
      # 1.5.5 image requires _USER, which keeps GUACAMOLE_VERSION=1.5.5 rollback working.
      POSTGRESQL_USER: guacamole_user
      POSTGRESQL_PASSWORD: ${GUACAMOLE_DB_PASSWORD:-change-me}
      # Terminate TLS at Traefik / reverse proxy in front of this service.
      # The 1.6 image enables auth-ban by default (5 failed logins per IP -> 5 min ban).
      # All browsers arrive from the Docker gateway IP and all backend logins from the
      # Django container, so one IP's failures would block every user / all launches.
      BAN_ENABLED: "false"
    ports:
      - "8085:8080"
    networks:
      - guac_net
      - backend
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/guacamole/ || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

networks:
  guac_net:
    driver: bridge
  backend:
    external: true
    name: ${RA_BACKEND_NETWORK:-iic-booking-backend_default}

volumes:
  guac_db:
  guac_drive:
  guac_record:
