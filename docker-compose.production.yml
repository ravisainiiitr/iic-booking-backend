# Harden existing production compose (additive — does not change app logic).
# Live production entry point (AWS RDS + Redis): this file.
# Prefer docker-compose.ra-production.yml only for a full fresh-server RA stack
# (includes local Postgres + Guacamole). Do not introduce Postgres here.
#
# Reverse Tunnel Gateway (idle until reverse_tunnel commissioning):
#   export RA_TUNNEL_TOKEN_SECRET=… RA_TUNNEL_GATEWAY_ADMIN_KEY=…
#   # Keep RA_TRANSPORT=direct_rdp (do not set reverse_tunnel here)
#   docker compose -f docker-compose.production.yml --profile guacamole \
#     up -d reverse-tunnel-gateway
# Optional host publish (explicit override only):
#   docker compose -f docker-compose.production.yml \
#     -f docker-compose.ra-gateway-host-publish.yml \
#     --profile guacamole up -d reverse-tunnel-gateway
services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile

    image: iic_booking_production_django
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./.envs/.production/.django
    environment:
      TZ: Asia/Kolkata
    # Named volume is for migration leftovers only. Equipment images MUST live in S3
    # (ALLOW_LOCAL_EQUIPMENT_IMAGE_FALLBACK=False in production). Never run
    # `docker compose down -v` — and do not treat this volume as the image source of truth.
    volumes:
      - production_media:/app/iic_booking/media
    # App binds to 5000 (gunicorn in start script); expose as 8000 on host
    ports:
      - '8080:5000'
    command: /start
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/analysis/health/ready/', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: docker.io/redis:7.2
    container_name: iic_booking_production_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - production_redis:/data
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  celeryworker:
    <<: *django
    image: iic_booking_production_celeryworker
    command: /start-celeryworker
    ports: []
    healthcheck:
      disable: true

  celerybeat:
    <<: *django
    image: iic_booking_production_celerybeat
    command: /start-celerybeat
    ports: []
    healthcheck:
      disable: true

  flower:
    <<: *django
    image: iic_booking_production_flower
    command: /start-flower
    ports:
      - '5555:5555'
    healthcheck:
      disable: true
    profiles: ["flower"]

  # Idle Reverse Tunnel Gateway for RC1 Phase 2. Does not enable reverse_tunnel.
  # Joins the same default project network as django (Portal → admin HTTP).
  # No host ports by default. No local Postgres. Does not alter django/celery/redis.
  reverse-tunnel-gateway:
    profiles: ["guacamole"]
    build:
      context: ../ReverseTunnelGateway
      dockerfile: Dockerfile
    image: reverse-tunnel-gateway:1.0.0-RT-RC1
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      RA_TUNNEL_TOKEN_SECRET: ${RA_TUNNEL_TOKEN_SECRET:?Set RA_TUNNEL_TOKEN_SECRET to a strong secret}
      RA_TUNNEL_GATEWAY_ADMIN_KEY: ${RA_TUNNEL_GATEWAY_ADMIN_KEY:?Set RA_TUNNEL_GATEWAY_ADMIN_KEY}
      RA_TUNNEL_ADAPTER_HOSTNAME: reverse-tunnel-gateway
      Tunnel__TokenSecret: ${RA_TUNNEL_TOKEN_SECRET}
      Tunnel__AdminKey: ${RA_TUNNEL_GATEWAY_ADMIN_KEY}
      Tunnel__AdapterHostname: reverse-tunnel-gateway
      ASPNETCORE_URLS: http://0.0.0.0:7090
    # Internal Docker network only — no ports: published to the host.
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/7090' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  production_traefik:
  production_media:
  production_redis:
