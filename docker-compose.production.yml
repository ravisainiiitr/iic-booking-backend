# Harden existing production compose (additive — does not change app logic).
# Prefer docker-compose.ra-production.yml for a full fresh-server RA stack (includes Postgres + Guacamole).
services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile

    image: iic_booking_production_django
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./.envs/.production/.django
    environment:
      TZ: Asia/Kolkata
      PORTAL_VERSION: ${PORTAL_VERSION:-2.5.2}
      GIT_SHA: ${GIT_SHA:-}
      BACKEND_GIT_COMMIT: ${BACKEND_GIT_COMMIT:-}
      FRONTEND_VERSION: ${FRONTEND_VERSION:-}
      FRONTEND_GIT_COMMIT: ${FRONTEND_GIT_COMMIT:-}
      BUILD_DATE: ${BUILD_DATE:-}
      PROVISIONING_VERSION: ${PROVISIONING_VERSION:-2.0}
      PROVISIONING_ENABLED: ${PROVISIONING_ENABLED:-true}
      COMPATIBLE_FRONTEND_MIN: ${COMPATIBLE_FRONTEND_MIN:-2.5.2-r2}
      COMPATIBLE_BACKEND_MIN: ${COMPATIBLE_BACKEND_MIN:-2.5.2}
      RESEARCH_COPILOT_ENABLED: ${RESEARCH_COPILOT_ENABLED:-true}
      RESEARCH_COPILOT_VERSION: ${RESEARCH_COPILOT_VERSION:-0.1.0}
      # AI.18 — Ollama default; OPENAI_API_KEY not required. Keep Copilot OFF until pilot.
      COPILOT_PROVIDER: ${COPILOT_PROVIDER:-ollama}
      COPILOT_LLM_PROVIDER: ${COPILOT_LLM_PROVIDER:-${COPILOT_PROVIDER:-ollama}}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      RESEARCH_COPILOT_MAX_CONCURRENT: ${RESEARCH_COPILOT_MAX_CONCURRENT:-2}
      RESEARCH_COPILOT_LLM_TIMEOUT_SECONDS: ${RESEARCH_COPILOT_LLM_TIMEOUT_SECONDS:-60}
      RESEARCH_COPILOT_PILOT_EMAILS: ${RESEARCH_COPILOT_PILOT_EMAILS:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://equip.iitr.ac.in}
    # Named volume is for migration leftovers only. Equipment images MUST live in S3
    # (ALLOW_LOCAL_EQUIPMENT_IMAGE_FALLBACK=False in production). Never run
    # `docker compose down -v` — and do not treat this volume as the image source of truth.
    volumes:
      - production_media:/app/iic_booking/media
    # Reach EC2 host MySQL via host-gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # App binds to 5000 (gunicorn in start script); expose as 8000 on host
    ports:
      - '8080:5000'
    command: /start
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/analysis/health/ready/', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: docker.io/redis:7.2
    container_name: iic_booking_production_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - production_redis:/data
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  celeryworker:
    <<: *django
    image: iic_booking_production_celeryworker
    command: /start-celeryworker
    ports: []
    healthcheck:
      disable: true

  celerybeat:
    <<: *django
    image: iic_booking_production_celerybeat
    command: /start-celerybeat
    ports: []
    healthcheck:
      disable: true

  flower:
    <<: *django
    image: iic_booking_production_flower
    command: /start-flower
    ports:
      - '5555:5555'
    healthcheck:
      disable: true
    profiles: ["flower"]

volumes:
  production_traefik:
  production_media:
  production_redis:
