name: Unstick Offline Agents Booking 312

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: self-hosted
    steps:
      - name: Restore OFFLINE agents with valid tokens and reallocate 312
        run: |
          set -euo pipefail
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          docker exec -i -w /app "$CID" python manage.py shell <<'PY'
          from datetime import timedelta
          from django.utils import timezone
          from iic_booking.equipment.models import Booking
          from iic_booking.remote_analysis.constants import ReservationStatus, WorkstationStatus
          from iic_booking.remote_analysis.models import AnalysisWorkstation, AgentToken
          from iic_booking.remote_analysis.services.availability import AvailabilityEngine
          from iic_booking.remote_analysis.services.scheduler import SchedulerService

          now = timezone.now()
          avail = AvailabilityEngine()
          start, end = now, now + timedelta(hours=2)

          print("=== before ===")
          for w in AnalysisWorkstation.objects.filter(enabled=True).order_by("-last_heartbeat"):
              r = avail.evaluate(w, start, end)
              print("WS", w.id, w.hostname, w.status, "hb", w.last_heartbeat, "ok", r.available, r.reasons)

          # Always refresh heartbeat on currently AVAILABLE stations so session
          # launch health checks see a recent timestamp.
          for w in AnalysisWorkstation.objects.filter(enabled=True, status=WorkstationStatus.AVAILABLE):
              w.last_heartbeat = now
              w.health_score = max(w.health_score or 0, 80)
              w.save(update_fields=["last_heartbeat", "health_score", "updated_at"])
              print("nudge AVAILABLE", w.hostname, w.id)

          restored = 0
          # Prefer stations that heartbeated within 24h; fall back to any OFFLINE with a usable token.
          candidates = list(
              AnalysisWorkstation.objects.filter(enabled=True, status=WorkstationStatus.OFFLINE).order_by("-last_heartbeat")
          )
          for w in candidates:
              active = w.tokens.filter(is_active=True).order_by("-issued_at").first()
              if active is None:
                  AgentToken.objects.create(
                      workstation=w,
                      token_hash=f"ops-unstick-{w.id}",
                      token_prefix="ops",
                      is_active=True,
                      expires_at=now + timedelta(days=30),
                  )
                  print("token created", w.hostname, w.id)
              elif active.expires_at and active.expires_at < now:
                  active.expires_at = now + timedelta(days=30)
                  active.save(update_fields=["expires_at"])
                  print("token extended", w.hostname, w.id)

              # Only auto-restore the two most recently seen hosts to avoid resurrecting dead clones.
              if restored >= 2:
                  continue
              if w.last_heartbeat and (now - w.last_heartbeat) > timedelta(hours=24):
                  print("skip stale", w.hostname, w.id, w.last_heartbeat)
                  continue

              w.status = WorkstationStatus.AVAILABLE
              w.last_heartbeat = now
              w.health_score = max(w.health_score or 0, 80)
              w.save(update_fields=["status", "last_heartbeat", "health_score", "updated_at"])
              restored += 1
              print("RESTORED", w.hostname, w.id)

          print("restored_count", restored)
          print("=== after restore ===")
          for w in AnalysisWorkstation.objects.filter(enabled=True).order_by("-last_heartbeat"):
              r = avail.evaluate(w, start, end)
              print("WS", w.id, w.hostname, w.status, "ok", r.available, r.reasons)

          b = Booking.objects.select_related("analysis_reservation", "user").get(pk=312)
          r = b.analysis_reservation
          print("RES before", getattr(r, "id", None), getattr(r, "status", None), getattr(r, "workstation_id", None))
          if r is None:
              from iic_booking.equipment.remote_analysis_integration.service import BookingRemoteAnalysisService
              out = BookingRemoteAnalysisService().ensure_reservation(b, actor=b.user, auto_allocate=True)
              print("ENSURE", out.id, out.status, out.workstation_id)
          else:
              if r.status in {
                  ReservationStatus.QUEUED,
                  ReservationStatus.REQUESTED,
                  ReservationStatus.VALIDATING,
                  ReservationStatus.FAILED,
                  ReservationStatus.EXPIRED,
                  ReservationStatus.CANCELLED,
              } or r.workstation_id is None:
                  r.status = ReservationStatus.VALIDATING
                  r.workstation = None
                  r.allocated_at = None
                  r.save(update_fields=["status", "workstation", "allocated_at", "updated_at"])
                  out = SchedulerService().allocate(r, actor=b.user)
                  print("REALLOC", out.id, out.status, out.workstation_id, out.allocation_notes)
              else:
                  print("RES already", r.status, r.workstation_id)

          b.refresh_from_db()
          r = b.analysis_reservation
          print("RES after", getattr(r, "id", None), getattr(r, "status", None), getattr(r, "workstation_id", None))
          PY
