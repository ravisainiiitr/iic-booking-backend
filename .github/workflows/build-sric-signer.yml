# Builds the SRIC Invoice Signer (tools/sric_signer): the one-file Windows exe and its installer, as workflow
# artifacts only. No release is published and nothing is code-signed. A real PKCS#11 signing run is done against
# SoftHSM2 on Linux (a software token); a real USB DSC token cannot be tested in CI.
name: Build SRIC Invoice Signer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/sric_signer/**"
      - "iic_booking/gst_einvoice/dsc.py"
      - ".github/workflows/build-sric-signer.yml"
  push:
    branches: [hotfix/sample-label-courier-289]
    paths:
      - "tools/sric_signer/**"
      - ".github/workflows/build-sric-signer.yml"

permissions:
  contents: read

jobs:
  softhsm:
    name: Tests + real PKCS#11 signing (SoftHSM2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SoftHSM2
        run: sudo apt-get update -qq && sudo apt-get install -y -qq softhsm2
      - name: Install the signer's dependencies
        working-directory: tools/sric_signer
        run: python -m pip install -r requirements.txt -r packaging/build-requirements.txt
      - name: Tests (SoftHSM2 run must not be skipped)
        working-directory: tools/sric_signer
        run: |
          set -o pipefail
          python -m pytest tests -v -p no:cacheprovider -rs | tee pytest.log
          if grep -q "SKIPPED" pytest.log; then echo "::error::the SoftHSM2 signing tests were skipped"; exit 1; fi

  windows:
    name: Windows exe + installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup is not available" }
      - name: Build, self-test and package
        shell: pwsh
        run: tools/sric_signer/packaging/build.ps1 -Python python
      - name: Detection on a clean runner (no token software expected)
        shell: pwsh
        working-directory: tools/sric_signer
        run: python sric_signer.py --detect
      - uses: actions/upload-artifact@v4
        with:
          name: sric-invoice-signer-windows
          path: |
            tools/sric_signer/dist/SRIC Invoice Signer.exe
            tools/sric_signer/dist/SRIC-Invoice-Signer-Setup-*.exe
            tools/sric_signer/dist/self-test.txt
          if-no-files-found: error
          retention-days: 30
