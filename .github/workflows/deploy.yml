# Legacy auto-deploy on master push — DISABLED.
# Production rollout is tag-based via workflow "Deploy Backend" (SSH → EC2).
# Qualification remains workflow "Backend Release" on the Build Host.
name: Deploy Backend (legacy master push)

on:
  workflow_dispatch:
    inputs:
      notice:
        description: Use workflow "Deploy Backend" instead (SSH → EC2 by release tag)
        required: false
        type: string
        default: deprecated

jobs:
  redirect:
    name: Redirect to Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: Deprecation notice
        run: |
          echo "::warning::This legacy master-push deploy is retired."
          echo "1) Qualify tag with workflow: Backend Release"
          echo "2) Deploy with workflow: Deploy Backend (release_tag=<tag>)"
          echo "See docs/release/Backend-EC2-SSH-Deploy.md"
          exit 1
