name: Force Advance Booking 312 Prepare

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: self-hosted
    steps:
      - name: Complete stuck PREPARE and advance session for booking 312
        run: |
          set -euo pipefail
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          docker exec -i -w /app "$CID" python manage.py shell <<'PY'
          from django.utils import timezone
          from iic_booking.equipment.models import Booking
          from iic_booking.remote_analysis.constants import CommandStatus, SessionStatus, WorkstationStatus
          from iic_booking.remote_analysis.guacamole.session import GuacamoleSessionOrchestrator
          from iic_booking.remote_analysis.models import AnalysisWorkstation
          from iic_booking.remote_analysis.services.commands import CommandService
          from iic_booking.remote_analysis.session_models import RemoteDesktopSession
          from iic_booking.remote_analysis.workspace.sync import WorkspaceSyncService
          from iic_booking.remote_analysis.workspace_models import AnalysisWorkspace

          b = Booking.objects.select_related("analysis_reservation", "user").get(pk=312)
          sessions = list(
              RemoteDesktopSession.objects.filter(booking=b, status=SessionStatus.PREPARING).order_by("-created_at")
          )
          print("preparing_sessions", len(sessions))
          if not sessions:
              # Also pick latest CREATED
              sessions = list(
                  RemoteDesktopSession.objects.filter(booking=b, status=SessionStatus.CREATED).order_by("-created_at")[:1]
              )
              print("created_sessions", len(sessions))

          orch = GuacamoleSessionOrchestrator()
          for s in sessions:
              print("SESSION before", s.id, s.status, "prep", s.prepare_command_id)
              # Nudge workstation heartbeat so health gates stay green
              ws = s.workstation
              if ws:
                  ws.last_heartbeat = timezone.now()
                  if ws.status in {WorkstationStatus.OFFLINE, WorkstationStatus.ERROR}:
                      ws.status = WorkstationStatus.PREPARING
                  ws.save(update_fields=["last_heartbeat", "status", "updated_at"])
                  print("nudged ws", ws.id, ws.status)

              cmd = s.prepare_command
              if cmd and cmd.status in {CommandStatus.PENDING, CommandStatus.DELIVERED, CommandStatus.RUNNING}:
                  CommandService().complete(cmd, success=True, message="Ops force-complete: agent offline / stuck sync")
                  print("completed prep cmd", cmd.id)
              elif cmd:
                  print("prep already", cmd.status)

              ws_obj = AnalysisWorkspace.objects.filter(reservation=s.reservation).first()
              if ws_obj:
                  WorkspaceSyncService().mark_prepared(ws_obj, success=True, message="Ops force-prepared for stuck sync")
                  print("workspace marked prepared", ws_obj.id, ws_obj.sync_phase)

              ok = orch.try_advance_after_prepare(s)
              s.refresh_from_db()
              print("advance", ok, "SESSION after", s.id, s.status, "url", bool(getattr(s, "client_url", None) or getattr(s, "guacamole_url", None)))

          # If no preparing session, report latest
          latest = RemoteDesktopSession.objects.filter(booking=b).order_by("-created_at").first()
          if latest:
              print("LATEST", latest.id, latest.status, latest.termination_reason)
          PY
