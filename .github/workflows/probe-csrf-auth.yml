name: Probe CSRF Auth Settings

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: self-hosted
    steps:
      - name: Show live Django auth settings and recent CSRF logs
        run: |
          set -euo pipefail
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          echo "container=$CID"
          docker exec -i -w /app "$CID" python manage.py shell -c '
from django.conf import settings
print("AUTH_CLASSES", settings.REST_FRAMEWORK.get("DEFAULT_AUTHENTICATION_CLASSES"))
print("CSRF_COOKIE_HTTPONLY", getattr(settings, "CSRF_COOKIE_HTTPONLY", None))
print("CSRF_COOKIE_SECURE", getattr(settings, "CSRF_COOKIE_SECURE", None))
print("CSRF_COOKIE_NAME", getattr(settings, "CSRF_COOKIE_NAME", None))
print("CSRF_TRUSTED_ORIGINS", getattr(settings, "CSRF_TRUSTED_ORIGINS", None))
print("SESSION_COOKIE_SAMESITE", getattr(settings, "SESSION_COOKIE_SAMESITE", None))
print("SESSION_COOKIE_SECURE", getattr(settings, "SESSION_COOKIE_SECURE", None))
'
          docker logs --tail 200 "$CID" 2>&1 | grep -iE 'csrf|Forbidden|403' | tail -40 || true
