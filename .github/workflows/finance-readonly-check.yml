# READ-ONLY: finance readiness figures. Changes nothing: a read-only database session and a read-only mailbox.
# Run logs are public, so the figures are printed only encrypted, to the public key passed in. Script: scripts/ops/finance_readonly_check.py
name: Finance read-only check

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: 'Base64 of a PEM RSA public key (public; the results are encrypted to it)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - name: Collect and encrypt
        env:
          CHECK_PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          set -euo pipefail
          case "$CHECK_PUBLIC_KEY" in (*[!A-Za-z0-9+/=]*|'') echo "public_key must be base64"; exit 1 ;; esac
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          # The runner's checkout is sparse, so the script is read from git rather than from disk.
          git -C "$GITHUB_WORKSPACE" show HEAD:scripts/ops/finance_readonly_check.py \
            | docker exec -i -w /app -e CHECK_PUBLIC_KEY -e DJANGO_SETTINGS_MODULE=config.settings.production "$CID" python - 2>/dev/null
