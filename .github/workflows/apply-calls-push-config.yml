# Android call ringing (Firebase Cloud Messaging) on production.
#   set-fcm    : puts the Firebase service-account key from the repository secret CALLS_FCM_SERVICE_ACCOUNT_B64
#                (base64 of the JSON key file downloaded from Firebase) into the server environment as
#                CALLS_FCM_SERVICE_ACCOUNT_JSON, then proves it by getting a Google access token.
#   remove-fcm : removes it again (calls still ring in an open app and on the web).
# django and the Celery worker are recreated. The key is never printed; only its project ID and service-account
# e-mail are shown so you can see which Firebase project is in use.
name: Apply Calls Push Config

on:
  workflow_dispatch:
    inputs:
      action:
        description: "set-fcm | remove-fcm"
        required: true
        type: choice
        options: [set-fcm, remove-fcm]
      confirm:
        description: "Type PUSH to proceed"
        required: true

permissions:
  contents: read

jobs:
  apply:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Require confirmation
        run: test "${{ github.event.inputs.confirm }}" = "PUSH"

      - name: Check the key and update the env file
        env:
          ACTION: ${{ github.event.inputs.action }}
          FCM_B64: ${{ secrets.CALLS_FCM_SERVICE_ACCOUNT_B64 }}
        run: |
          set -euo pipefail
          DEPLOY=/home/ubuntu/iic-booking-backend
          ENV_FILE="$DEPLOY/.envs/.production/.django"
          test -f "$ENV_FILE"
          cp -p "$ENV_FILE" "$ENV_FILE.bak-calls-push-$(date -u +%Y%m%dT%H%M%SZ)"
          export ENV_FILE
          python3 <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          action = os.environ["ACTION"]
          env_file = Path(os.environ["ENV_FILE"])
          key = "CALLS_FCM_SERVICE_ACCOUNT_JSON"
          value = None
          if action == "set-fcm":
              raw = "".join((os.environ.get("FCM_B64") or "").split())
              if not raw:
                  raise SystemExit("repository secret CALLS_FCM_SERVICE_ACCOUNT_B64 is not set")
              try:
                  account = json.loads(base64.b64decode(raw, validate=True).decode("utf-8"))
              except Exception:
                  raise SystemExit("CALLS_FCM_SERVICE_ACCOUNT_B64 is not base64 of a JSON file")
              if account.get("type") != "service_account":
                  raise SystemExit("this is not a service-account key (google-services.json belongs to the app, not here)")
              missing = [k for k in ("project_id", "client_email", "private_key", "token_uri") if not account.get(k)]
              if missing:
                  raise SystemExit("the key is missing: " + ", ".join(missing))
              print("Firebase project:", account["project_id"], " service account:", account["client_email"])
              value = raw
          out, seen = [], False
          for line in env_file.read_text(encoding="utf-8", errors="replace").splitlines():
              name = line.split("=", 1)[0].strip() if "=" in line and not line.lstrip().startswith("#") else None
              if name == key:
                  if value is not None and not seen:
                      out.append(f"{key}={value}")
                      seen = True
                  continue
              out.append(line)
          if value is not None and not seen:
              out.append(f"{key}={value}")
          env_file.write_text("\n".join(out).rstrip() + "\n", encoding="utf-8")
          print("action=", action, " done")
          PY
          cd "$DEPLOY"
          SERVICES="django"
          if docker compose -f docker-compose.production.yml config --services | grep -qx celeryworker; then SERVICES="django celeryworker"; fi
          docker compose -f docker-compose.production.yml up -d --force-recreate --no-deps $SERVICES
          for i in $(seq 1 30); do
            CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1 || true)"
            if [ -n "$CID" ] && docker exec "$CID" true 2>/dev/null; then break; fi
            sleep 2
          done
          sleep 6
          docker ps --format '{{.Names}} {{.Status}}' | grep -E 'django|celery' || true

      - name: Runtime verification
        run: |
          set -euo pipefail
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          docker exec -i -w /app -e DJANGO_SETTINGS_MODULE=config.settings.production "$CID" python - <<'PY'
          import django

          django.setup()
          from iic_booking.calls import push

          account = push._fcm_account()
          print("RUNTIME fcm_configured=", account is not None,
                " project=", (account or {}).get("project_id", "-"))
          if account is not None:
              try:
                  push._fcm_access_token(account)
                  print("Google accepted the key: access token obtained (not shown).")
              except Exception as exc:  # only the class, never the key
                  raise SystemExit(f"Google refused the key or could not be reached: {type(exc).__name__}")
          PY
