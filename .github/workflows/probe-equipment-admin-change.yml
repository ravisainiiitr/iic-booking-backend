name: Probe Equipment Admin Change

on:
  workflow_dispatch:
    inputs:
      equipment_id:
        description: Equipment primary key to load in admin form context
        required: true
        default: "37"

jobs:
  probe:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Render equipment admin change view
        env:
          EQUIPMENT_ID: ${{ inputs.equipment_id }}
        run: |
          set -euo pipefail
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          echo "container=$CID equipment_id=$EQUIPMENT_ID"
          docker exec -e EQUIPMENT_ID="$EQUIPMENT_ID" "$CID" python manage.py shell -c "
          import os, traceback
          from django.contrib.auth import get_user_model
          from django.test import RequestFactory
          from django.contrib.admin.sites import site
          from iic_booking.equipment.models import Equipment
          from iic_booking.equipment.admin import EquipmentAdmin

          eid = int(os.environ['EQUIPMENT_ID'])
          eq = Equipment.objects.get(pk=eid)
          print('equipment', eq.pk, eq.code, 'profile_type=', repr(eq.profile_type))
          print('cp_count', eq.charge_profiles.count())
          print('pubs', eq.publications.count() if hasattr(eq, 'publications') else 'n/a')
          User = get_user_model()
          admin_user = User.objects.filter(is_superuser=True).first() or User.objects.filter(is_staff=True).first()
          print('admin_user', getattr(admin_user, 'email', None))
          rf = RequestFactory()
          req = rf.get('/x/equipment/equipment/%s/change/' % eid)
          req.user = admin_user
          # Middleware bits some admin code expects
          from django.contrib.messages.storage.fallback import FallbackStorage
          setattr(req, 'session', {})
          setattr(req, '_messages', FallbackStorage(req))
          ma = EquipmentAdmin(Equipment, site)
          try:
              resp = ma.change_view(req, str(eid))
              print('status', getattr(resp, 'status_code', type(resp)))
              content = getattr(resp, 'content', b'')
              if getattr(resp, 'status_code', 200) >= 400:
                  print(content[:2000].decode('utf-8', 'replace'))
                  raise SystemExit(1)
              print('SUCCESS bytes', len(content))
          except Exception as exc:
              print('FAIL', type(exc).__name__, exc)
              traceback.print_exc()
              raise SystemExit(1)
          "
      - name: Recent django errors
        if: always()
        run: |
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          docker logs --tail 400 "$CID" 2>&1 | grep -E 'ERROR|Traceback|Exception|FieldError|ProgrammingError|TypeError|AttributeError|equipment/.*/change' | tail -n 80 || true
