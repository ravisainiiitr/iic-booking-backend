# Production Apache: serve HTTP/2 with longer keep-alive so each visitor reuses one connection
# instead of opening several (new connections to the server are slow on the network path).
# action=check only reports the current setup; keepalive only lengthens keep-alive (works with
# mpm_prefork + mod_php, graceful reload); apply switches mpm_prefork -> mpm_event, enables http2
# and the iic-http2 conf (refused while mod_php is loaded); revert restores mpm_prefork without
# http2 and removes the keep-alive conf.
# /etc/apache2 is backed up first; a failed configtest or health check restores the previous setup.
name: Apache HTTP/2

on:
  workflow_dispatch:
    inputs:
      action:
        description: check, keepalive, apply or revert
        required: true
        type: choice
        options: [check, keepalive, apply, revert]

jobs:
  http2:
    runs-on: [self-hosted, Linux]
    env:
      CONF: iic-http2
    steps:
      - name: Current setup
        run: |
          set -uo pipefail
          sudo -n apache2ctl -v | head -1
          echo "--- MPM / http2 / php modules"
          sudo -n apache2ctl -M 2>/dev/null | grep -Ei 'mpm_|http2|php|proxy_wstunnel|ssl' || true
          echo "--- keep-alive / protocols"
          sudo -n grep -RhiE '^\s*(KeepAlive|MaxKeepAliveRequests|KeepAliveTimeout|Protocols|Timeout)\b' \
            /etc/apache2/apache2.conf /etc/apache2/conf-enabled /etc/apache2/sites-enabled 2>/dev/null || true
          echo "--- sites and PHP usage"
          ls -1 /etc/apache2/sites-enabled
          sudo -n grep -RhiE '^\s*(DocumentRoot|Alias|ServerName|ServerAlias|.*\.php|SetHandler|ProxyPass\s)' \
            /etc/apache2/sites-enabled 2>/dev/null | sed 's/^\s*//' | sort -u || true
          for root in $(sudo -n grep -RhiE '^\s*DocumentRoot' /etc/apache2/sites-enabled 2>/dev/null | awk '{print $2}' | tr -d '"' | sort -u); do
            echo "php files under $root: $(sudo -n find "$root" -maxdepth 4 -name '*.php' 2>/dev/null | wc -l)"
          done
          echo "successful .php requests in current access logs (path, count):"
          sudo -n sh -c "cat /var/log/apache2/*access*.log 2>/dev/null" \
            | awk '$7 ~ /\.php/ && $9 ~ /^2/ {print $7}' | sed 's/?.*//' | sort | uniq -c | sort -rn | head -10 || true
          echo "--- PHP"
          php -v 2>/dev/null | head -1 || echo "php cli not installed"
          ls /etc/apache2/mods-enabled/ | grep -i php || true
          ls -d /etc/php/*/fpm 2>/dev/null || echo "no php-fpm installed"
          echo "php_value/php_flag in apache config or .htaccess (break under php-fpm):"
          sudo -n grep -RniE 'php_(admin_)?(value|flag)' /etc/apache2 2>/dev/null || true
          sudo -n find /var/www -maxdepth 5 -name .htaccess -exec grep -HniE 'php_(admin_)?(value|flag)' {} \; 2>/dev/null || true
          for d in /etc/php/*/apache2; do
            v=$(basename "$(dirname "$d")")
            echo "php.ini settings changed from production defaults ($v apache2):"
            diff <(grep -vE '^\s*(;|$)' "/usr/lib/php/$v/php.ini-production" | sort) \
                 <(sudo -n grep -vE '^\s*(;|$)' "$d/php.ini" | sort) | grep '^[<>]' || echo "  none"
            echo "extensions enabled for apache2 SAPI: $(ls "$d/conf.d" | sed 's/^[0-9]*-//; s/\.ini$//' | tr '\n' ' ')"
          done
          echo "--- public protocol"
          curl -sS -o /dev/null -m 15 --http2 -w 'equip https -> http_version=%{http_version} status=%{http_code}\n' \
            https://equip.iitr.ac.in/ || true

      - name: Keep-alive only
        if: inputs.action == 'keepalive'
        run: |
          set -euo pipefail
          KA=iic-keepalive
          sudo -n tee "/etc/apache2/conf-available/${KA}.conf" > /dev/null <<'EOF'
          # Managed by the "Apache HTTP/2" workflow (iic-booking-backend).
          KeepAlive On
          MaxKeepAliveRequests 1000
          KeepAliveTimeout 15
          EOF
          sudo -n a2enconf -q "$KA"
          if ! sudo -n apache2ctl configtest; then
            echo "configtest failed: rolling back"
            sudo -n a2disconf -q "$KA" || true
            sudo -n rm -f "/etc/apache2/conf-available/${KA}.conf"
            exit 1
          fi
          sudo -n systemctl reload apache2
          echo "keep-alive conf enabled and apache reloaded"

      - name: Apply
        if: inputs.action == 'apply'
        run: |
          set -euo pipefail
          # mod_php only works with mpm_prefork, so PHP sites move to php-fpm (same php.ini
          # defaults, same www-data user and session dir).
          PHPV=$(ls /etc/apache2/mods-enabled/ | sed -n 's/^php\([0-9.]*\)\.load$/\1/p' | head -1)
          if [ -n "$PHPV" ] && [ ! -x "/usr/sbin/php-fpm${PHPV}" ]; then
            echo "mod_php ${PHPV} is loaded but php${PHPV}-fpm is not installed. Aborting."
            exit 1
          fi
          BACKUP="/var/backups/apache2-$(date +%Y%m%d-%H%M%S).tgz"
          sudo -n tar -czf "$BACKUP" -C /etc apache2
          echo "backup: $BACKUP"
          restore() {
            echo "restoring previous setup from $BACKUP"
            sudo -n rm -rf /etc/apache2
            sudo -n tar -xzf "$BACKUP" -C /etc
            sudo -n apache2ctl configtest && sudo -n systemctl restart apache2
          }
          trap 'echo "unexpected failure"; restore' ERR
          PHP_SITES=$(sudo -n grep -lRi 'SetHandler application/x-httpd-php' /etc/apache2/sites-available || true)

          if [ -n "$PHPV" ]; then
            SOCK="/run/php/php${PHPV}-fpm.sock"
            missing=""
            for ini in /etc/php/${PHPV}/apache2/conf.d/*.ini; do
              name=$(basename "$ini" .ini | sed 's/^[0-9]*-//')
              ls /etc/php/${PHPV}/fpm/conf.d/ | grep -q -- "-${name}\.ini$" || missing="$missing $name"
            done
            if [ -n "$missing" ]; then
              echo "enabling for fpm:$missing"
              sudo -n phpenmod -v "$PHPV" -s fpm $missing
            fi
            sudo -n systemctl enable --now "php${PHPV}-fpm"
            sudo -n systemctl restart "php${PHPV}-fpm"
            sleep 2
            [ -S "$SOCK" ] || { echo "php-fpm socket $SOCK missing. Aborting."; exit 1; }
            for f in $PHP_SITES; do
              sudo -n sed -i "s#SetHandler application/x-httpd-php#SetHandler \"proxy:unix:${SOCK}|fcgi://localhost\"#I" "$f"
              echo "php handler -> php-fpm in $f"
            done
            sudo -n a2dismod -q "php${PHPV}"
            sudo -n a2enmod -q proxy_fcgi setenvif
            sudo -n a2enconf -q "php${PHPV}-fpm"
          fi
          sudo -n tee "/etc/apache2/conf-available/${CONF}.conf" > /dev/null <<'EOF'
          # Managed by the "Apache HTTP/2" workflow (iic-booking-backend).
          Protocols h2 http/1.1
          KeepAlive On
          MaxKeepAliveRequests 1000
          KeepAliveTimeout 15
          EOF

          sudo -n a2dismod -q mpm_prefork || true
          sudo -n a2enmod -q mpm_event http2
          sudo -n a2enconf -q "$CONF"
          sudo -n a2disconf -q iic-keepalive || true
          trap - ERR
          if ! sudo -n apache2ctl configtest; then
            echo "configtest failed"
            restore
            exit 1
          fi
          sudo -n systemctl restart apache2
          sleep 3

          ok=1
          for path in / /api/health/; do
            code=$(curl -sk -o /dev/null -m 20 -w '%{http_code}' \
              --resolve equip.iitr.ac.in:443:127.0.0.1 "https://equip.iitr.ac.in${path}" || echo 000)
            echo "local https equip${path} -> ${code}"
            case "$code" in 2*|3*|401|403|404|405) ;; *) ok=0 ;; esac
          done
          if [ -n "$PHP_SITES" ]; then
            for path in / /index.php; do
              body=$(curl -sk -m 20 --resolve iicbooking.iitr.ac.in:443:127.0.0.1 \
                -w '\nHTTP_STATUS=%{http_code}' "https://iicbooking.iitr.ac.in${path}" || true)
              code=$(printf '%s' "$body" | sed -n 's/^HTTP_STATUS=//p')
              echo "local https iicbooking${path} -> ${code}"
              if [ "$code" != 200 ] || printf '%s' "$body" | grep -q '<?php' \
                 || ! printf '%s' "$body" | grep -q '<title>'; then
                echo "php site check failed (status, raw source or missing page)"
                ok=0
              fi
            done
          fi
          if [ "$ok" != 1 ] || ! systemctl is-active --quiet apache2; then
            echo "health check failed"
            restore
            exit 1
          fi
          echo "mpm_event + http2 active"

      - name: Revert
        if: inputs.action == 'revert'
        run: |
          set -euo pipefail
          # Restores /etc/apache2 as it was before the last apply (mod_php, prefork, keep-alive conf).
          BACKUP=$(ls -1t /var/backups/apache2-*.tgz 2>/dev/null | head -1 || true)
          if [ -n "$BACKUP" ]; then
            echo "restoring $BACKUP"
            sudo -n rm -rf /etc/apache2
            sudo -n tar -xzf "$BACKUP" -C /etc
          else
            for c in "$CONF" iic-keepalive; do
              sudo -n a2disconf -q "$c" || true
              sudo -n rm -f "/etc/apache2/conf-available/${c}.conf"
            done
            sudo -n a2dismod -q http2 || true
            sudo -n a2dismod -q mpm_event || true
            sudo -n a2enmod -q mpm_prefork
          fi
          sudo -n apache2ctl configtest
          sudo -n systemctl restart apache2
          echo "reverted"

      - name: Verify
        if: inputs.action != 'check'
        run: |
          sleep 2
          sudo -n apache2ctl -M 2>/dev/null | grep -Ei 'mpm_|http2' || true
          for host in equip.iitr.ac.in iicbooking.iitr.ac.in; do
            curl -sS -o /dev/null -m 20 --http2 -w "public $host -> http_version=%{http_version} status=%{http_code}\n" \
              "https://$host/" || true
          done
          curl -sS -o /dev/null -m 20 -w 'public api -> status=%{http_code}\n' https://equip.iitr.ac.in/api/health/ || true
