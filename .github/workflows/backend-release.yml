# Backend Release — hardened (Phase C.1)
# Tag push: verify only. Build/publish: workflow_dispatch only.
name: Backend Release

on:
  push:
    tags:
      - 'v2.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v2.5.0-rc1)
        required: true
        type: string
      dry_run:
        description: Build only — no ECR login/push (default true)
        type: boolean
        default: true
      publish:
        description: Explicit ECR publish request (requires dry_run=false + release-ecr)
        type: boolean
        default: false
      allow_partial_validation:
        description: Allow PARTIAL VALIDATION when full compose tests unavailable
        type: boolean
        default: false
      skip_tests:
        description: Skip test job entirely (not recommended)
        type: boolean
        default: false

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  actions: read

env:
  DOCKER_BUILDKIT: '1'
  COMPOSE_DOCKER_CLI_BUILD: '1'
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_PREFIX: ${{ vars.ECR_PREFIX || 'iic' }}

jobs:
  verify_tag:
    name: Verify release tag
    runs-on: [self-hosted, windows, iic-build]
    environment: release-build
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.sha.outputs.sha }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      publish: ${{ steps.meta.outputs.publish }}
      mode: ${{ steps.meta.outputs.mode }}
    steps:
      - name: Resolve mode
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $tag = '${{ inputs.tag }}'
            $dry = '${{ inputs.dry_run }}'
            $publish = '${{ inputs.publish }}'
            $mode = 'dispatch'
          } else {
            $tag = $env:GITHUB_REF_NAME
            $dry = 'true'
            $publish = 'false'
            $mode = 'tag_verify_only'
          }
          if ($publish -eq 'true' -and $dry -eq 'true') {
            throw 'Invalid inputs: publish=true requires dry_run=false'
          }
          if ($mode -eq 'tag_verify_only') {
            Write-Host 'TAG PUSH MODE: verification only — no build, no ECR login, no publish'
          }
          $version = $tag.TrimStart('v')
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "dry_run=$dry" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
          "mode=$mode" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.meta.outputs.tag }}
          fetch-depth: 0

      - name: Verify SHA
        id: sha
        shell: pwsh
        run: |
          $sha = & .\scripts\release\Verify-ReleaseTag.ps1 -Tag '${{ steps.meta.outputs.tag }}'
          "sha=$($sha.Trim())" >> $env:GITHUB_OUTPUT
          Write-Host "SHA=$($sha.Trim()) mode=${{ steps.meta.outputs.mode }}"

  test:
    name: Backend tests
    needs: verify_tag
    if: needs.verify_tag.outputs.mode == 'dispatch' && inputs.skip_tests != true
    runs-on: [self-hosted, windows, iic-build]
    outputs:
      validation_level: ${{ steps.gate.outputs.validation_level }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.verify_tag.outputs.tag }}
          fetch-depth: 0
      - name: Inject Build Host local config
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = 'C:\iic-build\config\backend\.envs\.local\.django'
          if (-not (Test-Path -LiteralPath $src)) {
            throw "Build Host config missing: $src. Place non-production operator .django at that path (see C:\iic-build\config\backend)."
          }
          $destDir = Join-Path $env:GITHUB_WORKSPACE '.envs\.local'
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          $dest = Join-Path $destDir '.django'
          Copy-Item -LiteralPath $src -Destination $dest -Force
          if (-not (Test-Path -LiteralPath $dest)) {
            throw "Failed to materialize workspace config at $dest"
          }
          Write-Host "Build Host config injected (presence only). dest_exists=True"
      - name: Cleanup local compose before test gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          docker compose -f docker-compose.local.yml down --remove-orphans
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No existing compose environment to remove."
          }
      - name: Test gate (no silent pass)
        id: gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspaceDjango = Join-Path $env:GITHUB_WORKSPACE '.envs\.local\.django'
          if (-not (Test-Path -LiteralPath $workspaceDjango)) {
            throw "Pre-compose check failed: $workspaceDjango is missing after Build Host inject."
          }
          Write-Host 'Pre-compose .envs/.local/.django present=True'
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          $level = 'UNKNOWN'
          if (Test-Path docker-compose.local.yml) {
            docker compose -f docker-compose.local.yml run --rm django pytest -q
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $level = 'FULL'
          } else {
            Write-Warning 'docker-compose.local.yml missing — attempting production-compose pytest'
            if (Test-Path docker-compose.production.yml) {
              docker compose -f docker-compose.production.yml run --rm --no-deps django pytest -q
              if ($LASTEXITCODE -eq 0) {
                $level = 'FULL'
              } else {
                Write-Warning "pytest via production compose failed with $LASTEXITCODE"
                $level = 'PARTIAL'
              }
            } else {
              $level = 'PARTIAL'
            }
          }
          Set-Content artifacts/release/validation-level.txt $level -Encoding ascii
          "validation_level=$level" >> $env:GITHUB_OUTPUT
          if ($level -eq 'PARTIAL') {
            Write-Host 'RELEASE VALIDATION LEVEL: PARTIAL VALIDATION'
            if ('${{ inputs.allow_partial_validation }}' -ne 'true') {
              throw 'PARTIAL VALIDATION is not allowed. Re-run with allow_partial_validation=true or provide working test compose.'
            }
            Write-Warning 'Continuing with PARTIAL VALIDATION by explicit operator consent'
          } else {
            Write-Host "RELEASE VALIDATION LEVEL: $level"
          }
      - name: Cleanup local compose after test gate
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          docker compose -f docker-compose.local.yml down --remove-orphans
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Post-test compose cleanup reported non-zero exit."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: backend-validation-${{ needs.verify_tag.outputs.version }}
          path: artifacts/release/validation-level.txt
          retention-days: 90

  build_images:
    name: Build Docker images
    needs: [verify_tag, test]
    if: |
      always() &&
      needs.verify_tag.outputs.mode == 'dispatch' &&
      needs.verify_tag.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: [self-hosted, windows, iic-build]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.verify_tag.outputs.tag }}
          fetch-depth: 0
      - name: Build images
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          docker compose -f docker-compose.production.yml build django celeryworker celerybeat
          docker compose -f docker-compose.production.yml --profile flower build flower
          $v = '${{ needs.verify_tag.outputs.version }}'
          foreach ($s in @('django','celeryworker','celerybeat','flower')) {
            docker tag "iic_booking_production_$s" "iic_booking_production_${s}:$v"
          }
      - name: Record digests, SBOM, image ID ledger (separate from installer SHA256)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          $v = '${{ needs.verify_tag.outputs.version }}'
          $imgs = @(
            "iic_booking_production_django:$v",
            "iic_booking_production_celeryworker:$v",
            "iic_booking_production_celerybeat:$v",
            "iic_booking_production_flower:$v"
          )
          & .\scripts\release\Record-ImageDigests.ps1 -Images $imgs -OutFile artifacts/release/backend-images.json -Version $v
          & .\scripts\release\New-ImageSbom.ps1 -Image "iic_booking_production_django:$v" -OutFile artifacts/release/sbom-django.cdx.json
          $ids = @('# Docker image IDs (NOT installer SHA256)')
          foreach ($i in $imgs) {
            $id = (docker image inspect $i --format '{{.Id}}').Trim()
            $ids += "$id  $i"
          }
          $ids | Set-Content artifacts/release/docker-image-ids.txt -Encoding ascii
          @{
            artifact_types = @('docker_image_digest','docker_image_id','sbom')
            note = 'Installer SHA256 files are produced by DSA/RAA workflows, not this job'
          } | ConvertTo-Json | Set-Content artifacts/release/artifact-index.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: backend-release-${{ needs.verify_tag.outputs.version }}
          path: artifacts/release/
          retention-days: 90

  publish_gate:
    name: Publish prerequisites
    needs: [verify_tag, build_images]
    if: needs.verify_tag.outputs.mode == 'dispatch' && needs.verify_tag.outputs.publish == 'true' && needs.verify_tag.outputs.dry_run != 'true'
    runs-on: [self-hosted, windows, iic-build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Assert publish gate
        shell: pwsh
        env:
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          AWS_ROLE_ARN_ECR_PUSH: ${{ secrets.AWS_ROLE_ARN_ECR_PUSH }}
        run: |
          & .\scripts\release\Assert-PublishGate.ps1 `
            -EnvironmentName release-ecr `
            -RequiredVars @('ECR_REGISTRY') `
            -RequiredSecretNames @('AWS_ROLE_ARN_ECR_PUSH') `
            -EcrRegistry $env:ECR_REGISTRY `
            -RequirePublishDispatch `
            -EventName '${{ github.event_name }}' `
            -PublishFlag '${{ needs.verify_tag.outputs.publish }}'

  push_ecr:
    name: Push to AWS ECR
    needs: [verify_tag, build_images, publish_gate]
    if: needs.verify_tag.outputs.mode == 'dispatch' && needs.verify_tag.outputs.publish == 'true' && needs.verify_tag.outputs.dry_run != 'true'
    runs-on: [self-hosted, windows, iic-build]
    environment: release-ecr
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.verify_tag.outputs.tag }}
          fetch-depth: 1
      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_ECR_PUSH }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login + push
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:ECR_REGISTRY) { throw 'ECR_REGISTRY variable is required' }
          aws ecr get-login-password --region $env:AWS_REGION | docker login --username AWS --password-stdin $env:ECR_REGISTRY
          $v = '${{ needs.verify_tag.outputs.version }}'
          $map = @{
            django = 'booking-django'
            celeryworker = 'booking-celeryworker'
            celerybeat = 'booking-celerybeat'
            flower = 'booking-flower'
          }
          foreach ($k in $map.Keys) {
            $src = "iic_booking_production_${k}:$v"
            $dst = "$($env:ECR_REGISTRY)/$($env:ECR_PREFIX)/$($map[$k]):$v"
            docker tag $src $dst
            docker push $dst
            Write-Host "PUSHED $dst"
          }
          docker logout $env:ECR_REGISTRY

  tag_verify_complete:
    name: Tag verify-only complete
    needs: verify_tag
    if: needs.verify_tag.outputs.mode == 'tag_verify_only'
    runs-on: [self-hosted, windows, iic-build]
    steps:
      - shell: pwsh
        run: |
          Write-Host "Tag ${{ needs.verify_tag.outputs.tag }} verified at ${{ needs.verify_tag.outputs.sha }}"
          Write-Host 'No build / no ECR / no deploy performed on tag push.'
