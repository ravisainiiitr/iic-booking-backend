# Read-only connectivity/IMAP verification against mail.iitr.ac.in from the production Django container.
# No application, database, or mailbox changes. Credentials come from the container env (IMAP_USER / IMAP_PASSWORD).
name: Probe IITR Zimbra IMAP mail.iitr.ac.in

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    steps:
      - name: Zimbra IMAP connectivity retest
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/zimbra_probe.sh
          echo '' | base64 -d > /tmp/zimbra_probe.py
          bash /tmp/zimbra_probe.sh