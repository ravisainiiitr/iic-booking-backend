# PoC only: DNS/TCP/TLS/IMAP against mail.iitr.ac.in from production Django container.
# Does not modify application code or database. Credentials from GitHub secrets only.
name: Probe IITR Zimbra IMAP mail.iitr.ac.in

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Connectivity and IMAP PoC
        env:
          IITR_IMAP_USERNAME: ${{ secrets.IMAP_USER }}
          IITR_IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${IITR_IMAP_USERNAME:-}"
          test -n "${IITR_IMAP_PASSWORD:-}"
          echo '' | base64 -d > /tmp/probe_mail_iitr.sh
          chmod +x /tmp/probe_mail_iitr.sh
          bash /tmp/probe_mail_iitr.sh