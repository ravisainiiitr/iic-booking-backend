name: Diagnose RAVI RDP Secret Presence

# Safe: never prints password / ciphertext. Linux EC2 runner only.

on:
  workflow_dispatch:
    inputs:
      booking_id:
        required: true
        default: "IICPXRD [A]202600041"

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Check RDP secret + latest session failures (no secrets)
        env:
          BID: ${{ github.event.inputs.booking_id }}
        run: |
          set -euo pipefail
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          docker exec -e BID="$BID" -w /app "$CID" python manage.py shell -c "
          import os, json
          from django.utils import timezone
          from iic_booking.equipment.models import Booking
          from iic_booking.remote_analysis.models import AnalysisWorkstation
          from iic_booking.remote_analysis.session_models import RemoteDesktopSession, WorkstationRdpSecret
          bid=os.environ['BID'].strip()
          b=Booking.objects.filter(virtual_booking_id=bid).first()
          print('BOOKING', b.pk if b else None, bid)
          for ws in AnalysisWorkstation.objects.filter(hostname__icontains='RAVI').order_by('-last_heartbeat'):
              secret=WorkstationRdpSecret.objects.filter(workstation=ws).first()
              age=int((timezone.now()-ws.last_heartbeat).total_seconds()) if ws.last_heartbeat else None
              print(json.dumps({
                'hostname': ws.hostname,
                'status': ws.status,
                'hb_age_s': age,
                'rdp_secret_present': secret is not None,
                'rdp_username_set': bool(secret and (secret.username or '').strip()),
                'rdp_password_set': bool(secret and (secret.password_encrypted or '').strip()),
                'rdp_domain_set': bool(secret and (secret.domain or '').strip()),
                'rdp_port': getattr(secret,'port',None) if secret else None,
                'rdp_security': getattr(secret,'security',None) if secret else None,
              }, default=str))
          if b:
            for s in RemoteDesktopSession.objects.filter(booking=b).order_by('-created_at')[:8]:
              fail=(s.failure_detail or s.termination_reason or '')[:240]
              print(json.dumps({'session':str(s.id),'status':s.status,'failure':fail}, default=str))
          "
