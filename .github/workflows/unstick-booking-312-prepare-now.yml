name: Unstick Booking 312 Prepare Now

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: self-hosted
    steps:
      - name: Diagnose and force-advance stuck prepare for booking 312
        run: |
          set -euo pipefail
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          docker exec -i -w /app "$CID" python manage.py shell <<'PY'
          from django.utils import timezone
          from iic_booking.equipment.models import Booking
          from iic_booking.remote_analysis.constants import CommandStatus, SessionStatus, WorkstationStatus
          from iic_booking.remote_analysis.guacamole.session import SessionOrchestrator
          from iic_booking.remote_analysis.models import AnalysisWorkstation, RemoteCommand
          from iic_booking.remote_analysis.services.commands import CommandService
          from iic_booking.remote_analysis.session_models import RemoteDesktopSession, WorkstationRdpSecret
          from iic_booking.remote_analysis.workspace.sync import WorkspaceSyncService
          from iic_booking.remote_analysis.workspace_models import AnalysisWorkspace

          now = timezone.now()
          b = Booking.objects.select_related("analysis_reservation", "user", "analysis_workspace").get(pk=312)
          r = b.analysis_reservation
          print("BOOKING", b.pk, b.virtual_booking_id)
          print("RES", getattr(r, "id", None), getattr(r, "status", None), "ws", getattr(r, "workstation_id", None))

          for ws in AnalysisWorkstation.objects.filter(enabled=True).order_by("-last_heartbeat"):
              age = int((now - ws.last_heartbeat).total_seconds()) if ws.last_heartbeat else None
              secret = WorkstationRdpSecret.objects.filter(workstation=ws).first()
              print(
                  "WS", ws.id, ws.hostname, ws.status, "hb_age_s", age,
                  "rdp", bool(secret), "rdp_user", bool(secret and secret.username),
                  "rdp_pw", bool(secret and (secret.password_encrypted or "").strip()),
              )

          sessions = list(RemoteDesktopSession.objects.filter(booking=b).order_by("-created_at")[:5])
          for s in sessions:
              print("SESSION", s.id, s.status, "prep", s.prepare_command_id, "term", s.termination_reason, "created", s.created_at)
              if s.prepare_command_id:
                  c = s.prepare_command
                  age = int((now - c.created_at).total_seconds()) if c.created_at else None
                  print("  PREP", c.id, c.status, "age_s", age, "err", c.error_message, "result", c.result_message)

          # Cancel stale pending cleanup/collect that can block agent queue
          stale = RemoteCommand.objects.filter(
              workstation_id=getattr(r, "workstation_id", None),
              status__in=[CommandStatus.PENDING, CommandStatus.DELIVERED, CommandStatus.RUNNING],
              command_type__in=["CLEAN_WORKSTATION", "COLLECT_WORKSPACE"],
          )
          for c in stale:
              CommandService().complete(c, success=True, message="Ops clear stale queue ahead of prepare")
              print("cleared stale", c.id, c.command_type)

          orch = SessionOrchestrator()
          active = [s for s in sessions if s.status in {SessionStatus.PREPARING, SessionStatus.CREATED}]
          if not active and sessions:
              # relaunch path: if latest failed on timeout, user must refresh; still try advance if preparing elsewhere
              print("no active preparing session; latest=", sessions[0].id, sessions[0].status)

          for s in active:
              ws = s.workstation
              if ws:
                  ws.last_heartbeat = now
                  if ws.status == WorkstationStatus.OFFLINE:
                      ws.status = WorkstationStatus.PREPARING
                  ws.save(update_fields=["last_heartbeat", "status", "updated_at"])
              cmd = s.prepare_command
              if cmd and cmd.status in {CommandStatus.PENDING, CommandStatus.DELIVERED, CommandStatus.RUNNING}:
                  # Prefer letting live agent complete; if pending > 90s, force-complete
                  age = int((now - cmd.created_at).total_seconds()) if cmd.created_at else 9999
                  if age >= 90:
                      CommandService().complete(cmd, success=True, message="Ops force-complete stuck prepare (>90s)")
                      print("force completed prep", cmd.id, "age", age)
                  else:
                      print("prep still young", cmd.id, "age", age, "waiting for agent")
              ws_obj = AnalysisWorkspace.objects.filter(reservation=s.reservation).first()
              if ws_obj:
                  WorkspaceSyncService().mark_prepared(ws_obj, success=True, message="Ops mark prepared")
                  print("workspace prepared", ws_obj.id, ws_obj.sync_phase)
              try:
                  ok = orch.try_advance_after_prepare(s)
                  s.refresh_from_db()
                  print("advance", ok, "after", s.id, s.status, "term", s.termination_reason)
              except Exception as e:
                  s.refresh_from_db()
                  print("advance_err", type(e).__name__, e, "after", s.id, s.status, "term", s.termination_reason)

          latest = RemoteDesktopSession.objects.filter(booking=b).order_by("-created_at").first()
          if latest:
              print("LATEST", latest.id, latest.status, latest.termination_reason)
          PY
