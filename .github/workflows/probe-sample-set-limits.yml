name: Probe Sample Set Limits (read-only)

# Shows which equipment get the combined field A / B maximum across all sample sets
# (iic_booking/equipment/sample_set_limits.py) and why the others do not. Runs inside a READ ONLY
# transaction that is rolled back; prints equipment ids/names and input-field config only.

on:
  workflow_dispatch:
    inputs:
      name_filter:
        description: Equipment name fragment to print in detail
        required: false
        default: 'APREO'

jobs:
  probe:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Resolve combined A/B maxima per equipment (SELECT only)
        env:
          NAME_FILTER: ${{ github.event.inputs.name_filter }}
        run: |
          set -euo pipefail
          cd /home/ubuntu/iic-booking-backend
          CID=$(docker compose -f docker-compose.production.yml ps --format '{{.Name}}' | grep django | head -n1)
          docker exec -i -e NAME_FILTER="${NAME_FILTER:-APREO}" -w /app "$CID" python - <<'PY'
          import os
          import re
          from collections import Counter, defaultdict

          import django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings.production")
          django.setup()

          from django.db import connection, transaction

          from iic_booking.equipment import sample_set_limits as ssl
          from iic_booking.equipment.models import DynamicInputField, DynamicInputFieldType, Equipment, EquipmentStatus
          from iic_booking.equipment.numeric_field_limits import _to_float, parse_numeric_help_text

          NAME_FILTER = (os.environ.get("NAME_FILTER") or "APREO").strip()
          KEYS = ssl.COMBINED_LIMIT_FIELD_KEYS

          def help_lines(ht):
              if not ht or not str(ht).strip():
                  return []
              return str(ht).replace("\r\n", "\n").replace("\r", "\n").strip().split("\n")

          def classify(f):
              """(category, combined_max, reason) using the deployed sample_set_limits helpers."""
              if f.field_type != DynamicInputFieldType.NUMERIC:
                  return "non_numeric", None, f"not applied: field type {f.field_type} (only NUMERIC is checked)"
              if ssl._has_max_formula(f.options):
                  return "formula", None, "not applied: formula maximum (checked per sample set only)"
              v = ssl.configured_static_max(f)
              if v is None:
                  return "not_configured", None, "not applied: no options.max and no help-text max (UI default 100 is not summed)"
              src = "options.max" if isinstance(f.options, dict) and _to_float(f.options.get("max")) is not None else "help_text"
              return "applies", v, f"applies: combined max {ssl._pretty(v)} (from {src})"

          def warn_help_line2(f):
              lines = help_lines(f.help_text)
              if len(lines) >= 2 and lines[1].strip() and re.search(r"[A-Za-z]", lines[1]):
                  return f" WARNING help line 2 is not a plain number ({lines[1].strip()!r}); parser read {parse_numeric_help_text(f.help_text).get('max')}"
              return ""

          def describe(f):
              lines = help_lines(f.help_text)
              line2 = lines[1].strip() if len(lines) >= 2 else ("<single-line help_text>" if lines else "<no help_text>")
              raw_max = f.options.get("max") if isinstance(f.options, dict) else None
              cat, v, reason = classify(f)
              print(f"    field {f.field_key} user_type={f.user_type or '<shared>'!r} label={f.field_label!r} "
                    f"type={f.field_type} options={f.options!r} options.max={raw_max!r} help_line2={line2!r} "
                    f"help_parsed={parse_numeric_help_text(f.help_text)} -> {reason}{warn_help_line2(f)}")

          def short(eq):
              return f"{eq.equipment_id}:{(eq.name or '')[:60]}"

          # Where else could a per-field / per-booking maximum live? Only configuration columns whose names
          # look like limits are printed (numbers / booleans / formulas); no user, contact or booking rows.
          LIMIT_NAME = re.compile(r"max|min|limit|cap|quota|slot|duration|count|per_|consecutive|split|formula|window|advance", re.I)
          SKIP_NAME = re.compile(r"email|phone|mobile|contact|address|password|token|secret|user(?!_type)|oic|operator|image|video|file|url|name|description|note|comment", re.I)
          SKIP_MODEL = re.compile(r"booking|waitlist|request|log|history|notification|payment|invoice|feedback|message|wallet|transaction|audit|review|rating|attendance|template", re.I)

          def limit_columns(model):
              out = []
              for fld in model._meta.concrete_fields:
                  if fld.is_relation or not LIMIT_NAME.search(fld.name) or SKIP_NAME.search(fld.name):
                      continue
                  out.append(fld.name)
              return out

          def scan_limit_sources(eq):
              cols = limit_columns(Equipment)
              print("    equipment limit-like columns: " + str({c: getattr(eq, c) for c in cols}))
              for rel in Equipment._meta.related_objects:
                  model = rel.related_model
                  if SKIP_MODEL.search(model.__name__) or not getattr(rel, "field", None):
                      continue
                  cols = limit_columns(model)
                  if model is DynamicInputField:
                      cols = [f.name for f in model._meta.concrete_fields if not f.is_relation]
                  if not cols:
                      continue
                  try:
                      qs = model._default_manager.filter(**{rel.field.name: eq})
                      n = qs.count()
                  except Exception as exc:  # noqa: BLE001
                      print(f"    {model.__name__}: skipped ({type(exc).__name__})")
                      continue
                  if not n:
                      continue
                  print(f"    {model.__name__} rows={n} columns={cols}")
                  if model is DynamicInputField:
                      qs = qs.filter(field_key__in=KEYS)
                  seen = Counter(tuple((c, str(getattr(r, c))[:160]) for c in cols) for r in qs[:200])
                  for vals, cnt in seen.most_common(15):
                      print(f"      x{cnt} {dict(vals)}")
                  if model is Equipment:
                      print(f"      (reverse relation {rel.get_accessor_name()} via {rel.field.name})")
              group = getattr(eq, "equipment_group", None)
              print(f"    equipment_group: {getattr(group, 'pk', None)} {getattr(group, 'code', None)!r}")
              if group is not None:
                  from iic_booking.equipment.models import EquipmentGroupQuota
                  gq_cols = [f.name for f in EquipmentGroupQuota._meta.concrete_fields
                             if not f.is_relation and f.name not in ("id", "created_at", "updated_at")]
                  for q in EquipmentGroupQuota.objects.filter(equipment_group=group):
                      vals = {c: getattr(q, c) for c in gq_cols}
                      slots = {c: round(v / eq.slot_duration_minutes, 2) for c, v in vals.items()
                               if c.endswith("_minutes") and eq.slot_duration_minutes}
                      print(f"      EquipmentGroupQuota {vals} -> in {eq.slot_duration_minutes}-min slots: {slots}")

          with transaction.atomic():
              if connection.vendor == "postgresql":
                  with connection.cursor() as cur:
                      cur.execute("SET TRANSACTION READ ONLY")

              print(f"module helpers: {[n for n in dir(ssl) if not n.startswith('__')]}")

              print(f"\n== detail: equipment name contains {NAME_FILTER!r} (any status) ==")
              for eq in Equipment.objects.filter(name__icontains=NAME_FILTER).order_by("equipment_id"):
                  print(f"equipment id={eq.equipment_id} code={eq.code!r} status={eq.status} name={eq.name!r}")
                  rows = list(DynamicInputField.objects.filter(equipment=eq, field_key__in=KEYS).order_by("field_key", "user_type", "pk"))
                  if not rows:
                      print("    no A/B input fields")
                  for f in rows:
                      describe(f)
                  user_types = sorted({f.user_type for f in rows} | {""})
                  for ut in user_types:
                      eff = ssl.combined_limit_fields(eq, user_type=ut or None)
                      print(f"    combined_limit_fields(user_type={ut or '<shared/none>'!r}) = "
                            f"{[(k, l, ssl._pretty(m)) for k, l, m in eff]}")
                  scan_limit_sources(eq)

              print("\n== schema scan: per-booking slot / sample limit columns in any app ==")
              from django.apps import apps
              PER_BOOKING = re.compile(r"(max|limit|cap).*(slot|sample)|(slot|sample).*(max|limit|cap)|per_booking", re.I)
              for model in apps.get_models():
                  hits = [f.name for f in model._meta.concrete_fields if not f.is_relation and PER_BOOKING.search(f.name)]
                  if not hits:
                      continue
                  label = f"{model._meta.app_label}.{model.__name__}"
                  if SKIP_MODEL.search(model.__name__):
                      print(f"  {label}: {hits} (row values not printed)")
                      continue
                  try:
                      vals = {h: dict(Counter(str(v) for v in model._default_manager.values_list(h, flat=True)[:5000]).most_common(8)) for h in hits}
                  except Exception as exc:  # noqa: BLE001
                      vals = f"skipped ({type(exc).__name__})"
                  print(f"  {label}: {vals}")

              print("\n== summary: active equipment (status=ACTIVE) ==")
              active = list(Equipment.objects.filter(status=EquipmentStatus.ACTIVE).order_by("equipment_id"))
              by_eq = defaultdict(list)
              for f in DynamicInputField.objects.filter(equipment__in=active, field_key__in=KEYS).order_by("pk"):
                  by_eq[f.equipment_id].append(f)

              row_counts = {k: Counter() for k in KEYS}
              eq_status = {k: defaultdict(list) for k in KEYS}
              warnings = []
              for eq in active:
                  for k in KEYS:
                      rows = [f for f in by_eq.get(eq.equipment_id, []) if f.field_key == k]
                      if not rows:
                          eq_status[k]["no_field"].append(short(eq))
                          continue
                      cats = Counter()
                      maxes = set()
                      for f in rows:
                          cat, v, _ = classify(f)
                          row_counts[k][cat] += 1
                          cats[cat] += 1
                          if v is not None:
                              maxes.add(ssl._pretty(v))
                          w = warn_help_line2(f)
                          if w:
                              warnings.append(f"{short(eq)} field {k} user_type={f.user_type or '<shared>'!r}:{w}")
                      if set(cats) == {"applies"}:
                          eq_status[k]["applies"].append(f"{short(eq)} max={sorted(maxes)}")
                      elif "applies" in cats:
                          eq_status[k]["partial"].append(f"{short(eq)} rows={dict(cats)} max={sorted(maxes)}")
                      else:
                          eq_status[k][cats.most_common(1)[0][0]].append(short(eq))

              print(f"active equipment: {len(active)}")
              for k in KEYS:
                  print(f"\nfield {k}: input-field rows by category {dict(row_counts[k])}")
                  print(f"field {k}: equipment by category " + str({c: len(v) for c, v in eq_status[k].items()}))
              for k in KEYS:
                  for cat in ("formula", "not_configured", "non_numeric", "partial", "no_field"):
                      ids = eq_status[k].get(cat) or []
                      if ids:
                          print(f"\nfield {k} {cat} ({len(ids)}):")
                          for s in ids:
                              print(f"  {s}")
              b_no_fixed = [s.split(":")[0] for cat in ("formula", "not_configured", "non_numeric", "partial") for s in eq_status["B"].get(cat) or []]
              print(f"\nequipment ids whose B field has no fixed max (formula / not configured / non-numeric / partial): {sorted(b_no_fixed, key=int)}")
              print("help-text warnings:", warnings if warnings else "none")

              transaction.set_rollback(True)
          print("\nDONE (read-only, rolled back)")
          PY

      - name: Equipment weekly/monthly slot quota columns and who would be blocked (SELECT only, counts only)
        run: |
          set -euo pipefail
          cd /home/ubuntu/iic-booking-backend
          CID=$(docker compose -f docker-compose.production.yml ps --format '{{.Name}}' | grep django | head -n1)
          docker exec -i -w /app "$CID" python - <<'PY'
          import os
          from collections import Counter, defaultdict
          from datetime import timedelta

          import django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings.production")
          django.setup()

          from django.conf import settings
          from django.db import connection, transaction
          from django.utils import timezone

          from iic_booking.equipment.models import BookingStatus, DailySlot, Equipment, EquipmentStatus
          from iic_booking.users.models.user_type import UserType

          COLS = ("internal_weekly_quota", "internal_monthly_quota", "external_weekly_quota", "external_monthly_quota")
          GROUP_STATUSES = (BookingStatus.BOOKED, BookingStatus.COMPLETED)
          BROAD_STATUSES = GROUP_STATUSES + (
              BookingStatus.PROCESSING, BookingStatus.PENDING_PAYMENT, BookingStatus.PENDING,
              BookingStatus.HOLD, BookingStatus.DISRUPTION_PENDING,
          )

          def week_bounds(ref):
              start = (ref - timedelta(days=ref.weekday())).replace(hour=0, minute=0, second=0, microsecond=0)
              return start, start + timedelta(days=7)

          def month_bounds(ref):
              start = ref.replace(day=1, hour=0, minute=0, second=0, microsecond=0)
              nxt = start.replace(year=start.year + 1, month=1) if start.month == 12 else start.replace(month=start.month + 1)
              return start, nxt

          with transaction.atomic():
              if connection.vendor == "postgresql":
                  with connection.cursor() as cur:
                      cur.execute("SET TRANSACTION READ ONLY")

              print(f"TIME_ZONE={settings.TIME_ZONE} SKIP_BOOKING_QUOTA_CHECK={getattr(settings, 'SKIP_BOOKING_QUOTA_CHECK', None)}")
              print("column definitions:")
              for c in COLS:
                  f = Equipment._meta.get_field(c)
                  print(f"  {c}: {type(f).__name__} null={f.null} blank={f.blank} default={f.default!r}")

              active = list(Equipment.objects.filter(status=EquipmentStatus.ACTIVE).order_by("equipment_id"))
              all_eq = Equipment.objects.count()
              print(f"\nequipment: total={all_eq} active={len(active)} active_with_skip_quota_check={sum(1 for e in active if e.skip_quota_check)}")
              print(f"active with an equipment group: {sum(1 for e in active if e.equipment_group_id)}")
              for c in COLS:
                  vals = [getattr(e, c) for e in active]
                  print(f"  {c}: null={sum(v is None for v in vals)} zero={sum(v == 0 for v in vals)} "
                        f"positive={sum(1 for v in vals if v and v > 0)} distribution={dict(Counter(vals).most_common(12))}")
              all_vals = Counter(tuple(getattr(e, c) for c in COLS) for e in Equipment.objects.all())
              print(f"  all equipment (any status) 4-tuple distribution: {dict(all_vals.most_common(8))}")
              non_default = [e for e in active if any(getattr(e, c) != 10 for c in COLS)]
              print(f"active equipment with any value != 10: {len(non_default)}")
              for e in non_default[:40]:
                  print(f"  {e.equipment_id}:{(e.name or '')[:50]} {[getattr(e, c) for c in COLS]} slot={e.slot_duration_minutes}min x {e.slots_per_day}/day")
              print("slot shape of active equipment (slot_minutes, slots_per_day): "
                    f"{dict(Counter((e.slot_duration_minutes, e.slots_per_day) for e in active).most_common(10))}")
              print(f"active equipment whose slots_per_day*7 <= internal_weekly_quota (limit can never bind for one user): "
                    f"{sum(1 for e in active if e.internal_weekly_quota and e.slots_per_day * 7 <= e.internal_weekly_quota)}")

              eq_by_id = {e.equipment_id: e for e in active}
              now = timezone.localtime(timezone.now())

              def usage(start, end, statuses):
                  """{(equipment_id, user_id): [slots, is_external]} for slots starting in [start, end)."""
                  rows = (
                      DailySlot.objects.filter(
                          booking__isnull=False,
                          booking__status__in=statuses,
                          booking__source_booking__isnull=True,
                          booking__equipment_id__in=list(eq_by_id),
                          start_datetime__gte=start,
                          start_datetime__lt=end,
                      ).values_list("booking__equipment_id", "booking__user_id", "booking__user_type_snapshot")
                  )
                  out = defaultdict(lambda: [0, False])
                  for eq_id, uid, ut in rows:
                      cell = out[(eq_id, uid)]
                      cell[0] += 1
                      cell[1] = cell[1] or UserType.is_external_user(ut or "")
                  return out

              def report(label, start, end, kind):
                  for sname, statuses in (("BOOKED+COMPLETED (group-quota statuses)", GROUP_STATUSES), ("broad active statuses", BROAD_STATUSES)):
                      u = usage(start, end, statuses)
                      at_or_over = over = 0
                      eqs_hit = set()
                      dist = Counter()
                      for (eq_id, _uid), (slots, ext) in u.items():
                          eq = eq_by_id[eq_id]
                          limit = getattr(eq, f"{'external' if ext else 'internal'}_{kind}_quota")
                          dist[slots] += 1
                          if not limit or limit <= 0:
                              continue
                          if slots >= limit:
                              at_or_over += 1
                              eqs_hit.add(eq_id)
                          if slots > limit:
                              over += 1
                      print(f"  {label} [{start:%Y-%m-%d}..{end:%Y-%m-%d}) {sname}: user-equipment pairs={len(u)} "
                            f"at_or_over_limit={at_or_over} over_limit={over} equipment_affected={len(eqs_hit)} "
                            f"slots-per-user distribution(top)={dict(sorted(dist.items())[-8:])}")
                      if eqs_hit:
                          per_eq = Counter(eq_id for (eq_id, _), (s, x) in u.items()
                                           if s >= (getattr(eq_by_id[eq_id], f"{'external' if x else 'internal'}_{kind}_quota") or 10**9))
                          print("    affected equipment (id: users at/over): " + ", ".join(f"{k}: {v}" for k, v in per_eq.most_common(15)))

              print("\n== usage vs saved limits (slots whose start is in the period; repeat samples excluded; counts only) ==")
              ws, we = week_bounds(now)
              report("current week", ws, we, "weekly")
              report("next week", we, we + timedelta(days=7), "weekly")
              ms, me = month_bounds(now)
              report("current month", ms, me, "monthly")
              pms, pme = month_bounds(ms - timedelta(days=1))
              report("previous month", pms, pme, "monthly")

              print("\n== last 8 full weeks: user-weeks that would have been over the weekly limit (BOOKED+COMPLETED) ==")
              total_over = total_pairs = 0
              for i in range(1, 9):
                  s = ws - timedelta(days=7 * i)
                  u = usage(s, s + timedelta(days=7), GROUP_STATUSES)
                  n_over = sum(1 for (eq_id, _), (sl, x) in u.items()
                               if (lim := getattr(eq_by_id[eq_id], f"{'external' if x else 'internal'}_weekly_quota")) and lim > 0 and sl > lim)
                  total_over += n_over
                  total_pairs += len(u)
                  print(f"  week of {s:%Y-%m-%d}: pairs={len(u)} over_limit={n_over}")
              print(f"  total: pairs={total_pairs} over_limit={total_over}")

              transaction.set_rollback(True)
          print("\nDONE (read-only, rolled back)")
          PY
