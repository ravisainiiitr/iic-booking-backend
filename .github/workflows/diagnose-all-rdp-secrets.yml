name: Diagnose All Workstation RDP Secrets

# Safe inventory: never prints passwords or ciphertext.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: List all workstations + RDP secret presence
        run: |
          set -euo pipefail
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          docker exec -w /app "$CID" python manage.py shell -c "
          import json
          from django.utils import timezone
          from iic_booking.remote_analysis.models import AnalysisWorkstation
          from iic_booking.remote_analysis.session_models import WorkstationRdpSecret
          print('=== ALL_WORKSTATIONS ===')
          for ws in AnalysisWorkstation.objects.all().order_by('hostname'):
              secret = WorkstationRdpSecret.objects.filter(workstation=ws).first()
              age = int((timezone.now()-ws.last_heartbeat).total_seconds()) if ws.last_heartbeat else None
              print(json.dumps({
                'id': str(ws.id),
                'hostname': ws.hostname,
                'agent_id': ws.agent_id,
                'status': ws.status,
                'enabled': ws.enabled,
                'hb_age_s': age,
                'rdp_secret_present': secret is not None,
                'rdp_username_set': bool(secret and (secret.username or '').strip()),
                'rdp_password_set': bool(secret and (secret.password_encrypted or '').strip()),
                'rdp_username_len': len((secret.username or '').strip()) if secret else 0,
                'rdp_password_cipher_len': len((secret.password_encrypted or '').strip()) if secret else 0,
                'rdp_updated_at': str(getattr(secret, 'updated_at', None)) if secret else None,
              }, default=str))
          print('=== ORPHAN_OR_ALL_SECRETS ===')
          for secret in WorkstationRdpSecret.objects.select_related('workstation').all():
              print(json.dumps({
                'secret_id': secret.pk,
                'workstation_id': str(secret.workstation_id),
                'hostname': getattr(secret.workstation, 'hostname', None),
                'username_set': bool((secret.username or '').strip()),
                'password_set': bool((secret.password_encrypted or '').strip()),
                'updated_at': str(secret.updated_at),
              }, default=str))
          print('SECRET_COUNT', WorkstationRdpSecret.objects.count())
          "
