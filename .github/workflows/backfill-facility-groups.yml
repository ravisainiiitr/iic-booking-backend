name: Backfill Facility User Groups

# Builds the automatic User Groups (per equipment, equipment category, equipment group, lab / facility and
# "All booking users") from every booking so far. Group tables only: bookings and users are never changed.
# Needs the facility_groups migration (Migrate Production) first. Dry run unless confirm is BACKFILL GROUPS.
# Prints counts only.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Leave empty for a dry run; type BACKFILL GROUPS to write the changes"
        required: false
        default: ""

jobs:
  run:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Backfill
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          if [ -z "$CID" ]; then
            echo "Could not find a running Django container."
            exit 1
          fi
          if [ "${CONFIRM}" = "BACKFILL GROUPS" ]; then
            echo "Mode: APPLY"
            docker exec -i -w /app "$CID" python manage.py backfill_facility_groups --apply
          else
            echo "Mode: DRY RUN (type BACKFILL GROUPS to apply)"
            docker exec -i -w /app "$CID" python manage.py backfill_facility_groups
          fi
