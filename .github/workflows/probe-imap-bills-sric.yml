# Read-only: list INBOX mail FROM bills@sric.iitr.ac.in via production IMAP settings.
name: Probe IMAP bills@sric

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, Linux]
    steps:
      - name: IMAP list FROM bills@sric.iitr.ac.in
        run: |
          set -euo pipefail
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1 || true)"
          echo "django_container=$CID"
          test -n "$CID"
          echo '' | base64 -d > /tmp/probe_imap_bills.py
          docker cp /tmp/probe_imap_bills.py "$CID":/tmp/probe_imap_bills.py
          docker exec -w /app "$CID" python -u /tmp/probe_imap_bills.py