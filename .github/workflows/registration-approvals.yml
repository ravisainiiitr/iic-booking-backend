# Registration approvals on production. report / status / dry-run are read-only and print counts only
# (no names or email addresses). enable / disable switch the daily programme expiry automation
# (expiry warnings, then Force Inactive at expiry); it ships disabled.
name: Registration Approvals

on:
  workflow_dispatch:
    inputs:
      action:
        description: "report | status | dry-run | enable | disable"
        required: true
        default: "report"
        type: choice
        options: [report, status, dry-run, enable, disable]
      confirm:
        description: "Type CHANGE to run enable / disable"
        required: false
        default: ""

jobs:
  run:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Run
        env:
          RA_ACTION: ${{ github.event.inputs.action }}
          RA_CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          case "$RA_ACTION" in
            report|status|dry-run) ;;
            enable|disable)
              if [[ "$RA_CONFIRM" != "CHANGE" ]]; then echo "confirm=CHANGE is required for $RA_ACTION"; exit 1; fi ;;
            *) echo "unknown action"; exit 1 ;;
          esac
          for d in \
            /home/ubuntu/iic-booking-backend \
            /home/ubuntu/iic_booking_backend \
            /home/ubuntu/iic-booking-backend-rt-port
          do
            if [[ -f "$d/docker-compose.production.yml" ]]; then
              cd "$d"
              echo "DESCRIBE=$(git describe --tags --always 2>/dev/null || true)"
              CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1 || true)"
              test -n "$CID"
              docker exec -w /app "$CID" python manage.py registration_approvals "$RA_ACTION" 2>&1 \
                | sed -E 's/([A-Za-z0-9])[A-Za-z0-9._%+-]*@([A-Za-z0-9.-]+)/\1***@\2/g'
              exit 0
            fi
          done
          echo "No production compose path found"
          exit 1
