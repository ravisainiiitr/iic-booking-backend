name: Ops Catalog Sync From Inventory

on:
  workflow_dispatch:
    inputs:
      refresh_agents:
        description: "Enqueue REFRESH_SOFTWARE to enabled agents"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  sync:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Backfill catalog + optional agent refresh
        env:
          REFRESH: ${{ github.event.inputs.refresh_agents }}
        run: |
          set -euo pipefail
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          test -n "$CID"
          echo "BEFORE"
          docker exec -w /app "$CID" python manage.py shell -c "
          from iic_booking.remote_analysis.catalog_models import AnalysisSoftwareCatalog
          from iic_booking.remote_analysis.models import InstalledSoftware
          from iic_booking.remote_analysis.services.catalog_sync import inventory_discovery_summary
          print('catalog_total', AnalysisSoftwareCatalog.objects.count())
          print('catalog_active', AnalysisSoftwareCatalog.objects.filter(is_active=True, is_archived=False).count())
          print('installed_present', InstalledSoftware.objects.filter(is_present=True).count())
          print('summary', inventory_discovery_summary())
          print('names', list(InstalledSoftware.objects.filter(is_present=True).values_list('software_name', flat=True).distinct()[:40]))
          "
          docker exec -w /app -e REFRESH="$REFRESH" "$CID" python manage.py shell -c "
          import os
          from django.contrib.auth import get_user_model
          from rest_framework.test import APIRequestFactory, force_authenticate
          from iic_booking.remote_analysis import catalog_admin_views as v
          User = get_user_model()
          admin = User.objects.filter(user_type='admin', is_active=True).order_by('id').first()
          rf = APIRequestFactory()
          body = {'refresh_agents': os.environ.get('REFRESH','true').lower() in {'1','true','yes'}}
          req = rf.post('/api/v1/analysis/catalog/software/sync-from-inventory/', body, format='json')
          force_authenticate(req, user=admin)
          resp = v.catalog_sync_from_inventory(req)
          print('status', resp.status_code)
          print('data', getattr(resp, 'data', None))
          "
          echo "AFTER"
          docker exec -w /app "$CID" python manage.py shell -c "
          from iic_booking.remote_analysis.catalog_models import AnalysisSoftwareCatalog
          from iic_booking.remote_analysis.models import InstalledSoftware
          from iic_booking.remote_analysis.services.catalog_sync import inventory_discovery_summary
          print('catalog_total', AnalysisSoftwareCatalog.objects.count())
          print('catalog_active', AnalysisSoftwareCatalog.objects.filter(is_active=True, is_archived=False).count())
          print('installed_present', InstalledSoftware.objects.filter(is_present=True).count())
          print('summary', inventory_discovery_summary())
          print('names', list(InstalledSoftware.objects.filter(is_present=True).values_list('software_name', flat=True).distinct()[:40]))
          "
