name: Probe Booking 312 Prepare Sync

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: self-hosted
    steps:
      - name: Probe prepare/sync/session for booking 312
        run: |
          set -euo pipefail
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          docker exec -i -w /app "$CID" python manage.py shell <<'PY'
          from django.utils import timezone
          from iic_booking.equipment.models import Booking
          from iic_booking.equipment.remote_analysis_integration.experience import AnalysisExperienceBuilder
          from iic_booking.equipment.remote_analysis_integration.service import BookingRemoteAnalysisService
          from iic_booking.remote_analysis.session_models import RemoteDesktopSession
          from iic_booking.remote_analysis.models import AnalysisWorkstation, RemoteCommand
          from iic_booking.remote_analysis.workspace_models import WorkspaceFile
          from iic_booking.remote_analysis.constants import CommandStatus

          b = Booking.objects.select_related("equipment", "user", "analysis_reservation", "analysis_workspace").get(pk=312)
          r = b.analysis_reservation
          w = b.analysis_workspace
          print("BOOKING", b.pk, b.virtual_booking_id)
          print("RES", getattr(r, "id", None), getattr(r, "status", None), "ws", getattr(r, "workstation_id", None))
          print("WORKSPACE", getattr(w, "id", None), getattr(w, "status", None), "sync_phase", getattr(w, "sync_phase", None), "sync_status", getattr(w, "sync_status", None), "msg", getattr(w, "sync_message", None))
          if w:
              for f in WorkspaceFile.objects.filter(workspace=w).order_by("-id")[:20]:
                  print("FILE", getattr(f, "relative_path", None), getattr(f, "size_bytes", None), getattr(f, "sync_state", None), getattr(f, "direction", None))

          for s in RemoteDesktopSession.objects.filter(booking=b).order_by("-created_at")[:5]:
              print("SESSION", s.id, s.status, "prep_cmd", s.prepare_command_id, "term", s.termination_reason, "created", s.created_at)
              if s.prepare_command_id:
                  c = s.prepare_command
                  age = int((timezone.now() - c.created_at).total_seconds()) if c.created_at else None
                  print("  PREP", c.id, "status", c.status, "type", c.command_type, "age_s", age, "err", c.error_message, "result", getattr(c, "result_message", None))

          pending = RemoteCommand.objects.filter(status__in=[CommandStatus.PENDING, CommandStatus.DELIVERED]).order_by("-created_at")[:10]
          for c in pending:
              print("PENDING_CMD", c.id, c.command_type, c.status, "ws", c.workstation_id, "created", c.created_at)

          try:
              summary = BookingRemoteAnalysisService().get_summary(b, user=b.user)
              exp = (summary or {}).get("experience") if isinstance(summary, dict) else None
              if not exp:
                  exp = AnalysisExperienceBuilder().build(b, user=b.user, summary=summary if isinstance(summary, dict) else {})
              print("EXP desktop_prepare", exp.get("desktop_prepare"))
              print("EXP sync", {k: exp.get(k) for k in ("sync_phase", "sync_progress", "sync_message") if k in exp or True})
          except Exception as e:
              print("EXP_ERR", type(e).__name__, e)

          now = timezone.now()
          for ws in AnalysisWorkstation.objects.filter(enabled=True).order_by("-last_heartbeat"):
              age = int((now - ws.last_heartbeat).total_seconds()) if ws.last_heartbeat else None
              print("WS", ws.id, ws.hostname, ws.status, "hb_age_s", age, "cmd", ws.current_command)
          PY
