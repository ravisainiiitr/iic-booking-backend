# Booking Event History: missing "entered disruption" entries and reasons on the user's refund / reschedule.
# Script: scripts/ops/backfill_disruption_history.py
name: Backfill Disruption History

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Write the history entries (otherwise dry run)
        required: false
        type: boolean
        default: false

jobs:
  run:
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v5
      - name: Run
        env:
          APPLY: ${{ inputs.apply && '1' || '0' }}
        run: |
          set -euo pipefail
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1 || true)"
          test -n "$CID"
          # The runner workspace is a sparse checkout, so the script is read from git rather than the disk.
          git -C "$GITHUB_WORKSPACE" show HEAD:scripts/ops/backfill_disruption_history.py \
            | docker exec -i -e APPLY="$APPLY" -e DJANGO_SETTINGS_MODULE=config.settings.production -w /app "$CID" \
              python manage.py shell
