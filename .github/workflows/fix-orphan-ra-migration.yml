name: Fix Orphan RA Migration 0016

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: self-hosted
    steps:
      - name: Remove orphan 0016 and force-rebuild Django
        run: |
          set -euo pipefail
          echo "=== Before: django containers ==="
          docker ps -a --format 'table {{.Names}}\t{{.Status}}' | grep -iE 'django|NAMES' || true

          BACKEND_DIR=""
          for d in /home/ubuntu/iic-booking-backend /home/ubuntu/iic_booking_backend; do
            if [ -d "$d/.git" ]; then
              BACKEND_DIR="$d"
              break
            fi
          done
          if [ -z "$BACKEND_DIR" ]; then
            echo "Backend checkout not found"
            exit 1
          fi

          echo "=== Reset checkout to origin/master in $BACKEND_DIR ==="
          cd "$BACKEND_DIR"
          git fetch origin master
          git checkout -f master
          git reset --hard origin/master
          git clean -fdx -- iic_booking/remote_analysis/migrations

          echo "=== Explicitly delete leftover broken installer migrations only ==="
          # Do not delete official 0015 stub or 0016_agent_installer_release once shipped.
          rm -fv iic_booking/remote_analysis/migrations/0016_broken_*.py || true

          echo "migrations now:"
          ls -1 iic_booking/remote_analysis/migrations

          if ls iic_booking/remote_analysis/migrations/0016_agent_installer_release.py >/dev/null 2>&1; then
            echo "0016 installer migration present (expected)"
          fi

          COMPOSE_FILE=""
          for f in docker-compose.production.yml production.yml compose.production.yml; do
            if [ -f "$BACKEND_DIR/$f" ]; then
              COMPOSE_FILE="$f"
              break
            fi
          done
          if [ -z "$COMPOSE_FILE" ]; then
            # fall back to deploy.sh but still force image rebuild afterward
            echo "No compose file found; will use deploy.sh then force recreate"
          fi

          echo "=== Force rebuild django image without cache ==="
          cd "$BACKEND_DIR"
          if [ -n "$COMPOSE_FILE" ]; then
            docker compose -f "$COMPOSE_FILE" build --no-cache --pull django
            docker compose -f "$COMPOSE_FILE" up -d --force-recreate --no-deps django celeryworker celerybeat || \
              docker compose -f "$COMPOSE_FILE" up -d --force-recreate django
          else
            /home/ubuntu/deploy.sh
            # Bust any remaining stale image by rebuilding from compose discovery
            docker compose build --no-cache django || true
            docker compose up -d --force-recreate django || true
          fi

          # Also remove accidental broken leftovers from bind-mounts (keep official 0015/0016).
          CID="$(docker ps -a --format '{{.Names}}' | grep -E 'django' | head -n 1 || true)"
          if [ -n "$CID" ]; then
            docker restart "$CID" || true
          fi

          sleep 12
          echo "=== After: django containers ==="
          docker ps -a --format 'table {{.Names}}\t{{.Status}}' | grep -iE 'django|NAMES' || true

          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1 || true)"
          if [ -z "$CID" ]; then
            echo "Django not running"
            docker ps -a --format '{{.Names}}' | grep -E 'django' | head -n 1 | xargs -r -I{} docker logs --tail 120 {}
            exit 1
          fi

          echo "=== migrations inside container ==="
          docker exec "$CID" ls -1 /app/iic_booking/remote_analysis/migrations || true

          echo "=== Recent django logs ==="
          docker logs --tail 60 "$CID" 2>&1 || true

          echo "=== django check ==="
          docker exec "$CID" python manage.py check 2>&1 | tail -n 40

          echo "=== API probe via container network ==="
          # Prefer probing through the reverse proxy path if available
          code="$(curl -sS -o /tmp/api_out.txt -w '%{http_code}' https://equip.iitr.ac.in/api/v1/site-stats/ || true)"
          echo "public_http_code=$code"
          head -c 200 /tmp/api_out.txt || true
          echo
          if [ "$code" != "200" ]; then
            echo "Public API still unhealthy"
            exit 1
          fi
