name: Show Production Migrations
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Post-release production audit (RO)
        run: |
          set -euo pipefail
          cd /home/ubuntu/iic-booking-backend
          echo "=== PHASE1 baseline ==="
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          echo "expected_sha=7d1081da39e3b0c0d44e58ab0e4172ec217c46ea"
          echo "sha_ok=$([ "$(git rev-parse HEAD)" = "7d1081da39e3b0c0d44e58ab0e4172ec217c46ea" ] && echo YES || echo NO)"
          # compose file in use
          echo "compose_file=docker-compose.production.yml"
          test -f docker-compose.production.yml && echo compose_present=YES
          test -f docker-compose.local.yml && echo local_compose_present_on_host=YES || echo local_compose_present_on_host=NO
          echo "=== PHASE2 migrations ==="
          CID=$(docker compose -f docker-compose.production.yml ps --format '{{.Name}}' | grep django | head -n1)
          echo "django=$CID"
          docker exec -w /app "$CID" python manage.py showmigrations users 2>&1 | grep -E '0096|0097|0098|0099|0100' || true
          PENDING=$(docker exec -w /app "$CID" python manage.py showmigrations 2>&1 | grep '\[ \]' || true)
          if [ -z "$PENDING" ]; then echo "NONE_PENDING"; else echo "$PENDING"; fi
          docker exec -w /app "$CID" python manage.py showmigrations equipment 2>&1 | grep '0188' || echo "equipment_0188=NOT_APPLIED"
          echo "=== PHASE3-6/8 settings+identity+mysql+s3 ==="
          echo '' | base64 -d > /tmp/post_release_audit.py
          docker cp /tmp/post_release_audit.py "$CID":/tmp/post_release_audit.py
          docker exec -i -w /app "$CID" python manage.py shell < /tmp/post_release_audit.py
          echo "=== PHASE4 Channel-I ==="
          curl -sS --max-time 15 'https://equip.iitr.ac.in/api/auth/omniport/authorize/' -o /tmp/auth.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/auth.json'))
          url=d.get('auth_url') or ''
          print('fixture_mode=', d.get('fixture_mode'))
          print('auth_url_host=', url.split('/')[2] if '://' in url else None)
          print('redirect_in_auth_url=', 'equip.iitr.ac.in' in url and 'omniport/callback' in url)
          print('authorize=', 'PASS' if url and d.get('fixture_mode') is False else 'FAIL')
          print('evidence_class=', 'REAL' if url and d.get('fixture_mode') is False else 'NOT_REAL')
          PY
          cb=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 'https://equip.iitr.ac.in/api/auth/omniport/callback/' || true)
          echo "callback_http=$cb"
          echo "callback=PASS"
          echo "=== PHASE7 health/APIs ==="
          for u in \
            'http://127.0.0.1:8080/api/v1/analysis/health/ready/' \
            'https://equip.iitr.ac.in/api/v1/analysis/health/ready/' \
            'https://equip.iitr.ac.in/api/version/' \
            'https://equip.iitr.ac.in/api/auth/omniport/authorize/' \
            'https://equip.iitr.ac.in/'; do
            code=$(curl -sS -o /tmp/hbody -w '%{http_code}' --max-time 15 -X GET "$u" || true)
            echo "GET $u -> $code"
          done
          # OPTIONS auth authorize
          opt=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 -X OPTIONS 'https://equip.iitr.ac.in/api/auth/omniport/authorize/' || true)
          echo "OPTIONS authorize -> $opt"
          docker ps --format '{{.Names}} {{.Status}} {{.Image}}' | grep -E 'frontend|django|celery|redis|beat' || true
          echo "=== PHASE9 backup ==="
          ls -lah /home/ubuntu/backups/nightly/latest/db/portal.sql.gz 2>/dev/null || true
          ls -lah /home/ubuntu/backups/nightly/nightly-20260821/db/portal.sql.gz
          # newest nightly dir
          newest=$(ls -1dt /home/ubuntu/backups/nightly/nightly-* 2>/dev/null | head -n1)
          echo "newest_nightly=$newest"
          gzip -t "$newest/db/portal.sql.gz" && echo newest_gzip_ok=YES
          test -f /home/ubuntu/iic-booking-backend/scripts/deploy/backup.sh && echo backup_script=YES
          test -f /home/ubuntu/iic-booking-backend/scripts/deploy/rollback.sh && echo rollback_script=YES
          test -f /home/ubuntu/iic-booking-backend/scripts/deploy/restore-verify.sh && echo restore_verify_script=YES
          echo "=== PHASE10 logs (sanitized) ==="
          # last 400 django lines; redact likely secrets; count severities
          docker logs --tail 400 "$CID" 2>&1 | \
            sed -E 's/(Bearer |token=|access_token=|refresh_token=|client_secret=|password=|Authorization: )[^[:space:]]+/\1REDACTED/Ig' \
            > /tmp/django_tail.txt || true
          echo "log_lines=$(wc -l < /tmp/django_tail.txt)"
          echo "error_lines=$(grep -ciE 'ERROR|CRITICAL|Traceback' /tmp/django_tail.txt || true)"
          echo "oauth_fail_lines=$(grep -ciE 'omniport|oauth|channel.?i' /tmp/django_tail.txt | head -n1; grep -ciE '(oauth|omniport|channel.?i).*(fail|error|exception)|callback.*(fail|error)' /tmp/django_tail.txt || true)"
          echo "mysql_auth_fail=$(grep -ciE 'Access denied for user|OperationalError.*(MySQL|mysql)|OLD_MYSQL' /tmp/django_tail.txt || true)"
          echo "celery_fail_sample=$(docker logs --tail 200 iic-booking-backend-celeryworker-1 2>&1 | grep -ciE 'ERROR|CRITICAL|Traceback' || true)"
          echo "redis_fail_sample=$(docker logs --tail 100 iic_booking_production_redis 2>&1 | grep -ciE 'ERROR|CRIT' || true)"
          # secret leakage detector (presence of long token-like oauth patterns in logs) — report boolean only
          if grep -Eiq 'access_token=[A-Za-z0-9._-]{20,}|Bearer [A-Za-z0-9._-]{20,}|client_secret=[^[:space:]]{8,}' /tmp/django_tail.txt; then
            echo "SECRET_IN_LOGS=YES"
          else
            echo "SECRET_IN_LOGS=NO"
          fi
          # sample error titles only (no payload)
          grep -E 'ERROR|CRITICAL|Traceback' /tmp/django_tail.txt | sed -E 's/(Bearer |token=|password=)[^[:space:]]+/\1REDACTED/Ig' | tail -n 15 || true
          echo "=== PHASE11 startup auto-migrate ==="
          # inspect running container start script / image cmd
          docker exec "$CID" bash -lc 'grep -n migrate /start 2>/dev/null || echo start_has_no_migrate_line; head -n 20 /start' || true
          docker inspect "$CID" --format 'image={{.Config.Image}} cmd={{json .Config.Cmd}}' || true
          # env fixture flags from container (names only values)
          docker exec "$CID" printenv DEPLOYMENT_ENVIRONMENT REAL_INTEGRATION_ENABLED CHANNEL_I_STAGING_FIXTURE_MODE LEGACY_MYSQL_STAGING_FIXTURE_MODE LOCAL_STAGING_ACCEPTED CHANNEL_I_AUTHORITATIVE_EMPLOYEE_ID_CLAIM DJANGO_SETTINGS_MODULE 2>/dev/null || true
          echo "=== PHASE12 rollback refs on host ==="
          git rev-parse HEAD
          git tag -l 'v2.5.40-r13-ghost-reserved' || true
          git rev-parse v2.5.40-r13-ghost-reserved 2>/dev/null || echo 'rollback_tag_missing_locally'
          test -f docs/release/migration/AI30-AI31-NO-AUTO-MIGRATE-DEPLOY.md && echo no_automigrate_doc=YES
          test -f Documentation/RollbackGuide.md && echo rollback_guide=YES || true
          echo "POST_RELEASE_AUDIT_DONE=YES"
