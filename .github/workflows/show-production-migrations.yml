name: Show Production Migrations
on:
  workflow_dispatch:
jobs:
  unblock_deploy:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Clear dirty compose so Deploy can checkout hotfix tag
        run: |
          set -euo pipefail
          cd /home/ubuntu/iic-booking-backend
          echo "BEFORE=$(git status -sb | head -n 5)"
          git checkout -- docker-compose.production.yml || true
          git status -sb | head -n 5
          echo "HEAD_NOW=$(git rev-parse HEAD)"
