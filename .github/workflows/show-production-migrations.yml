name: Show Production Migrations
on:
  workflow_dispatch:
jobs:
  show:
    runs-on: [self-hosted, Linux]
    steps:
      - name: RO connect iic_booking_ro to 127.0.0.1:3306
        env:
          MYSQL_PWD: ${{ secrets.TEMP_EC2_MYSQL_RO_PASSWORD }}
        run: |
          set -euo pipefail
          unset HISTFILE || true
          echo "=== tools ==="
          command -v mysql || sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client >/dev/null
          command -v mysql
          echo "=== attempt iic_booking_ro@127.0.0.1:3306 db=admin ==="
          if mysql -h127.0.0.1 -P3306 -uiic_booking_ro --protocol=TCP -N -e "SELECT 'CONNECT_OK'; SELECT VERSION(); SELECT @@hostname; SELECT @@port; SELECT @@server_uuid;" 2>/tmp/ro_err.txt; then
            echo "AUTH=iic_booking_ro_ok"
          else
            echo "AUTH=iic_booking_ro_fail"
            # redact any accidental password leakage
            sed -E 's/Password[^[:space:]]*/Password***/Ig; s/'$'\x27''[^'$'\x27'']+'$'\x27''/*** /g' /tmp/ro_err.txt | head -n 30 || true
            exit 0
          fi

          echo "=== databases ==="
          mysql -h127.0.0.1 -P3306 -uiic_booking_ro --protocol=TCP -N -e "SHOW DATABASES;" | awk '{print "db="$1}'
          echo "=== admin? ==="
          if mysql -h127.0.0.1 -P3306 -uiic_booking_ro --protocol=TCP -N -e "SHOW DATABASES LIKE 'admin';" | grep -qx admin; then
            echo "ADMIN_EXISTS=YES"
          else
            echo "ADMIN_EXISTS=NO"
            exit 0
          fi

          echo "=== tables sample ==="
          mysql -h127.0.0.1 -P3306 -uiic_booking_ro --protocol=TCP -N -e "SHOW TABLES FROM admin;" | head -n 40 | awk '{print "table="$1}'

          echo "=== counts ==="
          mysql -h127.0.0.1 -P3306 -uiic_booking_ro --protocol=TCP -N -e "SELECT COUNT(*) FROM admin.users;" | awk '{print "users_count="$1}'
          mysql -h127.0.0.1 -P3306 -uiic_booking_ro --protocol=TCP -N -e "SELECT COUNT(*) FROM admin.user_wallet;" | awk '{print "user_wallet_count="$1}'
          mysql -h127.0.0.1 -P3306 -uiic_booking_ro --protocol=TCP -N -e "SELECT COUNT(*) FROM admin.wallet_transactions;" | awk '{print "wallet_transactions_count="$1}'
          for t in bookings booking user_bookings; do
            if mysql -h127.0.0.1 -P3306 -uiic_booking_ro --protocol=TCP -N -e "SHOW TABLES FROM admin LIKE '$t';" | grep -qx "$t"; then
              echo "bookings_table=$t"
              mysql -h127.0.0.1 -P3306 -uiic_booking_ro --protocol=TCP -N -e "SELECT COUNT(*) FROM admin.$t;" | awk '{print "bookings_count="$1}'
              break
            fi
          done
          echo "=== emp_id column ==="
          mysql -h127.0.0.1 -P3306 -uiic_booking_ro --protocol=TCP -N -e "SHOW COLUMNS FROM admin.users LIKE 'emp_id';" | head -n 3 | awk '{print "emp_id_col="$0}' || echo "emp_id_col=ABSENT"

          echo "=== CURRENT_USER / grants visible to RO ==="
          mysql -h127.0.0.1 -P3306 -uiic_booking_ro --protocol=TCP -e "SELECT CURRENT_USER(); SHOW GRANTS;" | sed 's/^/GRANT_OR_USER /'

          echo "=== write attempt should fail (expected) ==="
          set +e
          mysql -h127.0.0.1 -P3306 -uiic_booking_ro --protocol=TCP -e "UPDATE admin.users SET emp_id=emp_id WHERE 1=0;" 2>/tmp/write_err.txt
          wr=$?
          set -e
          echo "write_exit=$wr"
          if [ "$wr" -ne 0 ]; then echo "account_appears_writable=FALSE"; else echo "account_appears_writable=TRUE_UNEXPECTED"; fi
          head -n 5 /tmp/write_err.txt | sed -E 's/Password[^[:space:]]*/***/Ig' || true

          echo "=== prior snapshot comparison markers ==="
          echo "prior_users=4333 prior_wallets=1747 prior_txns=64244 prior_bookings=57991"
          echo "DONE"
