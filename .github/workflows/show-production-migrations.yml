# PROBE BRANCH ONLY (probe/egs-preflight-ro) — refresh the text of the live EPR Under Maintenance notice.
# Approved one-off data edit: updates title + description of exactly ONE notice
# (source=EQUIPMENT_UNAVAILABLE, equipment code EPR, APPROVED, active, not expired).
# No migrations, no restarts. Rolls back unless exactly one row matches and every other notice is unchanged.
name: Show Production Migrations

on:
  workflow_dispatch:

env:
  RELEASE_TAG: v2.5.46.50-notice-board-maintenance-copy
  RELEASE_SHORT: "59bc9f9"
  DEPLOY_DIR: /home/ubuntu/iic-booking-backend
  EQUIPMENT_CODE: EPR

jobs:
  show:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Deployed release state
        id: st
        run: |
          set -euo pipefail
          CUR_TAG="$(cat "$DEPLOY_DIR/.deploy-state/current_release_tag")"
          HEAD="$(git -C "$DEPLOY_DIR" rev-parse --short HEAD)"
          echo "current_release_tag=$CUR_TAG deploy_head=$HEAD"
          [ "$CUR_TAG" = "$RELEASE_TAG" ] && [ "$HEAD" = "$RELEASE_SHORT" ] || { echo "STATE FAIL"; exit 1; }
          CID="$(docker ps --format '{{.Names}}' | grep -E 'backend-django-' | head -n 1)"
          docker inspect -f 'django health={{.State.Health.Status}} restarts={{.RestartCount}}' "$CID"
          echo "container=$CID" >> "$GITHUB_OUTPUT"
          echo "STATE PASS"

      - name: Refresh EPR notice text (single row, guarded)
        run: |
          set -euo pipefail
          CID="${{ steps.st.outputs.container }}"
          docker exec -w /app -e EQUIPMENT_CODE="$EQUIPMENT_CODE" "$CID" python manage.py shell -c "
          import hashlib, os
          from django.db import transaction
          from django.db.models import Q
          from django.utils import timezone
          from iic_booking.communication.models import Notice
          from iic_booking.communication.notice_board_service import build_equipment_unavailable_copy

          def fp(qs):
              rows = qs.order_by('notice_id').values_list('notice_id', 'title', 'description', 'content', 'notice_type', 'is_active', 'approval_status', 'expiry_date', 'expiry_unlimited', 'equipment_id')
              return qs.count(), hashlib.md5(repr(list(rows)).encode()).hexdigest()

          code = os.environ['EQUIPMENT_CODE']
          now = timezone.now()
          with transaction.atomic():
              target_qs = Notice.objects.select_for_update().filter(
                  source=Notice.Source.EQUIPMENT_UNAVAILABLE,
                  equipment__code=code,
                  approval_status=Notice.ApprovalStatus.APPROVED,
                  is_active=True,
              ).filter(Q(expiry_date__isnull=True) | Q(expiry_date__gt=now))
              ids = list(target_qs.values_list('notice_id', flat=True))
              print('MATCHING_IDS', ids)
              if len(ids) != 1:
                  raise SystemExit('ABORT: expected exactly one matching notice')
              notice = Notice.objects.select_related('equipment', 'equipment__internal_department').get(notice_id=ids[0])
              print('EQUIPMENT_STATUS', notice.equipment.status)
              if notice.equipment.status == 'ACTIVE':
                  raise SystemExit('ABORT: equipment is Operational; notice should not be live')
              others_before = fp(Notice.objects.exclude(notice_id=notice.notice_id))
              print('OLD_TITLE', repr(notice.title))
              print('OLD_DESCRIPTION', repr(notice.description))
              title, description = build_equipment_unavailable_copy(
                  notice.equipment, since=timezone.localdate(notice.created_at)
              )
              notice.title = title
              notice.description = description
              notice.save(update_fields=['title', 'description', 'updated_at'])
              others_after = fp(Notice.objects.exclude(notice_id=notice.notice_id))
              print('OTHERS_BEFORE', others_before, 'OTHERS_AFTER', others_after)
              if others_before != others_after:
                  raise SystemExit('ABORT: other notices changed; rolled back')
              fresh = Notice.objects.get(notice_id=notice.notice_id)
              if (fresh.title, fresh.description) != (title, description):
                  raise SystemExit('ABORT: write did not persist as expected; rolled back')
              if not (fresh.is_active and fresh.approval_status == Notice.ApprovalStatus.APPROVED):
                  raise SystemExit('ABORT: visibility changed; rolled back')
              print('NEW_TITLE', repr(fresh.title))
              print('NEW_DESCRIPTION', repr(fresh.description))
          print('UPDATE_COMMITTED')
          " 2>&1 | grep -vE 'RequestsDependencyWarning|warnings.warn' | tee "$RUNNER_TEMP/out.txt"
          grep -qx 'UPDATE_COMMITTED' "$RUNNER_TEMP/out.txt" || { echo "UPDATE NOT COMMITTED"; exit 1; }

      - name: Public board shows the new text
        run: |
          set -euo pipefail
          code="$(curl -sS -o "$RUNNER_TEMP/notices.json" -w '%{http_code}' --max-time 30 'http://127.0.0.1:8080/api/notices/?is_active=true')"
          echo "GET /api/notices/ -> $code"
          [ "$code" = "200" ] || exit 1
          python3 - "$RUNNER_TEMP/notices.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          rows = [n for n in d["notices"] if n.get("source") == "EQUIPMENT_UNAVAILABLE"]
          for n in rows:
              print("public", n["notice_id"], n.get("equipment_code"), repr(n["title"]))
          assert any(n.get("equipment_code") == "EPR" and n["title"].endswith("— Under Maintenance") for n in rows)
          print("public_notice_count", d["count"])
          PY
          echo "VERIFY_DONE=YES"
