name: Show Production Migrations
on:
  workflow_dispatch:
jobs:
  backups:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Backup RO detail (no migrate)
        run: |
          set -euo pipefail
          echo "=== /home/ubuntu/backups ==="
          ls -lah /home/ubuntu/backups 2>/dev/null | head -n 40 || true
          latest=$(ls -1dt /home/ubuntu/backups/* 2>/dev/null | head -n 1 || true)
          echo "latest_entry=$latest"
          if [ -n "$latest" ]; then
            ls -lah "$latest" | head -n 40
            # gzip test newest .gz
            gz=$(find "$latest" -type f -name '*.gz' 2>/dev/null | head -n 3 || true)
            for f in $gz; do
              echo "gzip_test=$f"
              gzip -t "$f" && echo "gzip_ok=YES" || echo "gzip_ok=NO"
              ls -lah "$f"
            done
          fi
          # cron / restore docs
          ls -lah /home/ubuntu/iic-booking-backend/scripts/deploy/ | head -n 30
          test -f /home/ubuntu/iic-booking-backend/scripts/deploy/backup.sh && echo backup_sh=YES
          test -f /home/ubuntu/iic-booking-backend/scripts/deploy/restore.sh && echo restore_sh=YES || echo restore_sh=NO
          ls /home/ubuntu/iic-booking-backend/docs/release/migration/ 2>/dev/null | head -n 40 || true
          crontab -l 2>/dev/null | grep -iE 'backup|migrate' || echo 'crontab_backup_lines=none_or_no_access'
