name: Show Production Migrations
on:
  workflow_dispatch:
jobs:
  prep:
    runs-on: [self-hosted, Linux]
    steps:
      - run: |
          set -euo pipefail
          cd /home/ubuntu/iic-booking-backend
          git checkout -- docker-compose.production.yml 2>/dev/null || true
          git status -sb | head -n 5
