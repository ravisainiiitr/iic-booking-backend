# PROBE BRANCH ONLY (probe/egs-preflight-ro) — DRY RUN for removing test group 30 "N1 Quota Group"
# and its test equipment 99 "N1-QUOTA". Strictly read-only: uses Django's deletion Collector inside a
# READ ONLY transaction to list what a delete WOULD remove. Deletes nothing.
name: Show Production Migrations

on:
  workflow_dispatch:

jobs:
  show:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Dry run — N1 Quota Group removal impact (read-only)
        run: |
          set -euo pipefail
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          echo "container=$CID host_deploy_head=$(git -C /home/ubuntu/iic-booking-backend rev-parse HEAD 2>/dev/null || echo unknown)"
          SCRIPT="$(cat <<'PY'
          from collections import Counter
          from django.db import connection, transaction
          from django.db.models.deletion import Collector, ProtectedError, RestrictedError
          from iic_booking.equipment.models import Equipment, EquipmentGroup

          GROUP_ID, GROUP_NAME = 30, "N1 Quota Group"
          EQUIP_ID, EQUIP_CODE = 99, "N1-QUOTA"

          with transaction.atomic():
              with connection.cursor() as c:
                  c.execute("SET TRANSACTION READ ONLY")
                  c.execute("SHOW transaction_read_only")
                  ro = c.fetchone()[0]
              print("transaction_read_only=", ro)
              if ro != "on":
                  raise SystemExit("STOP: transaction is not read-only")

              g = EquipmentGroup.objects.get(pk=GROUP_ID)
              print("group:", g.pk, repr(g.name), "code=", repr(getattr(g, "code", None)))
              if g.name != GROUP_NAME:
                  raise SystemExit("STOP: group name mismatch")
              members = list(Equipment.objects.filter(equipment_group_id=GROUP_ID)
                             .values_list("pk", "code", "name", "internal_department_id", "status"))
              print("group members:", members)
              eq = Equipment.objects.get(pk=EQUIP_ID)
              print("equipment:", eq.pk, repr(eq.code), repr(eq.name), "dept=", eq.internal_department_id,
                    "status=", getattr(eq, "status", None), "group=", eq.equipment_group_id)
              if eq.code != EQUIP_CODE or eq.equipment_group_id != GROUP_ID:
                  raise SystemExit("STOP: equipment identity mismatch")
              if [m[0] for m in members] != [EQUIP_ID]:
                  raise SystemExit("STOP: group has members other than equipment 99")

              collector = Collector(using="default")
              try:
                  collector.collect([eq, g])
              except (ProtectedError, RestrictedError) as exc:
                  print("DELETE WOULD BE BLOCKED:", type(exc).__name__)
                  for o in list(getattr(exc, "protected_objects", None) or getattr(exc, "restricted_objects", None) or [])[:50]:
                      print("  blocker:", o._meta.label, o.pk, str(o)[:120])
                  raise SystemExit(1)

              print("== rows that would be DELETED (cascade) ==")
              for model, objs in sorted(collector.data.items(), key=lambda kv: kv[0]._meta.label):
                  pks = sorted(o.pk for o in objs)
                  print(f"  {model._meta.label}: {len(pks)} pks={pks[:40]}{' ...' if len(pks) > 40 else ''}")
              print("== fast deletes (bulk, cascade) ==")
              for qs in collector.fast_deletes:
                  n = qs.count()
                  if n:
                      print(f"  {qs.model._meta.label}: {n} pks={list(qs.values_list('pk', flat=True)[:40])}")
              print("== rows that would be UPDATED (SET_NULL / SET_DEFAULT) ==")
              for (field, value), items in collector.field_updates.items():
                  n = 0
                  for it in items:
                      n += it.count() if hasattr(it, "count") and not isinstance(it, (list, set, tuple)) else len(it)
                  if n:
                      print(f"  {field.model._meta.label}.{field.name} -> {value!r}: {n}")

              # Financial / booking visibility (read-only).
              from django.apps import apps
              def cnt(label, **flt):
                  try:
                      m = apps.get_model(label)
                  except LookupError:
                      return "n/a"
                  try:
                      return m.objects.filter(**flt).count()
                  except Exception as exc:
                      return f"err:{type(exc).__name__}"
              print("== booking / financial references to equipment 99 ==")
              print("  bookings:", cnt("equipment.Booking", equipment_id=EQUIP_ID))
              for label in ("users.WalletTransaction", "users.Transaction", "payments.Payment"):
                  for f in ("booking__equipment_id", "equipment_id"):
                      v = cnt(label, **{f: EQUIP_ID})
                      if v not in ("n/a",) and not str(v).startswith("err"):
                          print(f"  {label} via {f}: {v}")

              transaction.set_rollback(True)
          print("EGS_N1_DRYRUN_DONE=YES")
          PY
          )"
          docker exec -w /app "$CID" python manage.py shell -c "$SCRIPT"
