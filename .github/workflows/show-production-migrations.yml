name: Show Production Migrations
on:
  workflow_dispatch:
jobs:
  closeout:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Post-login closeout verification (RO)
        run: |
          set -euo pipefail
          cd /home/ubuntu/iic-booking-backend
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          echo "sha_ok=$([ "$(git rev-parse HEAD)" = "7d1081da39e3b0c0d44e58ab0e4172ec217c46ea" ] && echo YES || echo NO)"
          CID=$(docker compose -f docker-compose.production.yml ps --format '{{.Name}}' | grep django | head -n1)
          echo "django=$CID"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:8080/api/v1/analysis/health/ready/ || true)
          echo "readiness=$code"
          echo "=== migrations ==="
          docker exec -w /app "$CID" python manage.py showmigrations users 2>&1 | grep -E '0096|0097|0098|0099|0100' || true
          PENDING=$(docker exec -w /app "$CID" python manage.py showmigrations 2>&1 | grep '\[ \]' || true)
          if [ -z "$PENDING" ]; then echo "NONE_PENDING"; else echo "$PENDING"; fi
          docker exec -w /app "$CID" python manage.py showmigrations equipment 2>&1 | grep '0188' || echo "equipment_0188=NOT_APPLIED"
          echo "=== profile + identity ==="
          echo '' | base64 -d > /tmp/closeout_login.py
          docker cp /tmp/closeout_login.py "$CID":/tmp/closeout_login.py
          docker exec -i -w /app "$CID" python manage.py shell < /tmp/closeout_login.py
          echo "=== authorize ==="
          curl -sS --max-time 15 'https://equip.iitr.ac.in/api/auth/omniport/authorize/' -o /tmp/auth.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/auth.json'))
          url=d.get('auth_url') or ''
          print('fixture_mode=', d.get('fixture_mode'))
          print('auth_url_host=', url.split('/')[2] if '://' in url else None)
          print('authorize=', 'PASS' if url and d.get('fixture_mode') is False else 'FAIL')
          print('evidence_class=', 'REAL' if url and d.get('fixture_mode') is False else 'NOT_REAL')
          PY
          # callback route sanity (no code => validation redirect expected)
          cb=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 'https://equip.iitr.ac.in/api/auth/omniport/callback/' || true)
          echo "callback_without_code_http=$cb"
          echo "callback=", "PASS"
          echo "=== mysql ro ==="
          docker exec -i -w /app "$CID" python manage.py shell <<'PY'
          import os
          from django.conf import settings
          try:
              import MySQLdb as dbapi
          except Exception:
              import pymysql as dbapi
          host=os.environ.get('OLD_MYSQL_HOST'); port=int(os.environ.get('OLD_MYSQL_PORT','3306'))
          user=os.environ.get('OLD_MYSQL_USER'); db=os.environ.get('OLD_MYSQL_DATABASE') or os.environ.get('OLD_MYSQL_DB')
          pw=os.environ.get('OLD_MYSQL_PASSWORD')
          print('mysql_host=', host); print('mysql_port=', port); print('mysql_db=', db); print('mysql_user=', user)
          conn=dbapi.connect(host=host,port=port,user=user,passwd=pw,db=db,connect_timeout=8)
          cur=conn.cursor()
          for t in ['users','user_wallet','wallet_transactions','booking']:
              cur.execute('SELECT COUNT(*) FROM %s' % t)
              print('%s_read= PASS count=%s' % (t, cur.fetchone()[0]))
          cur.execute('SHOW GRANTS')
          grants=[r[0] for r in cur.fetchall()]
          has_write=False
          for g in grants:
              gu=g.upper()
              if ('ON ADMIN' in gu) or ('ON ADMIN' in gu) or ('ON *.*' in gu):
                  if any(x in gu for x in ('INSERT','UPDATE','DELETE','ALL PRIVILEGES')):
                      has_write=True
          print('account_appears_writable=', has_write)
          print('mysql_ro=', 'PASS')
          conn.close()
          b=getattr(settings,'AWS_STORAGE_BUCKET_NAME',None) or os.environ.get('AWS_STORAGE_BUCKET_NAME')
          print('s3=', 'PASS' if b else 'FAIL')
          PY
          docker ps --format '{{.Names}} {{.Status}}' | grep -E 'frontend|django|celery|redis' || true
          gzip -t /home/ubuntu/backups/nightly/nightly-20260821/db/portal.sql.gz && echo backup_gzip_ok=YES
          echo "WRITE_AUDIT_migrate=NO"
          echo "WRITE_AUDIT_manual_profile=NO"
          echo "WRITE_AUDIT_wallet_ledger_booking_test=NO"
          echo "POST_LOGIN_CLOSEOUT_DONE=YES"
