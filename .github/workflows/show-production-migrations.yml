name: Show Production Migrations
on:
  workflow_dispatch:
jobs:
  user500:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Diagnose /api/auth/user/ 500 after Omniport success
        run: |
          set -euo pipefail
          cd /home/ubuntu/iic-booking-backend
          CID=$(docker compose -f docker-compose.production.yml ps --format '{{.Name}}' | grep django | head -n1)
          echo "HEAD=$(git rev-parse HEAD)"
          echo "django=$CID"
          echo "=== recent errors (redact token-like hex) ==="
          docker logs "$CID" --since 20m 2>&1 | \
            sed -E 's/[0-9a-f]{32,}/[REDACTED_TOKEN]/gi; s/Bearer [^ ]+/Bearer [REDACTED]/gi' | \
            grep -iE 'ERROR|Exception|Traceback|ProgrammingError|UndefinedTable|channeli|auth/user|/user/|Internal' | \
            tail -n 100 || true
