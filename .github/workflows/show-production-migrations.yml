name: Show Production Migrations
on:
  workflow_dispatch:
jobs:
  catch500:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Trigger /user/ 500 and capture ASGI traceback
        run: |
          set -euo pipefail
          cd /home/ubuntu/iic-booking-backend
          CID=$(docker compose -f docker-compose.production.yml ps --format '{{.Name}}' | grep django | head -n1)
          KEY=$(docker exec -i -w /app "$CID" python - <<'PY'
          import os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings.production')
          import django; django.setup()
          from django.contrib.auth import get_user_model
          from rest_framework.authtoken.models import Token
          u=get_user_model().objects.get(pk=66)
          Token.objects.filter(user=u).delete()
          print(Token.objects.create(user=u).key)
          PY
          )
          echo "token_len=${#KEY}"
          # mark time
          START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "START=$START"
          curl -sS -o /tmp/body.json -w 'http=%{http_code}\n' --max-time 20 \
            -H "Authorization: Token $KEY" \
            -H "Host: equip.iitr.ac.in" \
            "http://127.0.0.1:8080/api/auth/user/" || true
          python3 -c "import json;d=json.load(open('/tmp/body.json'));print('detail=',d.get('detail'))"
          sleep 1
          echo "=== logs since trigger ==="
          docker logs "$CID" --since 2m 2>&1 | sed -E "s/$KEY/[REDACTED]/g; s/[0-9a-f]{32,}/[REDACTED]/gi" | tail -n 200
          docker exec -i -w /app -e KEY="$KEY" "$CID" python - <<'PY'
          import os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings.production')
          import django; django.setup()
          from rest_framework.authtoken.models import Token
          Token.objects.filter(key=os.environ['KEY']).delete()
          print('destroyed=YES')
          PY
