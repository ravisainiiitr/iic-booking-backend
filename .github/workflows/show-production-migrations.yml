name: Show Production Migrations
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Channel-I + claim RO probe
        run: |
          set -euo pipefail
          cd /home/ubuntu/iic-booking-backend
          CID=$(docker compose -f docker-compose.production.yml ps --format '{{.Name}}' | grep django | head -n1)
          echo '' | base64 -d > /tmp/ci_probe.py
          docker cp /tmp/ci_probe.py "$CID":/tmp/ci_probe.py
          docker exec -i -w /app "$CID" python manage.py shell < /tmp/ci_probe.py
          echo "=== authorize endpoint ==="
          # expect redirect to Channel-I / oauth
          code=$(curl -sS -o /tmp/auth_out -w '%{http_code}' --max-time 15 'https://equip.iitr.ac.in/api/auth/omniport/login/' || true)
          loc=$(grep -i '^location:' /tmp/auth_out | head -n1 | tr -d '\r' || true)
          echo "authorize_http=$code"
          echo "authorize_location_present=$([ -n "$loc" ] && echo YES || echo NO)"
          # redact query secrets if any
          echo "$loc" | sed -E 's/(client_id=)[^&]+/\1REDACTED/; s/(state=)[^&]+/\1REDACTED/' || true
          code2=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 -L --max-redirs 0 'https://equip.iitr.ac.in/api/auth/omniport/login/' || true)
          echo "authorize_no_follow=$code2"
          # callback URL existence (should not 500 without code)
          cb=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 'https://equip.iitr.ac.in/api/auth/omniport/callback/' || true)
          echo "callback_without_code=$cb"
          echo "CHANNEL_I_PROBE_DONE=YES"
