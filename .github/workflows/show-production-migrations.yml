name: Show Production Migrations
on:
  workflow_dispatch:
jobs:
  show:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Inspect production env MySQL keys and local listeners (no secrets)
        run: |
          set -euo pipefail
          ENV=""
          for p in \
            /home/ubuntu/iic-booking-backend/.envs/.production/.django \
            /home/ubuntu/iic_booking_backend/.envs/.production/.django
          do
            if [ -f "$p" ]; then ENV="$p"; break; fi
          done
          echo "production_env_file=${ENV:-ABSENT}"
          if [ -n "$ENV" ]; then
            for k in OLD_MYSQL_HOST OLD_MYSQL_PORT OLD_MYSQL_DATABASE OLD_MYSQL_USER OLD_MYSQL_PASSWORD LEGACY_MYSQL_HOST LEGACY_MYSQL_USER; do
              if grep -qE "^${k}=" "$ENV"; then
                val=$(grep -E "^${k}=" "$ENV" | head -n1 | cut -d= -f2-)
                if [ "$k" = "OLD_MYSQL_PASSWORD" ] || [ "$k" = "LEGACY_MYSQL_PASSWORD" ]; then
                  if [ -n "$val" ]; then echo "${k}=PRESENT"; else echo "${k}=EMPTY"; fi
                elif [ "$k" = "OLD_MYSQL_HOST" ] || [ "$k" = "LEGACY_MYSQL_HOST" ]; then
                  echo "${k}=PRESENT host_len=${#val}"
                else
                  echo "${k}=${val}"
                fi
              else
                echo "${k}=ABSENT"
              fi
            done
          fi
          echo "=== local mysql-ish listeners (host only) ==="
          ss -lnt 2>/dev/null | awk 'NR==1 || /:(3306|3307|13306)\s/' || netstat -lnt 2>/dev/null | grep -E '3306|3307|13306' || echo "no_listener_scan"
          CID=$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n1 || true)
          echo "django=$CID"
          if [ -n "$CID" ]; then
            docker exec "$CID" sh -c 'for k in OLD_MYSQL_HOST OLD_MYSQL_PORT OLD_MYSQL_DATABASE OLD_MYSQL_USER OLD_MYSQL_PASSWORD; do eval v=\$$k; if [ -n "$v" ]; then if [ "$k" = OLD_MYSQL_PASSWORD ]; then echo ENV_$k=PRESENT; elif [ "$k" = OLD_MYSQL_HOST ]; then echo ENV_$k=PRESENT; else echo ENV_$k=$v; fi; else echo ENV_$k=ABSENT; fi; done'
          fi
