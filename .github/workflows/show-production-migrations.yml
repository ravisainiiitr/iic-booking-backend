# PROBE BRANCH ONLY (probe/egs-preflight-ro) — Equipment Group pre-deployment check (backup + preflight).
# Strictly read-only: SELECT statements inside a READ ONLY transaction that is rolled back.
# No migrate, no writes, no restarts, no env changes. Prints no secrets.
name: Show Production Migrations

on:
  workflow_dispatch:

jobs:
  show:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Locate production Django container
        id: find
        run: |
          set -euo pipefail
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1 || true)"
          if [ -z "$CID" ]; then
            echo "No running django container."
            exit 1
          fi
          echo "Using container: $CID"
          echo "container=$CID" >> "$GITHUB_OUTPUT"
          echo "host_deploy_head=$(git -C /home/ubuntu/iic-booking-backend rev-parse HEAD 2>/dev/null || echo unknown)"
          docker exec "$CID" sh -c 'echo "container_GIT_SHA=${GIT_SHA:-} container_BACKEND_GIT_COMMIT=${BACKEND_GIT_COMMIT:-} PORTAL_VERSION=${PORTAL_VERSION:-}"'

      - name: Deployed release pointer and services
        run: |
          set -euo pipefail
          cd /home/ubuntu/iic-booking-backend
          echo "current_release_tag=$(cat .deploy-state/current_release_tag 2>/dev/null || echo unknown)"
          echo "previous_release_tag=$(cat .deploy-state/previous_release_tag 2>/dev/null || echo unknown)"
          git describe --tags --always || true
          docker compose -f docker-compose.production.yml ps --format 'table {{.Name}}\t{{.Status}}' || true

      - name: Production backup health (read-only)
        run: |
          set -uo pipefail
          echo "=== cron entry ==="
          crontab -l 2>/dev/null | grep -i backup || echo "no backup entry in ubuntu crontab"
          echo "=== nightly backup directories (newest 5) ==="
          ls -1dt /home/ubuntu/backups/nightly/nightly-* 2>/dev/null | head -n 5
          LATEST="$(readlink -f /home/ubuntu/backups/nightly/latest 2>/dev/null || true)"
          echo "latest -> ${LATEST:-MISSING}"
          DUMP="$LATEST/db/portal.sql.gz"
          if [ -f "$DUMP" ]; then
            stat -c 'dump=%n size_bytes=%s mtime=%y' "$DUMP"
            if gzip -t "$DUMP"; then echo "PASS gzip integrity"; else echo "FAIL gzip integrity"; fi
            echo "--- dump header ---"; zcat "$DUMP" | head -n 5
            echo "--- dump footer ---"; zcat "$DUMP" | tail -n 3
            echo "equipment_equipmentgroup_in_dump=$(zcat "$DUMP" | grep -c 'CREATE TABLE public.equipment_equipmentgroup ' || true)"
          else
            echo "FAIL latest dump missing: $DUMP"
          fi
          echo "=== backup log tail ==="
          tail -n 25 /var/log/iic-nightly-backup.log 2>/dev/null || echo "backup log not readable"
          echo "=== RDS automated backups (read-only, if AWS CLI/role available) ==="
          if command -v aws >/dev/null 2>&1; then
            aws rds describe-db-instances --region ap-south-1 --db-instance-identifier iic-booking-rds \
              --query 'DBInstances[0].{retention:BackupRetentionPeriod,latestRestorable:LatestRestorableTime,window:PreferredBackupWindow}' \
              --output json 2>&1 | head -n 20 || true
            aws rds describe-db-snapshots --region ap-south-1 --db-instance-identifier iic-booking-rds \
              --query 'reverse(sort_by(DBSnapshots,&SnapshotCreateTime))[:3].[DBSnapshotIdentifier,SnapshotType,Status,SnapshotCreateTime]' \
              --output text 2>&1 | head -n 10 || true
          else
            echo "aws CLI not installed on runner"
          fi

      - name: Host env file — EQUIPMENT_GROUP_* keys only
        run: |
          set -euo pipefail
          F=/home/ubuntu/iic-booking-backend/.envs/.production/.django
          if [ -f "$F" ]; then
            grep -E '^[[:space:]]*EQUIPMENT_GROUP_[A-Z_]+=' "$F" || echo "no EQUIPMENT_GROUP_* entries in production env file"
          else
            echo "production env file not readable at expected path"
          fi

      - name: Equipment Group read-only preflight
        run: |
          set -euo pipefail
          CID="${{ steps.find.outputs.container }}"
          SCRIPT="$(cat <<'PY'
          import os
          from django.conf import settings
          from django.db import connection, transaction

          db = settings.DATABASES["default"]
          print("DB_VENDOR=", connection.vendor)
          print("DB_ENGINE=", db.get("ENGINE"))
          print("DB_HOST=", db.get("HOST"))
          print("DB_NAME=", db.get("NAME"))

          print("== environment flags (settings / process env) ==")
          for k in ("EQUIPMENT_GROUP_ALTERNATIVE_BOOKING_ENABLED",
                    "EQUIPMENT_GROUP_CROSS_RESCHEDULING_ENABLED",
                    "EQUIPMENT_GROUP_AUTO_ALLOCATION_ENABLED"):
              s = getattr(settings, k, "NOT DEFINED")
              e = os.environ[k] if k in os.environ else "NOT DEFINED"
              print(f"{k}: settings={s!r} env={e!r}")

          def run(title, sql):
              if not connection.in_atomic_block:
                  raise SystemExit("STOP: refusing to query outside the read-only transaction")
              with connection.cursor() as c:
                  c.execute(sql)
                  cols = [d[0] for d in c.description]
                  rows = c.fetchall()
              print(f"== {title} == rows={len(rows)}")
              print(" | ".join(cols))
              for r in rows:
                  print(" | ".join("NULL" if v is None else str(v) for v in r))

          if connection.vendor != "postgresql":
              raise SystemExit(f"STOP: database vendor is {connection.vendor}, not postgresql; SQL not run")

          MULTI = """SELECT equipment_group_id FROM equipment_equipment
                     WHERE equipment_group_id IS NOT NULL GROUP BY 1 HAVING COUNT(*) > 1"""

          with transaction.atomic():
              with connection.cursor() as c:
                  c.execute("SET TRANSACTION READ ONLY")
                  c.execute("SHOW transaction_read_only")
                  ro = c.fetchone()[0]
              print("transaction_read_only=", ro)
              if ro != "on":
                  raise SystemExit("STOP: transaction is not read-only")

              run("server version", "SELECT version()")
              run("current database", "SELECT current_database()")

              run("MIGRATIONS equipment >= 0194 (django_migrations)",
                  "SELECT app, name, applied FROM django_migrations "
                  "WHERE app = 'equipment' AND name >= '0194' ORDER BY name")

              run("SWITCH COLUMNS present on equipment_equipmentgroup",
                  "SELECT column_name FROM information_schema.columns "
                  "WHERE table_schema = current_schema() AND table_name = 'equipment_equipmentgroup' "
                  "AND column_name IN ('alternative_booking_enabled','alternative_search_other_slots',"
                  "'auto_allocation_enabled','cross_rescheduling_enabled') ORDER BY 1")

              run("GROUPS WITH ANY SWITCH ON (schema-tolerant)", """
                  SELECT g.equipment_group_id, g.name,
                         j->>'alternative_booking_enabled' AS alternative_booking,
                         j->>'alternative_search_other_slots' AS search_other_slots,
                         j->>'cross_rescheduling_enabled' AS cross_rescheduling,
                         j->>'auto_allocation_enabled' AS auto_allocation
                  FROM equipment_equipmentgroup g, LATERAL to_jsonb(g) AS j
                  WHERE COALESCE((j->>'alternative_booking_enabled')::boolean, false)
                     OR COALESCE((j->>'alternative_search_other_slots')::boolean, false)
                     OR COALESCE((j->>'cross_rescheduling_enabled')::boolean, false)
                     OR COALESCE((j->>'auto_allocation_enabled')::boolean, false)
                  ORDER BY 1""")

              run("MIXED-DEPARTMENT GROUPS (NULL department counts as its own value)", """
                  SELECT g.equipment_group_id, g.name AS group_name,
                         COUNT(e.equipment_id) AS equipment_count,
                         COUNT(DISTINCT COALESCE(e.internal_department_id::text, 'NULL')) AS distinct_departments,
                         string_agg(DISTINCT COALESCE(d.id::text || ':' || d.name, 'NULL'), ', ') AS departments,
                         string_agg(e.equipment_id::text || ':' || e.code || ' [dept '
                                    || COALESCE(e.internal_department_id::text, 'NULL') || ']',
                                    ', ' ORDER BY e.equipment_id) AS equipment
                  FROM equipment_equipmentgroup g
                  JOIN equipment_equipment e ON e.equipment_group_id = g.equipment_group_id
                  LEFT JOIN users_department d ON d.id = e.internal_department_id
                  GROUP BY g.equipment_group_id, g.name
                  HAVING COUNT(DISTINCT COALESCE(e.internal_department_id::text, 'NULL')) > 1
                  ORDER BY 1""")

              run("GROUPED EQUIPMENT WITHOUT DEPARTMENT", """
                  SELECT e.equipment_group_id, g.name AS group_name, e.equipment_id, e.code, e.name
                  FROM equipment_equipment e
                  JOIN equipment_equipmentgroup g ON g.equipment_group_id = e.equipment_group_id
                  WHERE e.internal_department_id IS NULL
                  ORDER BY 1, 3""")

              run("GROUP INVENTORY", """
                  SELECT COUNT(*) AS total_groups,
                         COALESCE(SUM(n), 0) AS equipment_in_groups,
                         COUNT(*) FILTER (WHERE n = 0) AS groups_zero_members,
                         COUNT(*) FILTER (WHERE n = 1) AS groups_one_member,
                         COUNT(*) FILTER (WHERE n > 1) AS groups_multiple_members,
                         COALESCE(MAX(n), 0) AS max_group_size
                  FROM (SELECT g.equipment_group_id, COUNT(e.equipment_id) AS n
                        FROM equipment_equipmentgroup g
                        LEFT JOIN equipment_equipment e ON e.equipment_group_id = g.equipment_group_id
                        GROUP BY g.equipment_group_id) s""")

              run("MULTI-MEMBER GROUPS (detail)", """
                  SELECT g.equipment_group_id, g.name AS group_name, COUNT(*) AS members,
                         string_agg(e.equipment_id::text || ':' || e.code || ' [dept '
                                    || COALESCE(e.internal_department_id::text, 'NULL') || ', ' || COALESCE(e.status, '-') || ']',
                                    ', ' ORDER BY e.equipment_id) AS equipment
                  FROM equipment_equipmentgroup g
                  JOIN equipment_equipment e ON e.equipment_group_id = g.equipment_group_id
                  GROUP BY g.equipment_group_id, g.name HAVING COUNT(*) > 1 ORDER BY 1""")

              run("CHARGE-PROFILE SETTING DIFFERENCES (stored settings only)", f"""
                  WITH cp AS (
                      SELECT e.equipment_group_id, e.code, cj->>'user_type' AS user_type,
                             COALESCE(cj->>'pricing_profile', '-') AS pricing_profile,
                             (cj - 'id' - 'equipment_id' - 'user_type' - 'pricing_profile' - 'is_active'
                                 - 'display_text' - 'created_at' - 'updated_at'
                                 || jsonb_build_object('equipment_profile_type', to_jsonb(e)->'profile_type'))::text AS config
                      FROM equipment_equipment e
                      JOIN equipment_chargeprofile c ON c.equipment_id = e.equipment_id AND c.is_active
                      CROSS JOIN LATERAL to_jsonb(c) AS cj
                      WHERE e.equipment_group_id IN ({MULTI}))
                  SELECT equipment_group_id, user_type, pricing_profile,
                         COUNT(DISTINCT config) AS distinct_configs,
                         string_agg(code || ' => ' || config, ' ;; ' ORDER BY code) AS configs
                  FROM cp GROUP BY 1, 2, 3 HAVING COUNT(DISTINCT config) > 1 ORDER BY 1, 2, 3""")

              run("MISSING ACTIVE CHARGE PROFILES (another member has one)", f"""
                  WITH members AS (
                      SELECT equipment_group_id, equipment_id, code FROM equipment_equipment
                      WHERE equipment_group_id IN ({MULTI})),
                  keys AS (
                      SELECT DISTINCT m.equipment_group_id, to_jsonb(c)->>'user_type' AS user_type,
                             COALESCE(to_jsonb(c)->>'pricing_profile', '-') AS pricing_profile
                      FROM members m JOIN equipment_chargeprofile c ON c.equipment_id = m.equipment_id AND c.is_active)
                  SELECT k.equipment_group_id, k.user_type, k.pricing_profile, m.equipment_id, m.code
                  FROM keys k JOIN members m ON m.equipment_group_id = k.equipment_group_id
                  WHERE NOT EXISTS (
                      SELECT 1 FROM equipment_chargeprofile c
                      WHERE c.equipment_id = m.equipment_id AND c.is_active
                        AND to_jsonb(c)->>'user_type' = k.user_type
                        AND COALESCE(to_jsonb(c)->>'pricing_profile', '-') = k.pricing_profile)
                  ORDER BY 1, 2, 3, 4""")

              run("DATA FINGERPRINT (compare before/after migration)", """
                  SELECT (SELECT COUNT(*) FROM equipment_equipmentgroup) AS groups,
                         (SELECT md5(string_agg(equipment_group_id::text || '|' || name || '|' || COALESCE(code, '')
                                 || '|' || COALESCE(description, ''), ',' ORDER BY equipment_group_id))
                          FROM equipment_equipmentgroup) AS groups_md5,
                         (SELECT COUNT(*) FROM equipment_equipment) AS equipment,
                         (SELECT md5(string_agg(equipment_id::text || '|' || COALESCE(equipment_group_id::text, '-')
                                 || '|' || COALESCE(internal_department_id::text, '-') || '|' || code
                                 || '|' || COALESCE(status, ''), ',' ORDER BY equipment_id))
                          FROM equipment_equipment) AS equipment_md5,
                         (SELECT COUNT(*) FROM equipment_equipmentgroupquota) AS group_quotas,
                         (SELECT COUNT(*) FROM equipment_chargeprofile) AS charge_profiles""")

              transaction.set_rollback(True)
          print("EGS_PREFLIGHT_RO_DONE=YES")
          PY
          )"
          docker exec -w /app "$CID" python manage.py shell -c "$SCRIPT"
