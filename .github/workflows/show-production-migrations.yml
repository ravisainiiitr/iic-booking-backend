# PROBE BRANCH ONLY (probe/egs-preflight-ro) — Phase 6/7: READ-ONLY post-deploy verification.
# No migrations, no restarts, no writes: DB access is inside READ ONLY transactions that are rolled back.
name: Show Production Migrations

on:
  workflow_dispatch:

env:
  RELEASE_TAG: v2.5.46.48-equipment-group-alternatives
  RELEASE_SHORT: 43974e3
  DEPLOY_DIR: /home/ubuntu/iic-booking-backend
  COMPOSE_FILE: docker-compose.production.yml
  EXPECTED_FP: "29|a134b37996d15a9fa1f8cef701afc088|63|7c49e45686e1722a6846dd83ab7e00d1|50|296"

jobs:
  show:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Checkout probe files
        uses: actions/checkout@v4
        with:
          path: probe
          fetch-depth: 1

      - name: Deployed release state
        id: st
        run: |
          set -euo pipefail
          CUR_TAG="$(cat "$DEPLOY_DIR/.deploy-state/current_release_tag")"
          PREV_TAG="$(cat "$DEPLOY_DIR/.deploy-state/previous_release_tag" 2>/dev/null || echo '?')"
          HEAD="$(git -C "$DEPLOY_DIR" rev-parse --short HEAD)"
          echo "current_release_tag=$CUR_TAG previous_release_tag=$PREV_TAG deploy_head=$HEAD"
          [ "$CUR_TAG" = "$RELEASE_TAG" ] && [ "$HEAD" = "$RELEASE_SHORT" ] || { echo "STATE FAIL"; exit 1; }
          docker compose -f "$DEPLOY_DIR/$COMPOSE_FILE" ps --format 'table {{.Name}}\t{{.Status}}'
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          echo "container=$CID" >> "$GITHUB_OUTPUT"
          docker inspect -f 'container={{.Name}} started={{.State.StartedAt}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}n/a{{end}} restarts={{.RestartCount}}' "$CID"
          echo "STATE PASS"

      - name: Django start log scan (since deploy)
        run: |
          set +e +o pipefail
          CID="${{ steps.st.outputs.container }}"
          docker logs "$CID" > "$RUNNER_TEMP/django.log" 2>&1
          echo "log_lines=$(wc -l < "$RUNNER_TEMP/django.log")"
          for p in 'Traceback' 'ImportError' 'ModuleNotFoundError' 'ProgrammingError' 'OperationalError' 'You have [0-9]+ unapplied migration' 'column .* does not exist' ' 500 ' 'CRITICAL'; do
            echo "pattern[$p]=$(grep -Ec "$p" "$RUNNER_TEMP/django.log")"
          done
          echo "--- first matching lines (if any) ---"
          grep -En 'Traceback|ImportError|ModuleNotFoundError|ProgrammingError|OperationalError|unapplied migration|does not exist|CRITICAL' "$RUNNER_TEMP/django.log" | head -n 20
          echo "--- last 15 log lines ---"
          tail -n 15 "$RUNNER_TEMP/django.log" | cut -c1-240
          true

      - name: Django check + migration state (read-only)
        run: |
          set -euo pipefail
          CID="${{ steps.st.outputs.container }}"
          docker exec -w /app "$CID" python manage.py check 2>&1 | grep -v 'UserWarning\|Outgoing email' || true
          echo "--- showmigrations equipment (tail) ---"
          docker exec -w /app "$CID" python manage.py showmigrations equipment 2>/dev/null | tail -n 3
          docker exec -w /app "$CID" python manage.py showmigrations equipment 2>/dev/null | grep -q '\[X\] 0197_equipment_group_alternatives' \
            || { echo "MIGRATION STATE FAIL"; exit 1; }
          echo "--- migrate --plan (all apps; must be empty) ---"
          docker exec -w /app "$CID" python manage.py migrate --plan 2>/dev/null | tee "$RUNNER_TEMP/plan.txt"
          PENDING="$(grep -cE '^[a-z_]+\.[0-9]{4}_' "$RUNNER_TEMP/plan.txt" || true)"
          echo "pending_migrations=$PENDING"
          echo "--- makemigrations equipment --check --dry-run ---"
          set +e
          docker exec -w /app "$CID" python manage.py makemigrations equipment --check --dry-run 2>/dev/null
          echo "makemigrations_check_exit=$?"
          set -e
          echo "--- EQUIPMENT_GROUP_* env var names in container (values not printed) ---"
          docker exec "$CID" sh -c 'env | cut -d= -f1 | grep -c "^EQUIPMENT_GROUP_" || true'
          echo "CHECK STEP DONE"

      - name: HTTP smoke (public GETs through the live app)
        run: |
          set -euo pipefail
          FAIL=0
          for u in /api/v1/analysis/health/ready/ /api/version/ /api/equipments/ /api/equipments/catalog-departments/ /api/equipments/1/ /api/equipments/47/; do
            code="$(curl -sS -o "$RUNNER_TEMP/body" -w '%{http_code}' --max-time 20 "http://127.0.0.1:8080$u" || echo 000)"
            echo "GET $u -> $code bytes=$(wc -c < "$RUNNER_TEMP/body")"
            [ "$code" = "200" ] || FAIL=1
          done
          [ "$FAIL" = "0" ] && echo "HTTP SMOKE PASS" || { echo "HTTP SMOKE FAIL"; exit 1; }

      - name: In-process regression (READ ONLY transaction, rolled back)
        run: |
          set -euo pipefail
          CID="${{ steps.st.outputs.container }}"
          docker cp "$GITHUB_WORKSPACE/probe/.github/probe/egs_regression.py" "$CID:/tmp/egs_regression.py"
          docker exec -w /app "$CID" python manage.py shell -c "exec(open('/tmp/egs_regression.py').read())" 2>&1 \
            | grep -v 'UserWarning\|Outgoing email\|warnings.warn' | tee "$RUNNER_TEMP/reg.txt"
          docker exec "$CID" rm -f /tmp/egs_regression.py
          grep -q 'REGRESSION_SUMMARY .* failed=0' "$RUNNER_TEMP/reg.txt" || { echo "REGRESSION HAS FAILURES"; exit 1; }
          echo "REGRESSION PASS"

      - name: Data fingerprint unchanged since Phase 3
        if: always()
        run: |
          set -euo pipefail
          CID="${{ steps.st.outputs.container }}"
          FP="$(docker exec -w /app "$CID" python manage.py shell -c "
          from django.db import connection, transaction
          with transaction.atomic():
              c = connection.cursor()
              c.execute('SET TRANSACTION READ ONLY')
              c.execute('''SELECT (SELECT COUNT(*) FROM equipment_equipmentgroup),
                (SELECT md5(string_agg(equipment_group_id::text||'|'||name||'|'||COALESCE(code,'')||'|'||COALESCE(description,''), ',' ORDER BY equipment_group_id)) FROM equipment_equipmentgroup),
                (SELECT COUNT(*) FROM equipment_equipment),
                (SELECT md5(string_agg(equipment_id::text||'|'||COALESCE(equipment_group_id::text,'-')||'|'||COALESCE(internal_department_id::text,'-')||'|'||code||'|'||COALESCE(status,''), ',' ORDER BY equipment_id)) FROM equipment_equipment),
                (SELECT COUNT(*) FROM equipment_equipmentgroupquota), (SELECT COUNT(*) FROM equipment_chargeprofile)''')
              print('|'.join(str(v) for v in c.fetchone()))
              c.execute('''SELECT COUNT(*) FILTER (WHERE alternative_booking_enabled OR alternative_search_other_slots OR cross_rescheduling_enabled OR auto_allocation_enabled) FROM equipment_equipmentgroup''')
              print('SWITCHES_ON', c.fetchone()[0])
              transaction.set_rollback(True)
          " 2>/dev/null)"
          echo "$FP"
          echo "$FP" | grep -qx "$EXPECTED_FP" && echo "FINGERPRINT UNCHANGED" || { echo "FINGERPRINT CHANGED"; exit 1; }
          echo "$FP" | grep -qx 'SWITCHES_ON 0' || { echo "SWITCH ON"; exit 1; }
          echo "PHASE67_DONE=YES"
