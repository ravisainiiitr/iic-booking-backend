# Read-only production migration inventory for pilot closure / promotion gates.
# Does NOT run migrate. Does NOT modify the database.
name: Show Production Migrations

on:
  workflow_dispatch:

jobs:
  show:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Locate production Django container
        id: find
        run: |
          set -euo pipefail
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' | head -n 40 || true
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1 || true)"
          if [ -z "$CID" ]; then
            echo "No running django container."
            exit 1
          fi
          echo "Using container: $CID"
          echo "container=$CID" >> "$GITHUB_OUTPUT"

      - name: showmigrations (RA / notifications / provisioning / sync / equipment)
        run: |
          set -euo pipefail
          CID="${{ steps.find.outputs.container }}"
          # research_copilot may be absent on production while the feature remains OFF / undeployed.
          set +e
          docker exec -w /app "$CID" python manage.py showmigrations research_copilot > /tmp/showmigrations-copilot.txt 2>&1
          rc_copilot=$?
          set -e
          echo "=== research_copilot (optional while Copilot OFF) exit=$rc_copilot ==="
          cat /tmp/showmigrations-copilot.txt || true
          docker exec -w /app "$CID" python manage.py showmigrations \
            communication \
            remote_analysis \
            device_provisioning \
            sync \
            equipment \
            | tee /tmp/showmigrations-ai11.txt
          echo "=== pending lines (if any) ==="
          grep -E '^\s*\[ \]' /tmp/showmigrations-ai11.txt || echo "No pending migrations listed for selected apps."

      - name: Container / disk sanity (non-destructive)
        run: |
          set -euo pipefail
          df -h / | head -n 5 || true
          docker exec "${{ steps.find.outputs.container }}" python -c "import os; os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings.production'); import django; django.setup(); from django.conf import settings; print('RESEARCH_COPILOT_ENABLED=', getattr(settings,'RESEARCH_COPILOT_ENABLED',None)); print('FCM_SERVER_KEY_configured=', bool(getattr(settings,'FCM_SERVER_KEY',''))); print('INSTALLED_APPS_has_research_copilot=', any('research_copilot' in str(a) for a in settings.INSTALLED_APPS)); print('OPENAI_API_KEY_configured=', bool(str(getattr(settings,'OPENAI_API_KEY','') or '').strip())); pilot=(getattr(settings,'RESEARCH_COPILOT_PILOT_EMAILS',None) or ''); print('RESEARCH_COPILOT_PILOT_EMAILS_configured=', bool(str(pilot).strip())); print('RESEARCH_COPILOT_PILOT_EMAILS_count=', len([e for e in str(pilot).split(',') if e.strip()]))"
