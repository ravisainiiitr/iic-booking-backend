name: Show Production Migrations
on:
  workflow_dispatch:
jobs:
  claim_proof:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Prove claim candidates without printing values
        run: |
          set -euo pipefail
          cd /home/ubuntu/iic-booking-backend
          CID=$(docker compose -f docker-compose.production.yml ps --format '{{.Name}}' | grep django | head -n1)
          docker exec -i -w /app "$CID" python - <<'PY'
          import os, hashlib, re
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings.production')
          import django; django.setup()
          from django.contrib.auth import get_user_model
          from iic_booking.users.legacy_ledger.reader import OldMySQLReader
          from iic_booking.users.legacy_ledger.channel_i_identity import looks_like_iic_operator_code
          u=get_user_model().objects.get(pk=66)
          emp=(u.emp_id or '').strip()
          print('emp_present=', bool(emp))
          print('emp_is_operator_code=', looks_like_iic_operator_code(emp))
          print('emp_is_digit=', emp.isdigit())
          print('emp_len=', len(emp))
          print('emp_sha12=', hashlib.sha256(emp.encode()).hexdigest()[:12])
          # internal_id if any
          iid=str(getattr(u,'internal_id', None) or '').strip()
          print('internal_id_present=', bool(iid))
          with OldMySQLReader() as reader:
              rows=reader.fetchall('SELECT emp_id FROM users WHERE emp_id=%s LIMIT 5', (emp,))
              print('legacy_exact_match_count=', len(rows or []))
              # Does legacy user with this emp_id have email domain iitr? presence only
              rows2=reader.fetchall(
                  'SELECT email FROM users WHERE emp_id=%s LIMIT 1', (emp,)
              )
              email=(rows2[0].get('email') if rows2 else '') or ''
              print('legacy_email_present=', bool(str(email).strip()))
              print('legacy_email_is_iitr=', str(email).lower().endswith('@iitr.ac.in') if email else False)
              # wallet
              w=reader.fetchall(
                  'SELECT COUNT(*) AS c FROM user_wallet uw JOIN users u ON u.id=uw.user_id WHERE u.emp_id=%s',
                  (emp,),
              )
              print('legacy_wallet_count=', (w[0].get('c') if w else None))
          print('userinfo_claim_candidates=', 'username=YES facultyMember.employeeId=NO student.enrolmentNumber=NO')
          print('recommended_claim=', 'username')
          print('rationale=', 'live userinfo has username; facultyMember/student objects empty; portal emp_id exact-matches legacy admin.users.emp_id count=1')
          PY
