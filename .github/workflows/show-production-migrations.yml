name: Show Production Migrations
on:
  workflow_dispatch:
jobs:
  http_user:
    runs-on: [self-hosted, Linux]
    steps:
      - name: HTTP reproduce /api/auth/user/ 500 (destroy temp token)
        run: |
          set -euo pipefail
          cd /home/ubuntu/iic-booking-backend
          CID=$(docker compose -f docker-compose.production.yml ps --format '{{.Name}}' | grep django | head -n1)
          docker exec -i -w /app "$CID" python - <<'PY'
          import os, json
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings.production')
          import django; django.setup()
          from django.contrib.auth import get_user_model
          from rest_framework.authtoken.models import Token
          from django.test import Client
          User=get_user_model()
          u=User.objects.filter(pk=56).first() or User.objects.filter(pk=66).first()
          print('target_pk=', u.pk)
          # create temp token then call endpoints
          Token.objects.filter(user=u).delete()
          tok=Token.objects.create(user=u)
          key=tok.key
          c=Client()
          for path in ['/api/auth/user/', '/api/auth/profile/me/', '/api/v1/users/me/', '/api/users/me/']:
              try:
                  r=c.get(path, HTTP_AUTHORIZATION=f'Token {key}')
                  print('path=', path, 'status=', r.status_code, 'body_prefix=', (r.content[:160].decode('utf-8','replace')))
              except Exception as e:
                  print('path=', path, 'EXC', type(e).__name__, str(e)[:200])
          Token.objects.filter(key=key).delete()
          print('temp_token_destroyed=YES')
          PY

          echo "=== uvicorn/asgi errors last 20m mentioning user ==="
          docker logs "$CID" --since 20m 2>&1 | sed -E 's/[0-9a-f]{32,}/[REDACTED]/gi' | grep -iE 'ERROR.*(user|auth|Internal)|Exception in ASGI|Unhandled|channeliidentity|rbac' | tail -n 40 || true
