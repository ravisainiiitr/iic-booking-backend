# PROBE BRANCH ONLY (probe/egs-preflight-ro) — remove TEST group 30 "N1 Quota Group" (N1-GRP)
# and its only member, TEST equipment 99 "N1-QUOTA", as requested by the owner.
# Step 1 backs up every row the delete will touch (read-only) and uploads it as an artifact.
# Step 3 deletes only if the rows collected at delete time exactly match the backup.
name: Show Production Migrations

on:
  workflow_dispatch:

jobs:
  show:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Locate production Django container
        id: find
        run: |
          set -euo pipefail
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          echo "container=$CID host_deploy_head=$(git -C /home/ubuntu/iic-booking-backend rev-parse HEAD 2>/dev/null || echo unknown)"
          echo "container=$CID" >> "$GITHUB_OUTPUT"

      - name: Backup rows to be removed (read-only)
        run: |
          set -euo pipefail
          CID="${{ steps.find.outputs.container }}"
          SCRIPT="$(cat <<'PY'
          import json
          from django.core import serializers
          from django.db import connection, transaction
          from django.db.models.deletion import Collector
          from iic_booking.equipment.models import Booking, Equipment, EquipmentGroup

          GROUP_ID, GROUP_NAME, GROUP_CODE = 30, "N1 Quota Group", "N1-GRP"
          EQUIP_ID, EQUIP_CODE = 99, "N1-QUOTA"
          EXPECTED_MODELS = {"equipment.ChargeProfile", "equipment.Equipment", "equipment.EquipmentGroup",
                             "equipment.SlotMaster", "equipment.DailySlot", "equipment.EquipmentGroupQuota"}

          with transaction.atomic():
              with connection.cursor() as c:
                  c.execute("SET TRANSACTION READ ONLY")
              g = EquipmentGroup.objects.get(pk=GROUP_ID)
              eq = Equipment.objects.get(pk=EQUIP_ID)
              members = list(Equipment.objects.filter(equipment_group_id=GROUP_ID).values_list("pk", flat=True))
              assert g.name == GROUP_NAME and g.code == GROUP_CODE, "group identity mismatch"
              assert eq.code == EQUIP_CODE and eq.equipment_group_id == GROUP_ID, "equipment identity mismatch"
              assert members == [EQUIP_ID], f"unexpected group members {members}"
              assert Booking.objects.filter(equipment_id=EQUIP_ID).count() == 0, "equipment has bookings"

              collector = Collector(using="default")
              collector.collect([eq])
              collector.collect([g])
              objs = [o for model_objs in collector.data.values() for o in model_objs]
              for qs in collector.fast_deletes:
                  objs.extend(list(qs))
              manifest = {}
              for o in objs:
                  manifest.setdefault(o._meta.label, set()).add(o.pk)
              unexpected = set(manifest) - EXPECTED_MODELS
              assert not unexpected, f"unexpected models in cascade: {sorted(unexpected)}"
              manifest = {k: sorted(v) for k, v in sorted(manifest.items())}
              payload = {"manifest": manifest, "rows": json.loads(serializers.serialize("json", objs))}
              with open("/tmp/egs_n1_backup.json", "w", encoding="utf-8") as fh:
                  json.dump(payload, fh, indent=1, default=str)
              transaction.set_rollback(True)
          print("BACKUP manifest:", {k: len(v) for k, v in manifest.items()})
          print("BACKUP rows:", len(payload["rows"]))
          PY
          )"
          docker exec -w /app "$CID" python manage.py shell -c "$SCRIPT"
          docker cp "$CID:/tmp/egs_n1_backup.json" "$RUNNER_TEMP/egs_n1_backup.json"
          ls -l "$RUNNER_TEMP/egs_n1_backup.json"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: egs-n1-quota-group-backup
          path: ${{ runner.temp }}/egs_n1_backup.json
          retention-days: 90
          if-no-files-found: error

      - name: Delete test group 30 and test equipment 99 (guarded)
        run: |
          set -euo pipefail
          CID="${{ steps.find.outputs.container }}"
          SCRIPT="$(cat <<'PY'
          import json
          from django.db import connection, transaction
          from django.db.models.deletion import Collector
          from iic_booking.equipment.models import Booking, Equipment, EquipmentGroup

          GROUP_ID, EQUIP_ID = 30, 99
          with open("/tmp/egs_n1_backup.json", encoding="utf-8") as fh:
              backed_up = json.load(fh)["manifest"]

          with transaction.atomic():
              with connection.cursor() as c:
                  c.execute("SET LOCAL lock_timeout = '5s'")
                  c.execute("SET LOCAL statement_timeout = '60s'")
              g = EquipmentGroup.objects.select_for_update().get(pk=GROUP_ID)
              eq = Equipment.objects.select_for_update().get(pk=EQUIP_ID)
              assert g.name == "N1 Quota Group" and g.code == "N1-GRP", "group identity mismatch"
              assert eq.code == "N1-QUOTA" and eq.equipment_group_id == GROUP_ID, "equipment identity mismatch"
              assert list(Equipment.objects.filter(equipment_group_id=GROUP_ID).values_list("pk", flat=True)) == [EQUIP_ID]
              assert Booking.objects.filter(equipment_id=EQUIP_ID).count() == 0, "equipment has bookings"

              collector = Collector(using="default")
              collector.collect([eq])
              collector.collect([g])
              now = {}
              for model, objs in collector.data.items():
                  now.setdefault(model._meta.label, set()).update(o.pk for o in objs)
              for qs in collector.fast_deletes:
                  now.setdefault(qs.model._meta.label, set()).update(qs.values_list("pk", flat=True))
              now = {k: sorted(v) for k, v in sorted(now.items()) if v}
              if now != backed_up:
                  raise SystemExit(f"STOP: rows changed since backup; nothing deleted. now={ {k: len(v) for k, v in now.items()} }")

              deleted_total, per_model = collector.delete()
              print("DELETED:", deleted_total, dict(sorted(per_model.items())))
              assert not Equipment.objects.filter(pk=EQUIP_ID).exists()
              assert not EquipmentGroup.objects.filter(pk=GROUP_ID).exists()
          print("EGS_N1_DELETE_DONE=YES")
          PY
          )"
          docker exec -w /app "$CID" python manage.py shell -c "$SCRIPT"

      - name: Post-check (read-only)
        run: |
          set -euo pipefail
          CID="${{ steps.find.outputs.container }}"
          docker exec -w /app "$CID" python manage.py shell -c "
          from django.db import connection
          with connection.cursor() as c:
              c.execute('SELECT COUNT(*) FROM equipment_equipment WHERE equipment_id = 99')
              print('equipment_99_rows=', c.fetchone()[0])
              c.execute('SELECT COUNT(*) FROM equipment_equipmentgroup WHERE equipment_group_id = 30')
              print('group_30_rows=', c.fetchone()[0])
              c.execute('SELECT COUNT(*) FROM equipment_equipment e JOIN equipment_equipmentgroup g ON g.equipment_group_id = e.equipment_group_id WHERE e.internal_department_id IS NULL')
              print('grouped_equipment_without_department=', c.fetchone()[0])
          "
          docker exec "$CID" rm -f /tmp/egs_n1_backup.json
