# PROBE BRANCH ONLY (probe/egs-preflight-ro) — Phase 3: apply ONLY equipment.0197_equipment_group_alternatives.
# Gated: backup fresh + complete, release tag/file identity, baseline state, plan == exactly 0197.
# Runs in a one-off container of the CURRENT production image with the tagged 0197 file mounted read-only;
# running services are not touched. 0197 is additive with db_default, so the running code stays compatible.
name: Show Production Migrations

on:
  workflow_dispatch:

env:
  RELEASE_TAG: v2.5.46.48-equipment-group-alternatives
  RELEASE_SHA: 43974e358373d75f03b832cfde5a716c35f36c66
  MIGRATION_BLOB: d52808be4a9021a30e3afe4694f54df342c96dc4
  MIGRATION_REL: iic_booking/equipment/migrations/0197_equipment_group_alternatives.py
  BASELINE_TAG: v2.5.46.47-recharge-cc-ebsd-keys
  DEPLOY_DIR: /home/ubuntu/iic-booking-backend
  COMPOSE_FILE: docker-compose.production.yml

jobs:
  show:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Checkout release tag (read-only copy in runner workspace)
        uses: actions/checkout@v4
        with:
          ref: v2.5.46.48-equipment-group-alternatives
          path: release
          fetch-depth: 1

      - name: "Gate A: latest nightly backup fresh and complete"
        run: |
          set -euo pipefail
          DUMP="$(readlink -f /home/ubuntu/backups/nightly/latest)/db/portal.sql.gz"
          test -f "$DUMP" || { echo "GATE A FAIL: dump missing"; exit 1; }
          AGE_H=$(( ( $(date +%s) - $(stat -c %Y "$DUMP") ) / 3600 ))
          stat -c 'dump=%n size_bytes=%s mtime=%y' "$DUMP"
          echo "dump_age_hours=$AGE_H"
          [ "$AGE_H" -le 36 ] || { echo "GATE A FAIL: backup older than 36h"; exit 1; }
          gzip -t "$DUMP"
          COMPLETE=$( (set +e +o pipefail; zcat "$DUMP" | tail -n 20 | grep -c 'PostgreSQL database dump complete') )
          echo "dump_complete_marker=$COMPLETE"
          [ "$COMPLETE" -ge 1 ] || { echo "GATE A FAIL: dump-complete marker missing"; exit 1; }
          echo "GATE A PASS"

      - name: "Gate B: release identity and production baseline"
        id: base
        run: |
          set -euo pipefail
          HEAD_SHA="$(git -C release rev-parse HEAD)"
          BLOB="$(git -C release rev-parse "HEAD:$MIGRATION_REL")"
          echo "release_head=$HEAD_SHA migration_blob=$BLOB"
          [ "$HEAD_SHA" = "$RELEASE_SHA" ] || { echo "GATE B FAIL: release sha mismatch"; exit 1; }
          [ "$BLOB" = "$MIGRATION_BLOB" ] || { echo "GATE B FAIL: migration file mismatch"; exit 1; }
          CUR_TAG="$(cat "$DEPLOY_DIR/.deploy-state/current_release_tag")"
          echo "production_current_release_tag=$CUR_TAG"
          [ "$CUR_TAG" = "$BASELINE_TAG" ] || { echo "GATE B FAIL: production not on baseline tag"; exit 1; }
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          echo "container=$CID" >> "$GITHUB_OUTPUT"
          echo "running_container=$CID"
          echo "GATE B PASS"

      - name: "Gate C: pre-migration state + data fingerprint (read-only)"
        run: |
          set -euo pipefail
          CID="${{ steps.base.outputs.container }}"
          docker exec -w /app "$CID" python manage.py shell -c "
          from django.db import connection, transaction
          with transaction.atomic():
              c = connection.cursor()
              c.execute('SET TRANSACTION READ ONLY')
              c.execute(\"SELECT name FROM django_migrations WHERE app='equipment' ORDER BY name DESC LIMIT 1\")
              last = c.fetchone()[0]
              c.execute(\"SELECT COUNT(*) FROM django_migrations WHERE app='equipment' AND name='0197_equipment_group_alternatives'\")
              has0197 = c.fetchone()[0]
              c.execute(\"SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=current_schema() AND ((table_name='equipment_equipmentgroup' AND column_name IN ('alternative_booking_enabled','alternative_search_other_slots','auto_allocation_enabled','cross_rescheduling_enabled')) OR (table_name='equipment_equipment' AND column_name='alternative_priority'))\")
              cols = c.fetchone()[0]
              print('pre_last_equipment_migration=', last)
              print('pre_0197_recorded=', has0197, 'pre_new_columns=', cols)
              assert last == '0196_disable_remote_analysis_all_equipment' and has0197 == 0 and cols == 0, 'GATE C FAIL: unexpected pre-state'
              transaction.set_rollback(True)
          print('GATE C PASS')
          "
          docker exec -w /app "$CID" python manage.py shell -c "
          from django.db import connection
          c = connection.cursor()
          c.execute('''SELECT (SELECT COUNT(*) FROM equipment_equipmentgroup),
            (SELECT md5(string_agg(equipment_group_id::text||'|'||name||'|'||COALESCE(code,'')||'|'||COALESCE(description,''), ',' ORDER BY equipment_group_id)) FROM equipment_equipmentgroup),
            (SELECT COUNT(*) FROM equipment_equipment),
            (SELECT md5(string_agg(equipment_id::text||'|'||COALESCE(equipment_group_id::text,'-')||'|'||COALESCE(internal_department_id::text,'-')||'|'||code||'|'||COALESCE(status,''), ',' ORDER BY equipment_id)) FROM equipment_equipment),
            (SELECT COUNT(*) FROM equipment_equipmentgroupquota), (SELECT COUNT(*) FROM equipment_chargeprofile)''')
          print('|'.join(str(v) for v in c.fetchone()))
          " | tail -n 1 | tee "$RUNNER_TEMP/fp_before.txt"

      - name: "Gate D: migrate --plan must be exactly equipment.0197"
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          MIG_SRC="$GITHUB_WORKSPACE/release/$MIGRATION_REL"
          docker compose -f "$COMPOSE_FILE" run --rm --no-deps --entrypoint "" --user django \
            -v "$MIG_SRC:/app/$MIGRATION_REL:ro" \
            django python manage.py migrate equipment 0197_equipment_group_alternatives --plan 2>&1 | tee "$RUNNER_TEMP/plan.txt"
          PLANNED="$(grep -E '^[a-z_]+\.[0-9]{4}_' "$RUNNER_TEMP/plan.txt" || true)"
          echo "planned_migrations=[$PLANNED]"
          [ "$PLANNED" = "equipment.0197_equipment_group_alternatives" ] || { echo "GATE D FAIL: plan is not exactly 0197"; exit 1; }
          echo "--- SQL (sqlmigrate) ---"
          docker compose -f "$COMPOSE_FILE" run --rm --no-deps --entrypoint "" --user django \
            -v "$MIG_SRC:/app/$MIGRATION_REL:ro" \
            django python manage.py sqlmigrate equipment 0197_equipment_group_alternatives 2>&1
          echo "GATE D PASS"

      - name: Apply ONLY equipment.0197_equipment_group_alternatives
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          MIG_SRC="$GITHUB_WORKSPACE/release/$MIGRATION_REL"
          docker compose -f "$COMPOSE_FILE" run --rm --no-deps --entrypoint "" --user django \
            -v "$MIG_SRC:/app/$MIGRATION_REL:ro" \
            django python manage.py migrate equipment 0197_equipment_group_alternatives --noinput 2>&1 | tee "$RUNNER_TEMP/migrate.txt"
          grep -q 'Applying equipment.0197_equipment_group_alternatives... OK' "$RUNNER_TEMP/migrate.txt" \
            || { echo "MIGRATION FAIL: 0197 not reported OK"; exit 1; }
          APPLIED="$(grep -c '^  Applying ' "$RUNNER_TEMP/migrate.txt" || true)"
          echo "applied_count=$APPLIED"
          [ "$APPLIED" = "1" ] || { echo "MIGRATION FAIL: unexpected number of migrations applied"; exit 1; }
          echo "MIGRATION 0197 APPLIED"

      - name: Post-migration verification (read-only)
        run: |
          set -euo pipefail
          CID="${{ steps.base.outputs.container }}"
          docker exec -w /app "$CID" python manage.py shell -c "
          from django.db import connection, transaction
          with transaction.atomic():
              c = connection.cursor()
              c.execute('SET TRANSACTION READ ONLY')
              c.execute(\"SELECT name, applied FROM django_migrations WHERE app='equipment' AND name >= '0196' ORDER BY name\")
              for r in c.fetchall(): print('migration', r[0], r[1])
              c.execute('''SELECT table_name, column_name, data_type, is_nullable, column_default
                           FROM information_schema.columns WHERE table_schema=current_schema() AND (
                             (table_name='equipment_equipmentgroup' AND column_name IN ('alternative_booking_enabled','alternative_search_other_slots','auto_allocation_enabled','cross_rescheduling_enabled'))
                             OR (table_name='equipment_equipment' AND column_name='alternative_priority')) ORDER BY 1, 2''')
              cols = c.fetchall()
              for r in cols: print('column', ' | '.join(str(v) for v in r))
              assert len(cols) == 5, 'expected 5 new columns'
              for t, n, dt, nullable, dflt in cols:
                  assert nullable == 'NO', f'{n} nullable'
                  if n == 'alternative_priority':
                      assert dt == 'smallint' and str(dflt).startswith('100'), f'bad default {dflt}'
                  else:
                      assert dt == 'boolean' and str(dflt) == 'false', f'bad default {dflt}'
              c.execute('''SELECT COUNT(*) FILTER (WHERE alternative_booking_enabled), COUNT(*) FILTER (WHERE alternative_search_other_slots),
                                  COUNT(*) FILTER (WHERE cross_rescheduling_enabled), COUNT(*) FILTER (WHERE auto_allocation_enabled), COUNT(*)
                           FROM equipment_equipmentgroup''')
              ab, so, cr, aa, total = c.fetchone()
              print(f'groups_total={total} alternative_booking_on={ab} other_slots_on={so} cross_rescheduling_on={cr} auto_allocation_on={aa}')
              c.execute('SELECT alternative_priority, COUNT(*) FROM equipment_equipment GROUP BY 1 ORDER BY 1')
              print('alternative_priority_distribution', c.fetchall())
              assert ab == so == cr == aa == 0, 'a group switch is ON'
              transaction.set_rollback(True)
          print('POST-MIGRATION SCHEMA/SWITCH CHECK PASS')
          "
          docker exec -w /app "$CID" python manage.py shell -c "
          from django.db import connection
          c = connection.cursor()
          c.execute('''SELECT (SELECT COUNT(*) FROM equipment_equipmentgroup),
            (SELECT md5(string_agg(equipment_group_id::text||'|'||name||'|'||COALESCE(code,'')||'|'||COALESCE(description,''), ',' ORDER BY equipment_group_id)) FROM equipment_equipmentgroup),
            (SELECT COUNT(*) FROM equipment_equipment),
            (SELECT md5(string_agg(equipment_id::text||'|'||COALESCE(equipment_group_id::text,'-')||'|'||COALESCE(internal_department_id::text,'-')||'|'||code||'|'||COALESCE(status,''), ',' ORDER BY equipment_id)) FROM equipment_equipment),
            (SELECT COUNT(*) FROM equipment_equipmentgroupquota), (SELECT COUNT(*) FROM equipment_chargeprofile)''')
          print('|'.join(str(v) for v in c.fetchone()))
          " | tail -n 1 | tee "$RUNNER_TEMP/fp_after.txt"
          echo "fingerprint_before=$(cat "$RUNNER_TEMP/fp_before.txt")"
          echo "fingerprint_after=$(cat "$RUNNER_TEMP/fp_after.txt")"
          cmp -s "$RUNNER_TEMP/fp_before.txt" "$RUNNER_TEMP/fp_after.txt" || { echo "DATA FINGERPRINT CHANGED"; exit 1; }
          echo "DATA FINGERPRINT UNCHANGED"

      - name: Running application health after migration (old code, new columns)
        run: |
          set -euo pipefail
          for u in http://127.0.0.1:8080/api/v1/analysis/health/ready/ http://127.0.0.1:8080/api/version/; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$u" || true)"
            echo "$u -> $code"
            [ "$code" = "200" ] || { echo "HEALTH FAIL"; exit 1; }
          done
          docker compose -f "$DEPLOY_DIR/$COMPOSE_FILE" ps --format 'table {{.Name}}\t{{.Status}}'
          echo "PHASE3_DONE=YES"
