name: Show Production Migrations
on:
  workflow_dispatch:
jobs:
  closeout:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Phase 1 closeout baseline (RO, no migrate)
        run: |
          set -euo pipefail
          cd /home/ubuntu/iic-booking-backend
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          echo "expected_sha=7d1081da39e3b0c0d44e58ab0e4172ec217c46ea"
          echo "sha_ok=$([ "$(git rev-parse HEAD)" = "7d1081da39e3b0c0d44e58ab0e4172ec217c46ea" ] && echo YES || echo NO)"
          CID=$(docker compose -f docker-compose.production.yml ps --format '{{.Name}}' | grep django | head -n1)
          echo "django=$CID"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:8080/api/v1/analysis/health/ready/ || true)
          echo "readiness=$code"
          echo "=== migrations ==="
          docker exec -w /app "$CID" python manage.py showmigrations users 2>&1 | grep -E '0096|0097|0098|0099|0100' || true
          PENDING=$(docker exec -w /app "$CID" python manage.py showmigrations 2>&1 | grep '\[ \]' || true)
          if [ -z "$PENDING" ]; then echo "NONE_PENDING"; else echo "$PENDING"; fi
          docker exec -w /app "$CID" python manage.py showmigrations equipment 2>&1 | grep '0188' || echo "equipment_0188=NOT_APPLIED"
          echo "=== profile + claim ==="
          echo '' | base64 -d > /tmp/closeout_p1.py
          docker cp /tmp/closeout_p1.py "$CID":/tmp/closeout_p1.py
          docker exec -i -w /app "$CID" python manage.py shell < /tmp/closeout_p1.py
          echo "=== authorize (REAL) ==="
          curl -sS --max-time 15 'https://equip.iitr.ac.in/api/auth/omniport/authorize/' -o /tmp/auth.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/auth.json'))
          url=d.get('auth_url') or ''
          print('fixture_mode=', d.get('fixture_mode'))
          print('auth_url_present=', bool(url))
          print('auth_url_host=', url.split('/')[2] if '://' in url else None)
          print('authorize=', 'PASS' if url and d.get('fixture_mode') is False else 'FAIL')
          PY
          docker ps --format '{{.Names}} {{.Status}}' | grep -E 'frontend|django|celery|redis' || true
          echo "PHASE1_DONE=YES"
