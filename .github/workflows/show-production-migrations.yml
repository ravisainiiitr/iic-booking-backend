name: Show Production Migrations
on:
  workflow_dispatch:
jobs:
  status:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Post-apply safety status (RO)
        run: |
          set -euo pipefail
          DEPLOY=/home/ubuntu/iic-booking-backend
          cd "$DEPLOY"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "tag=$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          grep -n 'host.docker.internal' docker-compose.production.yml | head -n 5
          grep -E '^OLD_MYSQL_(HOST|PORT|DATABASE|USER)=' .envs/.production/.django | sed 's/\r$//'
          grep -E '^OLD_MYSQL_PASSWORD=' .envs/.production/.django >/dev/null && echo OLD_MYSQL_PASSWORD=PRESENT || echo OLD_MYSQL_PASSWORD=ABSENT
          CID=$(docker compose -f docker-compose.production.yml ps --format '{{.Name}}' | grep django | head -n1)
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8080/api/v1/analysis/health/ready/ || true)
          echo "health_http=$code"
          docker exec -w /app "$CID" python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","config.settings.production")
          import django; django.setup()
          from django.conf import settings
          for k in ("DEPLOYMENT_ENVIRONMENT","REAL_INTEGRATION_ENABLED","USE_LEGACY_FIXTURES","LOCAL_STAGING_ACCEPTED"):
              print(f"{k}={getattr(settings,k,None)!r}")
          print("OLD_MYSQL_HOST=", getattr(settings,"OLD_MYSQL_HOST",None))
          print("OLD_MYSQL_PORT=", getattr(settings,"OLD_MYSQL_PORT",None))
          PY
          docker exec -w /app "$CID" python manage.py showmigrations users 2>/dev/null | grep -E '0096|0097|0098|0099|0100' || true
