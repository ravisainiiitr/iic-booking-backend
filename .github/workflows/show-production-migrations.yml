# PROBE BRANCH ONLY (probe/egs-preflight-ro) — apply ONLY equipment.0198_booking_result_views_and_data_shares.
# Gated: backup fresh + complete, release tag/file identity, baseline state, plan == exactly 0198.
# Runs in a one-off container of the CURRENT production image with the tagged 0198 file mounted read-only;
# running services are not touched. 0198 only creates two new empty tables and one PeriodicTask row.
name: Show Production Migrations

on:
  workflow_dispatch:

env:
  RELEASE_TAG: v2.5.46.49-results-sharing-availability
  RELEASE_SHA: 8af98c8a8e89a4380f04eeb141b20abc77118694
  MIGRATION_BLOB: 4e716491fb59f9dad01f565055233b21ba6b9ca0
  MIGRATION_REL: iic_booking/equipment/migrations/0198_booking_result_views_and_data_shares.py
  MIGRATION_NAME: 0198_booking_result_views_and_data_shares
  BASELINE_TAG: v2.5.46.48-equipment-group-alternatives
  DEPLOY_DIR: /home/ubuntu/iic-booking-backend
  COMPOSE_FILE: docker-compose.production.yml

jobs:
  show:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Checkout release tag (read-only copy in runner workspace)
        uses: actions/checkout@v4
        with:
          ref: v2.5.46.49-results-sharing-availability
          path: release
          fetch-depth: 1

      - name: "Gate A: latest nightly backup fresh and complete"
        run: |
          set -euo pipefail
          DUMP="$(readlink -f /home/ubuntu/backups/nightly/latest)/db/portal.sql.gz"
          test -f "$DUMP" || { echo "GATE A FAIL: dump missing"; exit 1; }
          AGE_H=$(( ( $(date +%s) - $(stat -c %Y "$DUMP") ) / 3600 ))
          stat -c 'dump=%n size_bytes=%s mtime=%y' "$DUMP"
          echo "dump_age_hours=$AGE_H"
          [ "$AGE_H" -le 36 ] || { echo "GATE A FAIL: backup older than 36h"; exit 1; }
          gzip -t "$DUMP"
          COMPLETE=$( (set +e +o pipefail; zcat "$DUMP" | tail -n 20 | grep -c 'PostgreSQL database dump complete') )
          echo "dump_complete_marker=$COMPLETE"
          [ "$COMPLETE" -ge 1 ] || { echo "GATE A FAIL: dump-complete marker missing"; exit 1; }
          echo "GATE A PASS"

      - name: "Gate B: release identity and production baseline"
        id: base
        run: |
          set -euo pipefail
          HEAD_SHA="$(git -C release rev-parse HEAD)"
          BLOB="$(git -C release rev-parse "HEAD:$MIGRATION_REL")"
          echo "release_head=$HEAD_SHA migration_blob=$BLOB"
          [ "$HEAD_SHA" = "$RELEASE_SHA" ] || { echo "GATE B FAIL: release sha mismatch"; exit 1; }
          [ "$BLOB" = "$MIGRATION_BLOB" ] || { echo "GATE B FAIL: migration file mismatch"; exit 1; }
          CUR_TAG="$(cat "$DEPLOY_DIR/.deploy-state/current_release_tag")"
          echo "production_current_release_tag=$CUR_TAG"
          [ "$CUR_TAG" = "$BASELINE_TAG" ] || { echo "GATE B FAIL: production not on baseline tag"; exit 1; }
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          echo "container=$CID" >> "$GITHUB_OUTPUT"
          echo "running_container=$CID"
          echo "GATE B PASS"

      - name: "Gate C: pre-migration state + data fingerprint (read-only)"
        run: |
          set -euo pipefail
          CID="${{ steps.base.outputs.container }}"
          docker exec -w /app "$CID" python manage.py shell -c "
          from django.db import connection, transaction
          with transaction.atomic():
              c = connection.cursor()
              c.execute('SET TRANSACTION READ ONLY')
              c.execute(\"SELECT name FROM django_migrations WHERE app='equipment' ORDER BY name DESC LIMIT 1\")
              last = c.fetchone()[0]
              c.execute(\"SELECT COUNT(*) FROM django_migrations WHERE app='equipment' AND name='0198_booking_result_views_and_data_shares'\")
              has0198 = c.fetchone()[0]
              c.execute(\"SELECT to_regclass('equipment_bookingdatashare') IS NULL, to_regclass('equipment_bookingresultview') IS NULL\")
              share_absent, view_absent = c.fetchone()
              c.execute(\"SELECT COUNT(*) FROM django_migrations WHERE app='django_celery_beat'\")
              beat_migs = c.fetchone()[0]
              c.execute(\"SELECT COUNT(*) FROM django_celery_beat_periodictask WHERE name='Nightly upcoming slot generation 00:20' OR task='equipment.ensure_upcoming_slots'\")
              task_rows = c.fetchone()[0]
              print('pre_last_equipment_migration=', last)
              print('pre_0198_recorded=', has0198, 'share_table_absent=', share_absent, 'view_table_absent=', view_absent)
              print('django_celery_beat_migrations=', beat_migs, 'pre_upcoming_slot_task_rows=', task_rows)
              assert last == '0197_equipment_group_alternatives' and has0198 == 0, 'GATE C FAIL: unexpected migration pre-state'
              assert share_absent and view_absent, 'GATE C FAIL: new tables already exist'
              assert beat_migs > 0 and task_rows == 0, 'GATE C FAIL: unexpected celery beat pre-state'
              transaction.set_rollback(True)
          print('GATE C PASS')
          "
          docker exec -w /app "$CID" python manage.py shell -c "
          from django.db import connection, transaction
          with transaction.atomic():
              c = connection.cursor()
              c.execute('SET TRANSACTION READ ONLY')
              c.execute('''SELECT (SELECT COUNT(*) FROM equipment_equipment),
                (SELECT md5(string_agg(equipment_id::text||'|'||COALESCE(equipment_group_id::text,'-')||'|'||COALESCE(internal_department_id::text,'-')||'|'||code||'|'||COALESCE(status,''), ',' ORDER BY equipment_id)) FROM equipment_equipment),
                (SELECT COUNT(*) FROM django_celery_beat_periodictask),
                (SELECT md5(string_agg(id::text||'|'||name||'|'||task||'|'||enabled::text||'|'||COALESCE(crontab_id::text,'-')||'|'||COALESCE(interval_id::text,'-'), ',' ORDER BY id)) FROM django_celery_beat_periodictask),
                (SELECT COUNT(*) FROM django_celery_beat_crontabschedule)''')
              print('|'.join(str(v) for v in c.fetchone()))
              transaction.set_rollback(True)
          " | tail -n 1 | tee "$RUNNER_TEMP/fp_before.txt"

      - name: "Gate D: migrate --plan must be exactly equipment.0198"
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          MIG_SRC="$GITHUB_WORKSPACE/release/$MIGRATION_REL"
          docker compose -f "$COMPOSE_FILE" run --rm --no-deps --entrypoint "" --user django \
            -v "$MIG_SRC:/app/$MIGRATION_REL:ro" \
            django python manage.py migrate equipment "$MIGRATION_NAME" --plan 2>&1 | tee "$RUNNER_TEMP/plan.txt"
          PLANNED="$(grep -E '^[a-z_]+\.[0-9]{4}_' "$RUNNER_TEMP/plan.txt" || true)"
          echo "planned_migrations=[$PLANNED]"
          [ "$PLANNED" = "equipment.$MIGRATION_NAME" ] || { echo "GATE D FAIL: plan is not exactly 0198"; exit 1; }
          echo "--- SQL (sqlmigrate) ---"
          docker compose -f "$COMPOSE_FILE" run --rm --no-deps --entrypoint "" --user django \
            -v "$MIG_SRC:/app/$MIGRATION_REL:ro" \
            django python manage.py sqlmigrate equipment "$MIGRATION_NAME" 2>&1
          echo "GATE D PASS"

      - name: Apply ONLY equipment.0198_booking_result_views_and_data_shares
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          MIG_SRC="$GITHUB_WORKSPACE/release/$MIGRATION_REL"
          docker compose -f "$COMPOSE_FILE" run --rm --no-deps --entrypoint "" --user django \
            -v "$MIG_SRC:/app/$MIGRATION_REL:ro" \
            django python manage.py migrate equipment "$MIGRATION_NAME" --noinput 2>&1 | tee "$RUNNER_TEMP/migrate.txt"
          grep -q "Applying equipment.$MIGRATION_NAME... OK" "$RUNNER_TEMP/migrate.txt" \
            || { echo "MIGRATION FAIL: 0198 not reported OK"; exit 1; }
          APPLIED="$(grep -c '^  Applying ' "$RUNNER_TEMP/migrate.txt" || true)"
          echo "applied_count=$APPLIED"
          [ "$APPLIED" = "1" ] || { echo "MIGRATION FAIL: unexpected number of migrations applied"; exit 1; }
          echo "MIGRATION 0198 APPLIED"

      - name: Post-migration verification (read-only)
        run: |
          set -euo pipefail
          CID="${{ steps.base.outputs.container }}"
          docker exec -w /app "$CID" python manage.py shell -c "
          from django.db import connection, transaction
          with transaction.atomic():
              c = connection.cursor()
              c.execute('SET TRANSACTION READ ONLY')
              c.execute(\"SELECT name, applied FROM django_migrations WHERE app='equipment' AND name >= '0197' ORDER BY name\")
              rows = c.fetchall()
              for r in rows: print('migration', r[0], r[1])
              assert [r[0] for r in rows] == ['0197_equipment_group_alternatives', '0198_booking_result_views_and_data_shares'], 'unexpected migration rows'
              for t in ('equipment_bookingdatashare', 'equipment_bookingresultview'):
                  c.execute(f'SELECT COUNT(*) FROM {t}')
                  n = c.fetchone()[0]
                  print(f'table {t} rows={n}')
                  assert n == 0, f'{t} not empty'
              c.execute(\"SELECT indexname FROM pg_indexes WHERE schemaname=current_schema() AND tablename IN ('equipment_bookingdatashare','equipment_bookingresultview') ORDER BY 1\")
              idx = [r[0] for r in c.fetchall()]
              print('indexes', idx)
              assert 'uniq_active_booking_data_share' in idx and 'uniq_booking_result_view_per_user' in idx, 'unique indexes missing'
              c.execute('''SELECT t.name, t.task, t.enabled, s.minute, s.hour, s.day_of_week, s.day_of_month, s.month_of_year, s.timezone
                           FROM django_celery_beat_periodictask t JOIN django_celery_beat_crontabschedule s ON s.id = t.crontab_id
                           WHERE t.task IN ('equipment.ensure_upcoming_slots', 'equipment.archive_expired_samples') ORDER BY t.name''')
              for r in c.fetchall(): print('periodic_task', ' | '.join(str(v) for v in r))
              c.execute(\"SELECT COUNT(*) FROM django_celery_beat_periodictask WHERE name='Nightly upcoming slot generation 00:20' AND task='equipment.ensure_upcoming_slots' AND enabled\")
              assert c.fetchone()[0] == 1, 'upcoming slot periodic task missing or disabled'
              transaction.set_rollback(True)
          print('POST-MIGRATION SCHEMA/TASK CHECK PASS')
          "
          docker exec -w /app "$CID" python manage.py shell -c "
          from django.db import connection, transaction
          with transaction.atomic():
              c = connection.cursor()
              c.execute('SET TRANSACTION READ ONLY')
              c.execute('''SELECT (SELECT COUNT(*) FROM equipment_equipment),
                (SELECT md5(string_agg(equipment_id::text||'|'||COALESCE(equipment_group_id::text,'-')||'|'||COALESCE(internal_department_id::text,'-')||'|'||code||'|'||COALESCE(status,''), ',' ORDER BY equipment_id)) FROM equipment_equipment),
                (SELECT COUNT(*) FROM django_celery_beat_periodictask WHERE name <> 'Nightly upcoming slot generation 00:20'),
                (SELECT md5(string_agg(id::text||'|'||name||'|'||task||'|'||enabled::text||'|'||COALESCE(crontab_id::text,'-')||'|'||COALESCE(interval_id::text,'-'), ',' ORDER BY id)) FROM django_celery_beat_periodictask WHERE name <> 'Nightly upcoming slot generation 00:20'),
                (SELECT COUNT(*) FROM django_celery_beat_crontabschedule)''')
              print('|'.join(str(v) for v in c.fetchone()))
              transaction.set_rollback(True)
          " | tail -n 1 | tee "$RUNNER_TEMP/fp_after.txt"
          echo "fingerprint_before=$(cat "$RUNNER_TEMP/fp_before.txt")"
          echo "fingerprint_after=$(cat "$RUNNER_TEMP/fp_after.txt")"
          B="$(cut -d'|' -f1-4 "$RUNNER_TEMP/fp_before.txt")"; A="$(cut -d'|' -f1-4 "$RUNNER_TEMP/fp_after.txt")"
          [ "$B" = "$A" ] || { echo "DATA FINGERPRINT CHANGED"; exit 1; }
          CB="$(cut -d'|' -f5 "$RUNNER_TEMP/fp_before.txt")"; CA="$(cut -d'|' -f5 "$RUNNER_TEMP/fp_after.txt")"
          echo "crontab_schedules_before=$CB after=$CA"
          [ "$CA" -ge "$CB" ] && [ "$CA" -le $((CB + 1)) ] || { echo "UNEXPECTED CRONTAB CHANGE"; exit 1; }
          echo "DATA FINGERPRINT UNCHANGED (existing equipment + existing periodic tasks)"

      - name: Running application health after migration (old code, new tables)
        run: |
          set -euo pipefail
          for u in http://127.0.0.1:8080/api/v1/analysis/health/ready/ http://127.0.0.1:8080/api/version/; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$u" || true)"
            echo "$u -> $code"
            [ "$code" = "200" ] || { echo "HEALTH FAIL"; exit 1; }
          done
          docker compose -f "$DEPLOY_DIR/$COMPOSE_FILE" ps --format 'table {{.Name}}\t{{.Status}}'
          echo "MIGRATION_0198_PHASE_DONE=YES"
