name: Show Production Migrations
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Identity match aggregate RO
        run: |
          set -euo pipefail
          CID=$(docker compose -f /home/ubuntu/iic-booking-backend/docker-compose.production.yml ps --format '{{.Name}}' | grep django | head -n1)
          echo '' | base64 -d > /tmp/id_ro.py
          docker cp /tmp/id_ro.py "$CID":/tmp/id_ro.py
          docker exec -i -w /app "$CID" python manage.py shell < /tmp/id_ro.py
          echo "DONE"
