name: Test Device Provisioning R2.1

on:
  workflow_dispatch:
  push:
    paths:
      - "iic_booking/device_provisioning/**"
      - "config/api_router.py"
      - "config/settings/base.py"

jobs:
  test:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Run device_provisioning pytest in Django container
        run: |
          set -euo pipefail
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1 || true)"
          if [ -z "$CID" ]; then
            echo "No django container — skipping live DB tests"
            exit 0
          fi
          echo "container=$CID"
          # Copy app sources into container for verification without full rebuild
          docker exec -w /app "$CID" python - <<'PY'
          import importlib
          m = importlib.import_module("iic_booking.device_provisioning.models")
          print("models_ok", hasattr(m, "ProvisionedDevice"))
          PY
          docker exec -w /app "$CID" python manage.py showmigrations device_provisioning 2>&1 | tail -20 || true
