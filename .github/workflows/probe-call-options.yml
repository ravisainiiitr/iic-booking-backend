# READ-ONLY: why a booking does or does not offer the Call buttons. Prints ids, roles and flags only (no names, emails or
# phone numbers). Writes nothing.
name: Probe call options (read-only)

on:
  workflow_dispatch:
    inputs:
      booking_ref:
        description: "Booking reference (virtual_booking_id)"
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Call options for the booking
        env:
          BOOKING_REF: ${{ github.event.inputs.booking_ref }}
        run: |
          set -euo pipefail
          case "$BOOKING_REF" in (*[!A-Za-z0-9_-]*|'') echo "Bad reference"; exit 1 ;; esac
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          docker exec -i -w /app -e BOOKING_REF="$BOOKING_REF" -e DJANGO_SETTINGS_MODULE=config.settings.production "$CID" python - <<'PY'
          import os

          import django

          django.setup()
          from iic_booking.calls import conf
          from iic_booking.calls.models import CallDevice, CallSession
          from iic_booking.calls.recipients import CallNotAllowed, calls_open_to, is_online, options
          from iic_booking.equipment.models import Booking, EquipmentManager, EquipmentOperator
          from django.utils import timezone

          from iic_booking.users.models.mobile_device_session import MobileDeviceSession

          print("calls enabled=", conf.enabled(), " test_accounts_only=", conf.test_accounts_only())
          b = Booking.objects.select_related("equipment", "user").filter(virtual_booking_id=os.environ["BOOKING_REF"]).first()
          if b is None:
              raise SystemExit("booking not found")
          e, u = b.equipment, b.user
          print(f"booking pk={b.pk} status={b.status} equipment={e.pk} parent={e.parent_equipment_id} dept={e.internal_department_id}")
          print(f"booking user id={u.pk} type={u.user_type} is_test={getattr(u, 'is_test_account', None)} active={u.is_active} calls_open={calls_open_to(u)}")

          def show(label, user):
              print(f"  {label}: user id={user.pk} type={user.user_type} is_test={getattr(user, 'is_test_account', None)} "
                    f"active={user.is_active} calls_open={calls_open_to(user)} online_now={is_online(user.pk)} "
                    f"push_devices={CallDevice.objects.filter(user=user, revoked_at__isnull=True).count()}")
              for m in MobileDeviceSession.objects.filter(user=user).order_by("-created_at")[:3]:
                  ago = round((timezone.now() - m.last_used_at).total_seconds() / 60, 1) if m.last_used_at else None
                  print(f"      app session platform={m.platform} version={m.app_version} last_used_min_ago={ago} "
                        f"access_valid={m.access_expires_at > timezone.now()} revoked={bool(m.revoked_at)}")

          print("booking user:")
          show("laptop account", u)
          ids = [e.pk] + ([e.parent_equipment_id] if e.parent_equipment_id else [])
          print("operator links:")
          for r in EquipmentOperator.objects.filter(equipment_id__in=ids).select_related("operator"):
              show(f"equipment {r.equipment_id} role={r.role}", r.operator)
          print("manager (OIC) links:")
          for r in EquipmentManager.objects.filter(equipment_id__in=ids).select_related("manager"):
              show(f"equipment {r.equipment_id}", r.manager)
          for ctx in ("booking", "invoice"):
              try:
                  o = options(u, ctx, b.pk)
                  print(f"options as the booking user ({ctx}):")
                  for role in o["roles"]:
                      print(f"  {role['role']}: fallback={role['fallback']!r} people=" + str([(p["id"], p["available"]) for p in role["people"]]))
              except CallNotAllowed as exc:
                  print(f"options as the booking user ({ctx}): REFUSED {exc}")
              except Exception as exc:
                  print(f"options as the booking user ({ctx}): ERROR {type(exc).__name__}")
          print("calls recorded for this booking:", CallSession.objects.filter(context_id=b.pk, context_type__in=["booking", "invoice"]).count())
          PY

      - name: Calling connections seen by the web server (tokens removed)
        run: |
          set -euo pipefail
          cat > /tmp/ws_calls.py <<'PY'
          import re
          import sys
          from collections import Counter

          LINE = re.compile(r'\[(?P<t>[^\]]+)\] "GET (?P<p>/ws/calls/)\S* [^"]*" (?P<s>\d{3}) \S+(?: "[^"]*" "(?P<ua>[^"]*)")?')
          rows, last = Counter(), {}
          for raw in sys.stdin:
              m = LINE.search(raw)
              if not m:
                  continue
              ua = m["ua"] or ""
              kind = "app" if "IICBookingApp/" in ua else "browser"
              rows[(kind, m["s"])] += 1
              last[kind] = (m["t"], m["s"])
          print("WS_CALLS by client and status:", sorted((k[0], k[1], n) for k, n in rows.items()))
          print("WS_CALLS latest:", last)
          PY
          date -u
          sudo -n sh -c 'tail -n 400000 /var/log/apache2/equip_access.log /var/log/apache2/equip_access.log.1 2>/dev/null' | python3 /tmp/ws_calls.py
          rm -f /tmp/ws_calls.py
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          echo "Socket lines in the django log (last 30 minutes, tokens removed):"
          docker logs --since 30m "$CID" 2>&1 | grep -E 'ws/calls' | sed -E 's/token=[^ &"]*/token=REMOVED/g' | tail -n 15 || true
