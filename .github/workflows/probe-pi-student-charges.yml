# Read-only (IDs, booleans and counts only; no names or emails): is the faculty whose wallet paid for the
# MALDI student booking the same person as the MALDI Equipment PI (duplicate account), and how the PI
# account and its linked students compare.
name: Probe PI Student Charges

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Probe
        run: |
          set -euo pipefail
          for d in \
            /home/ubuntu/iic-booking-backend \
            /home/ubuntu/iic_booking_backend \
            /home/ubuntu/iic-booking-backend-rt-port
          do
            if [[ -f "$d/docker-compose.production.yml" ]]; then
              cd "$d"
              echo "DESCRIBE=$(git describe --tags --always 2>/dev/null || true)"
              CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1 || true)"
              test -n "$CID"
              docker exec -i -w /app "$CID" python - <<'PY'
          import os, re, django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings.production")
          django.setup()
          from iic_booking.equipment.models import Booking, Equipment, EquipmentPI
          from iic_booking.equipment import pi_pricing as pp
          from iic_booking.users.models import User
          from iic_booking.users.models.wallet import WalletJoinRequest

          def norm(s):
              s = (s or "").lower()
              s = re.sub(r"\b(prof|dr|mr|ms|mrs)\b\.?", " ", s)
              return " ".join(re.sub(r"[^a-z ]", " ", s).split())

          def local(e):
              return (e or "").split("@")[0].lower()

          def flags(u):
              return (f"id={u.pk} ut={u.user_type} approved={u.admin_approved} force_inactive={u.force_inactive} "
                      f"is_active={u.is_active} logged_in={u.last_login is not None} dept={u.department_id} "
                      f"linked_students={WalletJoinRequest.objects.filter(faculty=u, status='APPROVED').count()} "
                      f"pi_rows={EquipmentPI.objects.filter(faculty=u).count()}")

          eq = Equipment.objects.get(code="MALDI")
          pis = [ep.faculty for ep in EquipmentPI.objects.filter(equipment=eq).select_related("faculty")]
          for pi in pis:
              print("PI", flags(pi))
              same = User.objects.filter(user_type="faculty").exclude(pk=pi.pk)
              dups = [u for u in same if norm(u.name) and norm(u.name) == norm(pi.name)]
              print(f"  other_faculty_accounts_with_same_name={len(dups)}")
              for u in dups:
                  print("   DUP", flags(u), f"same_email_local={local(u.email) == local(pi.email)} same_emp_id={bool(u.emp_id) and u.emp_id == pi.emp_id}")
          for b in Booking.objects.filter(equipment=eq).select_related("user"):
              s = b.user
              o = pp.wallet_owner_user(s)
              print(f"BOOKING {b.virtual_booking_id} student_dept={s.department_id}")
              if o is not None:
                  print("  WALLET_OWNER", flags(o))
                  for pi in pis:
                      print(f"  vs PI {pi.pk}: same_name={norm(o.name) == norm(pi.name)} same_email_local={local(o.email) == local(pi.email)} "
                            f"same_emp_id={bool(o.emp_id) and o.emp_id == pi.emp_id} same_dept={o.department_id == pi.department_id}")
          PY
              exit 0
            fi
          done
          echo "No production compose path found"
          exit 1
