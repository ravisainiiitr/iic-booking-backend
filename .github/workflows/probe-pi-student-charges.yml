# Read-only (IDs and amounts only; no names or emails): for students on the MALDI Equipment PI's wallet,
# the live Calculate Charges estimate for their own category versus the booking-flow estimate
# (GET /calculate/, no writes), plus the same for the PI and for a student not on a PI wallet.
name: Probe PI Student Charges

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Probe
        run: |
          set -euo pipefail
          for d in \
            /home/ubuntu/iic-booking-backend \
            /home/ubuntu/iic_booking_backend \
            /home/ubuntu/iic-booking-backend-rt-port
          do
            if [[ -f "$d/docker-compose.production.yml" ]]; then
              cd "$d"
              echo "DESCRIBE=$(git describe --tags --always 2>/dev/null || true)"
              CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1 || true)"
              test -n "$CID"
              docker exec -i -w /app "$CID" python - <<'PY'
          import os, django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings.production")
          django.setup()
          from rest_framework.test import APIRequestFactory, force_authenticate
          from iic_booking.equipment.models import Booking, Equipment, EquipmentPI
          from iic_booking.equipment import pi_pricing as pp
          from iic_booking.equipment.api_views import equipment_calculate
          from iic_booking.users.models import User
          from iic_booking.users.models.wallet import WalletJoinRequest

          print("fix_deployed=", hasattr(pp, "category_estimate_pricing_profile"))
          eq = Equipment.objects.get(code="MALDI")
          rf = APIRequestFactory()

          def calc(user, extra):
              req = rf.get(f"/api/equipments/{eq.pk}/calculate/", {"A": "1", **extra}, HTTP_HOST="equip.iitr.ac.in")
              force_authenticate(req, user=user)
              r = equipment_calculate(req, pk=eq.pk)
              d = getattr(r, "data", {}) or {}
              return r.status_code, d.get("applied_profile"), d.get("total_charge")

          pis = list(EquipmentPI.objects.filter(equipment=eq, is_active=True).values_list("faculty_id", flat=True))
          ok = total = 0
          for jr in WalletJoinRequest.objects.filter(faculty_id__in=pis, status="APPROVED").select_related("student"):
              s = jr.student
              booking_flow = calc(s, {})
              estimate = calc(s, {"user_type": s.user_type})
              total += 1
              ok += int(booking_flow == estimate and booking_flow[1] == "PI")
              print(f"  student uid={s.pk} booking_flow={booking_flow} estimate_own_category={estimate}")
          print(f"  linked_students_matching_pi={ok}/{total}")
          for fid in pis:
              f = User.objects.get(pk=fid)
              print(f"  PI uid={fid} booking_flow={calc(f, {})} estimate_own_category={calc(f, {'user_type': f.user_type})}")
          b = Booking.objects.filter(equipment=eq).select_related("user").first()
          if b is not None:
              u = b.user
              print(f"  unlinked booker uid={u.pk} booking_flow={calc(u, {})} estimate_own_category={calc(u, {'user_type': u.user_type})} "
                    f"booking={b.virtual_booking_id} charged={b.total_charge} status={b.status}")
          PY
              exit 0
            fi
          done
          echo "No production compose path found"
          exit 1
