# Read-only (IDs, codes, counts and amounts only; no names or emails): PI charge profiles on MALDI
# equipment, the Equipment PIs assigned to it, the students linked to those PIs (approved wallet join,
# supervisor link, registration approval) and how recent MALDI bookings were charged versus the PI rate.
name: Probe PI Student Charges

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Probe
        run: |
          set -euo pipefail
          for d in \
            /home/ubuntu/iic-booking-backend \
            /home/ubuntu/iic_booking_backend \
            /home/ubuntu/iic-booking-backend-rt-port
          do
            if [[ -f "$d/docker-compose.production.yml" ]]; then
              cd "$d"
              echo "DESCRIBE=$(git describe --tags --always 2>/dev/null || true)"
              CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1 || true)"
              test -n "$CID"
              docker exec -i -w /app "$CID" python - <<'PY'
          import os, django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings.production")
          django.setup()
          from collections import Counter
          from decimal import Decimal
          from django.db.models import Q
          from iic_booking.equipment.models import Booking, ChargeProfile, Equipment, EquipmentPI
          from iic_booking.equipment.calculators import ChargeCalculationEngine
          from iic_booking.equipment import pi_pricing as pp
          from iic_booking.users.models import User
          from iic_booking.users.models.wallet import Wallet, WalletJoinRequest

          try:
              from iic_booking.users.models.registration_approval import RegistrationApproval
          except Exception:
              RegistrationApproval = None

          print("has_get_active_charge_profile_pi_fallback=", "pi_rate_user_type" in dir(pp))
          base = list(Equipment.objects.filter(name__icontains="MALDI").order_by("pk"))
          ids = {e.pk for e in base}
          for e in base:
              if e.parent_equipment_id:
                  ids.add(e.parent_equipment_id)
          ids |= set(Equipment.objects.filter(parent_equipment_id__in=ids).values_list("pk", flat=True))
          eqs = list(Equipment.objects.filter(pk__in=ids).order_by("pk"))
          pi_ids = set()
          for e in eqs:
              print(f"== EQ id={e.pk} code={e.code} status={e.status} parent={e.parent_equipment_id} "
                    f"multi_mode={e.enable_multi_mode} group={e.equipment_group_id} profile_type={e.profile_type} "
                    f"name_has_maldi={'maldi' in (e.name or '').lower()}")
              for cp in ChargeProfile.objects.filter(equipment=e).order_by("pricing_profile", "user_type", "pk"):
                  print(f"   CP id={cp.pk} ut={cp.user_type} pp={cp.pricing_profile} active={cp.is_active} "
                        f"ptype={cp.profile_type} p1={cp.primary_unit_charge} p2={cp.secondary_unit_charge} "
                        f"formula={'y' if (cp.charge_formula or '').strip() else 'n'}")
              for ep in EquipmentPI.objects.filter(equipment=e).select_related("faculty").order_by("pk"):
                  pi_ids.add(ep.faculty_id)
                  print(f"   PI row={ep.pk} faculty_id={ep.faculty_id} active={ep.is_active} "
                        f"ut={ep.faculty.user_type} has_wallet={Wallet.objects.filter(user_id=ep.faculty_id).exists()} "
                        f"created={ep.created_at.date()}")

          print("== Students linked to MALDI PIs ==")
          linked = {}
          for fid in sorted(pi_ids):
              jr = WalletJoinRequest.objects.filter(faculty_id=fid)
              st = Counter(jr.values_list("status", flat=True))
              appr = list(jr.filter(status="APPROVED").select_related("student", "wallet"))
              wrong_wallet = sum(1 for r in appr if r.wallet_id and r.wallet.user_id != fid)
              no_wallet = sum(1 for r in appr if not r.wallet_id)
              uts = Counter(r.student.user_type for r in appr)
              owner_ok = 0
              multi = 0
              for r in appr:
                  s = r.student
                  linked.setdefault(s.pk, set()).add(("wallet", fid))
                  if WalletJoinRequest.objects.filter(student=s, status="APPROVED").count() > 1:
                      multi += 1
                  o = pp.wallet_owner_user(s)
                  if o is not None and o.pk == fid:
                      owner_ok += 1
              sup = list(User.objects.filter(supervisor_id=fid).values_list("pk", "user_type"))
              for uid, _ut in sup:
                  linked.setdefault(uid, set()).add(("supervisor", fid))
              reg = []
              if RegistrationApproval is not None:
                  reg = list(RegistrationApproval.objects.filter(faculty_id=fid).values_list("user_id", "status"))
                  for uid, _s in reg:
                      linked.setdefault(uid, set()).add(("registration", fid))
              print(f"  PI faculty_id={fid} join_requests={dict(st)} approved_student_types={dict(uts)} "
                    f"approved_wallet_owner_resolves_to_pi={owner_ok}/{len(appr)} multi_approved={multi} "
                    f"wallet_not_pi={wrong_wallet} no_wallet={no_wallet} supervised={dict(Counter(u for _, u in sup))} "
                    f"registration_approvals={dict(Counter(s for _, s in reg))}")
          print(f"  distinct_linked_users={len(linked)}")

          print("== MALDI bookings by linked users / students ==")
          qs = (Booking.objects.filter(equipment_id__in=ids)
                .select_related("charge_profile", "user").order_by("booking_id"))
          print(f"  total_bookings_on_maldi={qs.count()} by_status={dict(Counter(qs.values_list('status', flat=True)))}")
          print(f"  by_user_type_snapshot={dict(Counter(qs.values_list('user_type_snapshot', flat=True)))}")
          print(f"  by_applied_pricing={dict(Counter(qs.values_list('charge_profile__pricing_profile', flat=True)))}")
          tot_diff = Decimal("0")
          n_diff = 0
          unlinked = Counter()
          for b in qs:
              u = b.user
              links = linked.get(u.pk, set())
              is_student_like = (b.user_type_snapshot or u.user_type) in ("student", "other", "individual_student")
              if not links:
                  if is_student_like:
                      unlinked[(b.user_type_snapshot, b.charge_profile.pricing_profile)] += 1
                  continue
              owner = pp.wallet_owner_user(u)
              owner_pi = bool(owner and owner.pk in pi_ids)
              resolved_now = pp.resolve_pricing_profile_for_user(u, b.equipment)
              try:
                  pi_cp = pp.get_active_charge_profile(b.equipment, b.user_type_snapshot or u.user_type, "pi", u)
              except ChargeProfile.DoesNotExist:
                  pi_cp = None
              cp = b.charge_profile
              iv = dict(b.input_values or {})
              mins = int(b.total_time_minutes or 0)
              try:
                  booked_calc, _ = ChargeCalculationEngine.calculate_charge(cp, iv, mins, b.selected_parameters or None)
              except Exception as ex:
                  booked_calc = f"err:{type(ex).__name__}"
              pi_calc = None
              if pi_cp is not None:
                  try:
                      pi_calc, _ = ChargeCalculationEngine.calculate_charge(pi_cp, iv, mins, b.selected_parameters or None)
                  except Exception as ex:
                      pi_calc = f"err:{type(ex).__name__}"
              link_s = ",".join(sorted(f"{k}:{f}" for k, f in links)) or "-"
              print(f"  {b.virtual_booking_id or b.booking_id} eq={b.equipment_id} st={b.status} "
                    f"created={b.created_at.date() if getattr(b, 'created_at', None) else '?'} ut={b.user_type_snapshot} "
                    f"uid={u.pk} links={link_s} wallet_owner={getattr(owner, 'pk', None)} owner_is_pi={owner_pi} "
                    f"applied_cp={cp.pk}/{cp.user_type}/{cp.pricing_profile} charged={b.total_charge} "
                    f"recalc_booked={booked_calc} pi_cp={getattr(pi_cp, 'pk', None)} pi_calc={pi_calc} resolved_now={resolved_now}")
              if links and cp.pricing_profile != "pi" and isinstance(pi_calc, Decimal):
                  n_diff += 1
                  tot_diff += Decimal(b.total_charge) - pi_calc
          print(f"  linked_bookings_not_on_pi={n_diff} total_charged_minus_pi_calc={tot_diff}")
          print(f"  unlinked_student_like_bookings={dict(unlinked)}")
          PY
              exit 0
            fi
          done
          echo "No production compose path found"
          exit 1
