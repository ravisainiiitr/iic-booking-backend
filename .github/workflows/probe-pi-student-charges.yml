# Read-only (IDs, codes and amounts only; no names or emails): how each MALDI booking was priced
# (charge profile, inputs, minutes, path markers) and what the PI / standard profiles give for it.
name: Probe PI Student Charges

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Probe
        run: |
          set -euo pipefail
          for d in \
            /home/ubuntu/iic-booking-backend \
            /home/ubuntu/iic_booking_backend \
            /home/ubuntu/iic-booking-backend-rt-port
          do
            if [[ -f "$d/docker-compose.production.yml" ]]; then
              cd "$d"
              echo "DESCRIBE=$(git describe --tags --always 2>/dev/null || true)"
              CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1 || true)"
              test -n "$CID"
              docker exec -i -w /app "$CID" python - <<'PY'
          import os, django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings.production")
          django.setup()
          from iic_booking.equipment.models import Booking, ChargeProfile, Equipment, EquipmentPI
          from iic_booking.equipment.calculators import ChargeCalculationEngine
          from iic_booking.equipment import pi_pricing as pp

          eq = Equipment.objects.get(code="MALDI")
          pis = set(EquipmentPI.objects.filter(equipment=eq, is_active=True).values_list("faculty_id", flat=True))
          markers = [f.name for f in Booking._meta.get_fields() if any(k in f.name for k in ("urgent", "waitlist", "repeat", "rush"))
                     and getattr(f, "concrete", False) and not f.is_relation]
          for b in Booking.objects.filter(equipment=eq).select_related("charge_profile", "user", "created_by").order_by("booking_id"):
              u = b.user
              o = pp.wallet_owner_user(u)
              cp = b.charge_profile
              iv = {k: v for k, v in (b.input_values or {}).items() if k in ("A",)}
              mins = int(b.total_time_minutes or 0)
              def calc(p):
                  try:
                      return ChargeCalculationEngine.calculate_charge(p, dict(b.input_values or {}), mins, b.selected_parameters or None)[0]
                  except Exception as ex:
                      return f"err:{type(ex).__name__}"
              pi_cp = ChargeProfile.objects.filter(equipment=eq, pricing_profile="pi", is_active=True).first()
              mk = {m: getattr(b, m) for m in markers if getattr(b, m) not in (None, False, "", 0)}
              print(f"{b.virtual_booking_id} st={b.status} created={b.created_at.isoformat(timespec='minutes')} "
                    f"uid={u.pk} ut={b.user_type_snapshot} owner_is_pi={bool(o and o.pk in pis)} "
                    f"on_behalf={bool(b.created_by_id and b.created_by_id != u.pk)} creator_ut={getattr(b.created_by, 'user_type', None)} "
                    f"cp={cp.pk}/{cp.user_type}/{cp.pricing_profile} A={iv.get('A')} mins={mins} charged={b.total_charge} "
                    f"wallet_applied={b.wallet_amount_applied} recalc_booked_cp={calc(cp)} pi_calc={calc(pi_cp) if pi_cp else None} "
                    f"breakdown_lines={len(b.charge_breakdown or [])} markers={mk}")
              for line in (b.charge_breakdown or [])[:4]:
                  if isinstance(line, dict):
                      print(f"    line amount={line.get('amount')} desc_has_pi={'pi' in str(line.get('description','')).lower()}")
          PY
              exit 0
            fi
          done
          echo "No production compose path found"
          exit 1
