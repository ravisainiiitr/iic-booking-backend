# Probe: recent access/app log lines for one equipment's API calls (read-only, tokens masked)
name: Probe Equipment Request Log

on:
  workflow_dispatch:
    inputs:
      equipment_id:
        description: Equipment id
        required: true
        default: "7"
      since_minutes:
        description: Look back this many minutes
        required: true
        default: "60"
      client_ip:
        description: Optional client IP; when set, prints every access-log request from it
        required: false
        default: ""
      time_match:
        description: Optional access-log time substring for client_ip lines (e.g. 29/Sep/2026:11:0)
        required: false
        default: ""

jobs:
  probe:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Grep Apache and django logs
        shell: bash
        env:
          PROBE_EQ: ${{ github.event.inputs.equipment_id }}
          SINCE: ${{ github.event.inputs.since_minutes }}
          CLIENT_IP: ${{ github.event.inputs.client_ip }}
          TIME_MATCH: ${{ github.event.inputs.time_match }}
        run: |
          set +e
          mask() { sed -E 's/(token|access|key|signature|Signature|X-Amz-[A-Za-z]+)=[^&" ]*/\1=***/g'; }
          PAT="/api/equipments/${PROBE_EQ}(/|\?| )"
          readf() { cat "$1" 2>/dev/null || sudo -n cat "$1" 2>/dev/null; }
          echo "=== apache log files ==="
          ls -la /var/log/apache2/ 2>&1 | head -n 40
          for f in /var/log/apache2/*.log; do
            case "$f" in *error*) continue;; esac
            n=$(readf "$f" | grep -cE "$PAT")
            echo "--- $f matches=$n"
            [ "${n:-0}" -gt 0 ] && readf "$f" | grep -E "$PAT" | tail -n 60 | mask
          done
          if [ -n "$CLIENT_IP" ]; then
            echo "=== all requests from client ip (time filter: '${TIME_MATCH}') ==="
            for f in /var/log/apache2/*.log; do
              case "$f" in *error*) continue;; esac
              readf "$f" | grep -F "$CLIENT_IP " | grep -F -- "$TIME_MATCH" | tail -n 300 | mask | sed "s|^|$(basename "$f"): |"
            done
          fi
          echo "=== django container log ==="
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          if [ -n "$CID" ]; then
            docker logs --since "${SINCE}m" "$CID" 2>&1 | grep -E "equipments/${PROBE_EQ}([/? ]|$)" | tail -n 80 | mask
            echo "=== django errors (last ${SINCE}m) ==="
            docker logs --since "${SINCE}m" "$CID" 2>&1 | grep -E -A 25 'Traceback|Internal Server Error' | tail -n 150 | mask
          fi
          exit 0
