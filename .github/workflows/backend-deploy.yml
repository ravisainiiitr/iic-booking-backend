# Deploy Backend — execute on the Linux self-hosted runner (EC2).
# No SSH hop. Prerequisite: qualify the tag with Backend Release.
name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag to deploy (e.g. v2.5.0-rc19-release)
        required: true
        type: string
        default: v2.5.0-rc19-release
      deploy_path:
        description: Absolute path to the backend git checkout on EC2 (empty = auto-detect)
        required: false
        type: string
        default: ''
      health_url:
        description: Health URL checked on the EC2 host (loopback)
        required: false
        type: string
        default: http://127.0.0.1:8080/api/v1/analysis/health/ready/
      compose_file:
        description: Compose file relative to deploy_path
        required: false
        type: string
        default: docker-compose.production.yml
      enable_flower:
        description: Start Flower (--profile flower)
        required: false
        type: boolean
        default: true

concurrency:
  group: backend-deploy-ec2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy on EC2 runner
    # Linux EC2 runner ip-10-0-1-153 (same host as production compose)
    runs-on: [self-hosted, Linux]
    steps:
      - name: Preflight host context
        id: preflight
        env:
          INPUT_DEPLOY_PATH: ${{ inputs.deploy_path }}
          COMPOSE_FILE: ${{ inputs.compose_file }}
        run: |
          set -euo pipefail
          echo "Runner: $(hostname)"
          echo "User: $(whoami)"
          echo "PWD: $(pwd)"

          resolve_path() {
            if [[ -n "${INPUT_DEPLOY_PATH}" ]]; then
              echo "${INPUT_DEPLOY_PATH}"
              return
            fi
            for d in \
              /home/ubuntu/iic-booking-backend \
              /home/ubuntu/iic_booking_backend \
              /home/ubuntu/iic-booking-backend-rt-port \
              /home/ubuntu
            do
              if [[ -f "$d/$COMPOSE_FILE" ]]; then
                echo "$d"
                return
              fi
            done
            return 1
          }

          DEPLOY_PATH="$(resolve_path)" || {
            echo "Could not locate $COMPOSE_FILE under known deploy roots."
            ls -la /home/ubuntu || true
            exit 2
          }
          echo "Deploy path: $DEPLOY_PATH"
          echo "deploy_path=$DEPLOY_PATH" >> "$GITHUB_OUTPUT"

          test -d "$DEPLOY_PATH" || { echo "Deploy path missing"; exit 2; }
          test -f "$DEPLOY_PATH/$COMPOSE_FILE" || {
            echo "Compose file missing: $DEPLOY_PATH/$COMPOSE_FILE"
            exit 2
          }
          docker compose version
          cd "$DEPLOY_PATH"
          pwd
          git remote -v
          git status -sb || true
          git describe --tags --always || true
          docker compose -f "$COMPOSE_FILE" ps || true

      - name: Deploy release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          DEPLOY_PATH: ${{ steps.preflight.outputs.deploy_path }}
          COMPOSE_FILE: ${{ inputs.compose_file }}
          HEALTH_URL: ${{ inputs.health_url }}
          ENABLE_FLOWER: ${{ inputs.enable_flower }}
        run: |
          set -euo pipefail

          cd "$DEPLOY_PATH"
          test -f "$COMPOSE_FILE" || { echo "Compose file missing: $DEPLOY_PATH/$COMPOSE_FILE"; exit 2; }

          mkdir -p .deploy-state
          PREV_REF_FILE=.deploy-state/previous_git_ref
          CUR_REF_FILE=.deploy-state/current_git_ref
          PREV_TAG_FILE=.deploy-state/previous_release_tag
          CUR_TAG_FILE=.deploy-state/current_release_tag

          if [[ -f "$CUR_REF_FILE" ]]; then
            cp -f "$CUR_REF_FILE" "$PREV_REF_FILE"
          else
            git rev-parse HEAD > "$PREV_REF_FILE" || true
          fi
          if [[ -f "$CUR_TAG_FILE" ]]; then
            cp -f "$CUR_TAG_FILE" "$PREV_TAG_FILE"
          else
            git describe --tags --exact-match HEAD > "$PREV_TAG_FILE" 2>/dev/null || true
          fi
          PREV_TAG="$(cat "$PREV_TAG_FILE" 2>/dev/null || true)"
          echo "Previous release pointer: ${PREV_TAG:-<unknown>}"

          PROFILE_ARGS=()
          if [[ "$ENABLE_FLOWER" == "true" ]]; then
            PROFILE_ARGS+=(--profile flower)
          fi
          compose() { docker compose -f "$COMPOSE_FILE" "${PROFILE_ARGS[@]}" "$@"; }

          rollback() {
            local reason="$1"
            echo "DEPLOY FAILED: $reason"
            if [[ -z "${PREV_TAG:-}" ]]; then
              echo "No previous release tag recorded — manual recovery required."
              compose ps || true
              return 1
            fi
            echo "Rolling back to $PREV_TAG"
            git fetch --all --tags
            git checkout "$PREV_TAG"
            git submodule update --init --recursive || true
            compose down || true
            compose build --pull
            compose up -d
            echo "Rollback compose up completed for $PREV_TAG"
          }

          echo "=== Fetch / checkout $RELEASE_TAG ==="
          git fetch --all --tags
          git checkout "$RELEASE_TAG"
          git submodule update --init --recursive || true
          git rev-parse HEAD > "$CUR_REF_FILE"
          echo "$RELEASE_TAG" > "$CUR_TAG_FILE"

          echo "=== Compose down ==="
          compose down

          echo "=== Compose build --pull ==="
          if ! compose build --pull; then
            rollback "compose build failed"
            exit 1
          fi

          echo "=== Compose up -d ==="
          if ! compose up -d; then
            rollback "compose up failed"
            exit 1
          fi

          echo "=== Container status ==="
          compose ps

          echo "=== Service presence checks ==="
          STATUS="$(compose ps)"
          echo "$STATUS"
          echo "$STATUS" | grep -E 'django' | grep -qiE 'running|up|healthy' \
            || { rollback "django not running"; exit 1; }
          echo "$STATUS" | grep -E 'celeryworker' | grep -qiE 'running|up' \
            || { rollback "celeryworker not running"; exit 1; }
          echo "$STATUS" | grep -E 'celerybeat' | grep -qiE 'running|up' \
            || { rollback "celerybeat not running"; exit 1; }
          if [[ "$ENABLE_FLOWER" == "true" ]]; then
            echo "$STATUS" | grep -E 'flower' | grep -qiE 'running|up' \
              || { rollback "flower not running"; exit 1; }
          fi

          echo "=== Wait for django container health (if reported) ==="
          for i in $(seq 1 60); do
            HEALTH_LINE="$(compose ps 2>/dev/null | grep -E 'django' || true)"
            if echo "$HEALTH_LINE" | grep -qi 'healthy'; then
              echo "django healthy"
              break
            fi
            if ! echo "$HEALTH_LINE" | grep -qi 'health'; then
              echo "No docker Health column for django — relying on HTTP probe"
              break
            fi
            echo "django not healthy yet ($i/60): $HEALTH_LINE"
            sleep 5
          done

          echo "=== Application health: $HEALTH_URL ==="
          READY=0
          for i in $(seq 1 60); do
            code="$(curl -sS -o /tmp/backend_ready.json -w '%{http_code}' --max-time 5 "$HEALTH_URL" || true)"
            if [[ "$code" == "200" ]]; then
              READY=1
              break
            fi
            echo "health attempt $i http=$code"
            sleep 5
          done
          if [[ "$READY" -ne 1 ]]; then
            rollback "health check failed for $HEALTH_URL"
            exit 1
          fi
          echo "PASS health $HEALTH_URL"
          echo "PASS deployed $RELEASE_TAG at $(git rev-parse --short HEAD)"

          echo "=== Rollback metadata ==="
          echo "previous_release_tag=$(cat "$PREV_TAG_FILE" 2>/dev/null || echo none)"
          echo "current_release_tag=$(cat "$CUR_TAG_FILE")"
          compose ps
