name: Fix Midnight Booking Minutes

# Bookings on slots extended to end at midnight (Slot Ends 24:00 Fix / Full-Day Slots NMR TXI) still store
# total_time_minutes from the old 23:59 ends (1439 instead of 1440). For NMR TXI, SQUID, PPMS, MCU, NMR, XPS,
# Bio-X and L1 the stored length is set to the sum of the booking's slot minutes (as at booking time) when the
# difference comes from the midnight ends. Only total_time_minutes is written (QuerySet.update: no save, no
# signals, no emails); charges, amounts, wallet and statuses are checked unchanged. Dry run unless confirm is
# APPLY-MIDNIGHT-MINUTES; an apply is followed by a dry run that must report remaining_to_fix=0.
# Prints equipment codes, booking ids and minutes only.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Leave empty for a dry run; type APPLY-MIDNIGHT-MINUTES to write"
        required: false
        default: ""

jobs:
  run:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Fix
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          test -n "$CID"
          if [ "${CONFIRM}" = "APPLY-MIDNIGHT-MINUTES" ]; then
            echo "Mode: APPLY"
            OUT="$(docker exec -i -w /app "$CID" python manage.py fix_midnight_booking_minutes --apply)"
            echo "$OUT"
            echo "$OUT" | grep -qx 'charges_unchanged=True' || { echo "Charge check failed; rolled back"; exit 1; }
            echo "Verify (dry run after apply):"
            OUT="$(docker exec -i -w /app "$CID" python manage.py fix_midnight_booking_minutes)"
            echo "$OUT"
            echo "$OUT" | grep -qx 'remaining_to_fix=0' || { echo "Bookings remain after apply"; exit 1; }
          else
            echo "Mode: DRY RUN (type APPLY-MIDNIGHT-MINUTES to apply)"
            docker exec -i -w /app "$CID" python manage.py fix_midnight_booking_minutes
          fi
