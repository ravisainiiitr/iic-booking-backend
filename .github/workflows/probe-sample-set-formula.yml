name: Probe Sample Set Formula Limits (read-only)

# Prints the NUMERIC input-field limits of the equipment whose name matches the filter (default APREO):
# field keys, labels, user types, options (min / max / step / max_formula) and the help-text limit lines,
# plus what the deployed validator allows per sample set. Also counts (no values, no users) which keys
# extra sample sets of that equipment's bookings / templates store, and how many sets hold A above their
# own formula maximum. Runs inside a READ ONLY transaction that is rolled back.

on:
  workflow_dispatch:
    inputs:
      name_filter:
        description: Equipment name fragment to print in detail
        required: false
        default: 'APREO'
      scan_all:
        description: Scan every equipment's formula / cross-field limits instead (true / false)
        required: false
        default: 'false'

jobs:
  probe:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Numeric field limits and sample-set keys (SELECT only)
        if: ${{ github.event.inputs.scan_all != 'true' }}
        env:
          NAME_FILTER: ${{ github.event.inputs.name_filter }}
        run: |
          set -euo pipefail
          cd /home/ubuntu/iic-booking-backend
          CID=$(docker compose -f docker-compose.production.yml ps --format '{{.Name}}' | grep django | head -n1)
          docker exec -i -e NAME_FILTER="${NAME_FILTER:-APREO}" -w /app "$CID" python - <<'PY'
          import os
          from collections import Counter

          import django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings.production")
          django.setup()

          from django.db import connection, transaction

          from iic_booking.equipment import api_views
          from iic_booking.equipment.calculators import split_sample_sets
          from iic_booking.equipment.models import Booking, DynamicInputField, DynamicInputFieldType, Equipment
          from iic_booking.equipment.numeric_field_limits import (
              numeric_constraints,
              numeric_max_formula,
              resolve_numeric_field_bounds,
          )

          NAME_FILTER = (os.environ.get("NAME_FILTER") or "APREO").strip()

          def limit_lines(ht):
              """First three help-text lines (the min / max / step convention), each cut to 40 characters."""
              if not ht or not str(ht).strip():
                  return []
              lines = str(ht).replace("\r\n", "\n").replace("\r", "\n").strip().split("\n")
              return [line.strip()[:40] for line in lines[:3]] + ([f"<+{len(lines) - 3} more lines>"] if len(lines) > 3 else [])

          NEW_RESOLVER = getattr(api_views, "_resolve_numeric_formula_max", None)

          def formula_max(field, values, eq):
              if NEW_RESOLVER is not None:
                  return NEW_RESOLVER(field, values, eq)
              if numeric_max_formula(field.options) and not isinstance(field.options, dict):
                  return "legacy non-dict formula (validator reads only dict options)"
              return api_views._resolve_numeric_max_for_field_a(field, values, eq)

          try:
              from iic_booking.equipment.models import BookingInputTemplate as BookingTemplate
          except ImportError:
              BookingTemplate = None

          with transaction.atomic():
              if connection.vendor == "postgresql":
                  with connection.cursor() as cur:
                      cur.execute("SET TRANSACTION READ ONLY")

              for eq in Equipment.objects.filter(name__icontains=NAME_FILTER).order_by("equipment_id"):
                  print(f"\n== equipment id={eq.equipment_id} code={eq.code!r} status={eq.status} name={eq.name!r} "
                        f"slot={eq.slot_duration_minutes}min allow_multiple_sample_sets="
                        f"{getattr(eq, 'allow_multiple_sample_sets', '<no column>')} profile={eq.profile_type}")
                  rows = list(DynamicInputField.objects.filter(equipment=eq).order_by("field_key", "user_type", "pk"))
                  for f in rows:
                      base = f"  field {f.field_key!r} user_type={f.user_type or '<shared>'!r} label={f.field_label!r} type={f.field_type}"
                      if f.field_type != DynamicInputFieldType.NUMERIC:
                          print(base)
                          continue
                      c = numeric_constraints(options=f.options, help_text=f.help_text)
                      print(f"{base} required={f.is_required} default={f.default_value!r}\n"
                            f"      options={f.options!r} help_limit_lines={limit_lines(f.help_text)}\n"
                            f"      resolved min={c['min']} max={c['max']} step={c['step']} max_formula={c['max_formula']!r} source={c['source']}")
                      if c["max_formula"]:
                          for b in (1, 2, 3, 5):
                              values = {"B": b}
                              fm = formula_max(f, values, eq)
                              bounds = resolve_numeric_field_bounds(
                                  options=f.options, help_text=f.help_text,
                                  formula_max=fm if isinstance(fm, (int, float)) else None,
                                  default_value=f.default_value,
                              )
                              print(f"      with B={b}: formula max={fm} -> validator bounds (min, max, step)={bounds}")
                      if c["max_formula"] and f.field_key != "A" and NEW_RESOLVER is None:
                          print("      NOTE: formula on a field other than A (validator only applies formulas to A)")

                  def scan(label, values_iter):
                      n_with_sets = 0
                      set_keys = Counter()
                      base_keys = Counter()
                      over_formula = Counter()
                      missing_b = 0
                      a_rows = [f for f in rows if f.field_key == "A" and f.field_type == DynamicInputFieldType.NUMERIC]
                      for iv in values_iter:
                          base, sets = split_sample_sets(iv if isinstance(iv, dict) else {})
                          if not sets:
                              continue
                          n_with_sets += 1
                          base_keys.update(base.keys())
                          for idx, s in enumerate(sets, start=2):
                              set_keys.update(s.keys())
                              if "B" not in s:
                                  missing_b += 1
                              for af in a_rows:
                                  a = api_views._to_float_or_none(s.get("A"))
                                  fm = formula_max(af, s, eq)
                                  if a is not None and isinstance(fm, (int, float)) and a > fm:
                                      over_formula[f"set {idx} (user_type row {af.user_type or '<shared>'!r})"] += 1
                      print(f"  {label}: with extra sample sets={n_with_sets}")
                      print(f"    keys in sample set 1: {dict(base_keys.most_common(30))}")
                      print(f"    keys in extra sets:   {dict(set_keys.most_common(30))}")
                      print(f"    extra sets without B: {missing_b}")
                      print(f"    extra sets whose A is above their own formula max: {dict(over_formula) or 'none'}")

                  scan("bookings", Booking.objects.filter(equipment=eq).values_list("input_values", flat=True).iterator())
                  if BookingTemplate is not None:
                      try:
                          scan("templates", BookingTemplate.objects.filter(equipment=eq).values_list("input_values", flat=True).iterator())
                      except Exception as exc:  # noqa: BLE001
                          print(f"  templates: skipped ({type(exc).__name__})")

              print("\n== other active equipment with a NUMERIC max_formula ==")
              seen = Counter()
              for f in DynamicInputField.objects.filter(field_type=DynamicInputFieldType.NUMERIC, equipment__status="ACTIVE").select_related("equipment"):
                  formula = numeric_max_formula(f.options)
                  if formula:
                      seen[(f.equipment.equipment_id, (f.equipment.name or "")[:50], f.field_key, formula, type(f.options).__name__)] += 1
              for (eid, name, key, formula, kind), n in sorted(seen.items()):
                  print(f"  {eid}:{name} field {key} max_formula={formula!r} options_type={kind} rows={n}")

              transaction.set_rollback(True)
          print("\nDONE (read-only, rolled back)")
          PY

      - name: All equipment - formula / cross-field limits and what the validator does with them (SELECT only, counts only)
        if: ${{ github.event.inputs.scan_all == 'true' }}
        run: |
          set -euo pipefail
          cd /home/ubuntu/iic-booking-backend
          CID=$(docker compose -f docker-compose.production.yml ps --format '{{.Name}}' | grep django | head -n1)
          docker exec -i -w /app "$CID" python - <<'PY'
          import inspect
          import logging
          import os
          import re
          from collections import Counter, defaultdict

          import django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings.production")
          django.setup()

          from django.db import connection, transaction

          from iic_booking.equipment import api_views
          from iic_booking.equipment.calculators import split_sample_sets
          from iic_booking.equipment.models import (
              Booking, BookingInputTemplate, BookingStatus, DynamicInputField, DynamicInputFieldType, Equipment,
              EquipmentStatus,
          )
          from iic_booking.equipment import numeric_field_limits as nfl
          from iic_booking.equipment.numeric_field_limits import max_formula_error, numeric_constraints, numeric_max_formula
          from iic_booking.users.models.user_type import UserType

          NEW_VALIDATOR = hasattr(api_views, "_resolve_numeric_formula_max") and hasattr(nfl, "evaluate_max_formula")
          logging.getLogger(nfl.__name__).setLevel(logging.ERROR)

          ACTIVE_STATUSES = [
              BookingStatus.PENDING, BookingStatus.PENDING_PAYMENT, BookingStatus.WAITLISTED, BookingStatus.BOOKED,
              BookingStatus.DISRUPTION_PENDING, BookingStatus.HOLD, BookingStatus.PROCESSING,
          ]
          TOKEN_RE = re.compile(r"(?<![A-Za-z0-9_])([A-Z])(?![A-Za-z0-9_])")
          FORMULA_LINE_RE = re.compile(r"^[A-Z0-9_.+\-*/()\s]+$")
          num = api_views._to_float_or_none

          def is_ext(ut):
              return bool(ut) and UserType.is_external_user(ut)

          def tokens(formula):
              return list(dict.fromkeys(TOKEN_RE.findall(formula)))

          def evaluate(formula, values, slot_minutes, fallbacks=None):
              """What the deployed validator works out for ``formula`` with one set's values."""
              if NEW_VALIDATOR:
                  return nfl.evaluate_max_formula(
                      formula, values, slot_duration_minutes=slot_minutes, fallbacks=fallbacks
                  )
              expr = formula
              for token in "ABCDEFGHIJKLMNOPQRSTUVWXYZ":
                  v = num(values.get(token))
                  expr = re.sub(rf"(?<![a-zA-Z0-9_]){token}(?![a-zA-Z0-9_])", str(v if v is not None else 0), expr)
              expr = re.sub(r"(?<![a-zA-Z0-9_])SLOT_DURATION_MINUTES(?![a-zA-Z0-9_])", str(slot_minutes or 0), expr)
              if not re.fullmatch(r"[0-9\.\+\-\*\/\(\)\s]+", expr):
                  return None
              try:
                  return float(eval(expr, {"__builtins__": {}}, {}))  # noqa: S307 - digits/operators only
              except Exception:  # noqa: BLE001
                  return None

          def help_formulas(ht):
              """[(kind, text)] for help-text limit lines 1-3 (min / max / step) that reference a field key."""
              if not ht or not str(ht).strip():
                  return []
              lines = str(ht).replace("\r\n", "\n").replace("\r", "\n").strip().split("\n")
              if len(lines) > 3:
                  return []
              if len(lines) == 1:
                  parts = [p for p in re.split(r"[,;\s]+", lines[0].strip()) if p]
                  lines = parts if len(parts) == 3 else lines
              out = []
              for kind, line in zip(("min", "max", "step"), lines):
                  text = line.strip()
                  if text and FORMULA_LINE_RE.fullmatch(text) and (TOKEN_RE.search(text) or "SLOT_DURATION_MINUTES" in text):
                      out.append((kind, text))
              return out

          src_validate = inspect.getsource(api_views._validate_dynamic_numeric_input_limits)
          if NEW_VALIDATOR:
              src_resolve = inspect.getsource(api_views._resolve_numeric_formula_max)
              legacy_ok = "numeric_max_formula(field.options)" in src_resolve
          else:
              src_resolve = inspect.getsource(api_views._resolve_numeric_max_for_field_a)
              legacy_ok = "numeric_max_formula(raw_options)" in src_resolve
          a_only = 'key == "A"' in src_validate and "not is_external" in src_validate
          print(f"deployed validator: formulas on every numeric field for every user type={NEW_VALIDATOR and not a_only}; "
                f"formulas only on field A for non-external users={a_only}; "
                f"legacy text options ('B*4') read={legacy_ok}; help-text formulas evaluated=False (parser reads the first number)")

          def category(row, kind, source, formula):
              if source == "help_text":
                  c = numeric_constraints(options=row.options, help_text=row.help_text)
                  read = c.get(kind)
                  how = f"options.{kind} {read:g} wins" if c["source"].get(kind) == "options" else (
                      f"parser reads {read:g} as {kind}" if read is not None else f"no {kind} read")
                  return f"ignored: help-text formula ({how})"
              if max_formula_error(formula):
                  return "ignored: unparseable formula"
              if not isinstance(row.options, dict) and not legacy_ok:
                  return "ignored: legacy text format not read"
              if not a_only:
                  return "applied"
              if row.field_key != "A":
                  return "ignored: not field A"
              if is_ext(row.user_type):
                  return "ignored: external user type"
              if not row.user_type:
                  return "applied (internal users; ignored when an external user books)"
              return "applied"

          with transaction.atomic():
              if connection.vendor == "postgresql":
                  with connection.cursor() as cur:
                      cur.execute("SET TRANSACTION READ ONLY")

              equipment = {e.equipment_id: e for e in Equipment.objects.all()}
              rows_by_eq = defaultdict(list)
              for f in DynamicInputField.objects.all().order_by("equipment_id", "field_key", "user_type", "pk"):
                  rows_by_eq[f.equipment_id].append(f)

              def shown_rows(eq_id, ut):
                  """Rows the booking form shows for user type ``ut``: typed rows if any, else shared rows."""
                  rows = rows_by_eq[eq_id]
                  typed = [r for r in rows if ut and r.user_type == ut]
                  return typed or [r for r in rows if not r.user_type]

              def row_for(eq_id, key, ut):
                  for r in shown_rows(eq_id, ut):
                      if r.field_key == key:
                          return r
                  return None

              # (equipment, row) -> [(kind, source, formula, category)]
              formula_rows = defaultdict(list)
              for eq_id, rows in rows_by_eq.items():
                  for r in rows:
                      if r.field_type != DynamicInputFieldType.NUMERIC:
                          continue
                      f = numeric_max_formula(r.options)
                      if f:
                          formula_rows[eq_id].append((r, "max", "options", f, category(r, "max", "options", f)))
                      for kind, text in help_formulas(r.help_text):
                          formula_rows[eq_id].append((r, kind, "help_text", text, category(r, kind, "help_text", text)))
              print(f"equipment total={len(equipment)} with a formula / cross-field limit={len(formula_rows)} "
                    f"formula rows={sum(len(v) for v in formula_rows.values())}")

              # Violations: counts per (row pk, kind, source) for active bookings and all templates.
              viol = defaultdict(Counter)
              checked = defaultdict(Counter)

              fallback_cache = {}

              def fallbacks_for(eq_id, ut):
                  """Values the validator uses for empty referenced fields (default, else minimum)."""
                  if not NEW_VALIDATOR:
                      return None
                  if (eq_id, ut) not in fallback_cache:
                      out = {}
                      for x in sorted(rows_by_eq[eq_id], key=lambda x: (x.user_type != ut, bool(x.user_type))):
                          if x.field_key not in out:
                              out[x.field_key] = nfl.formula_fallback_value(x)
                      fallback_cache[(eq_id, ut)] = {k: v for k, v in out.items() if v is not None}
                  return fallback_cache[(eq_id, ut)]

              def check(eq_id, values, ut, bucket):
                  base, sets = split_sample_sets(values if isinstance(values, dict) else {})
                  eq = equipment[eq_id]
                  fallbacks = fallbacks_for(eq_id, ut)
                  unresolved = Counter()
                  hit = set()
                  sets_hit = Counter()
                  seen_lines = set()
                  for r, kind, source, formula, cat in formula_rows[eq_id]:
                      picked = row_for(eq_id, r.field_key, ut)
                      if picked is None or picked.pk != r.pk:
                          continue
                      line = (r.pk, kind, source)
                      seen_lines.add(line)
                      if kind == "step":
                          continue
                      for group in (base, *sets):
                          value = num(group.get(r.field_key))
                          if value is None:
                              continue
                          limit = (
                              evaluate(formula, group, eq.slot_duration_minutes, fallbacks)
                              if source == "options" else evaluate(formula, group, eq.slot_duration_minutes)
                          )
                          if limit is None:
                              unresolved[line] += 1
                              continue
                          if (kind == "max" and value > limit) or (kind == "min" and value < limit):
                              hit.add(line)
                              sets_hit[line] += 1
                  for line in seen_lines:
                      checked[line][bucket] += 1
                  for line, n in unresolved.items():
                      checked[line][bucket + "_unresolved_sets"] += n
                  for line in hit:
                      viol[line][bucket] += 1
                      viol[line][bucket + "_sets"] += sets_hit[line]

              eq_ids = list(formula_rows)
              for eq_id, iv, snap, cp_ut, user_ut in Booking.objects.filter(
                  equipment_id__in=eq_ids, status__in=ACTIVE_STATUSES
              ).values_list("equipment_id", "input_values", "user_type_snapshot", "charge_profile__user_type", "user__user_type").iterator():
                  check(eq_id, iv, (snap or "").strip() or (cp_ut or "").strip() or (user_ut or "").strip(), "bookings")
              for eq_id, iv, user_ut in BookingInputTemplate.objects.filter(equipment_id__in=eq_ids).values_list(
                  "equipment_id", "input_values", "user__user_type"
              ).iterator():
                  check(eq_id, iv, (user_ut or "").strip(), "templates")

              print("\n== formula / cross-field limits (rows with the same formula and outcome merged; user types listed) ==")
              print("status | equipment | field (A/B/other) | label | user types | source | kind | formula | validator | "
                    "active bookings checked / violating (sets) | templates checked / violating (sets) | "
                    "sets where the formula could not be worked out (bookings / templates)")
              by_cat = Counter()
              ignored_impact = []
              for eq_id in sorted(formula_rows, key=lambda i: (equipment[i].status != EquipmentStatus.ACTIVE, i)):
                  eq = equipment[eq_id]
                  merged = defaultdict(lambda: {"uts": [], "chk": Counter(), "vio": Counter()})
                  for r, kind, source, formula, cat in formula_rows[eq_id]:
                      m = merged[(r.field_key, r.field_label, source, kind, formula, cat)]
                      m["uts"].append(r.user_type or "<shared>")
                      m["chk"].update(checked[(r.pk, kind, source)])
                      m["vio"].update(viol[(r.pk, kind, source)])
                  for (key, label, source, kind, formula, cat), m in sorted(merged.items()):
                      ab = key if key in ("A", "B") else "other"
                      status = "ACTIVE" if eq.status == EquipmentStatus.ACTIVE else f"inactive({eq.status})"
                      by_cat[(cat, status == "ACTIVE")] += 1
                      line = (f"  {status} | {eq.equipment_id}:{eq.code} {(eq.name or '')[:55]!r} | {key} ({ab}) | {(label or '')[:45]!r} | "
                              f"{','.join(m['uts'])} | {source} | {kind} | {formula!r} | {cat} | "
                              f"{m['chk']['bookings']} / {m['vio']['bookings']} ({m['vio']['bookings_sets']}) | "
                              f"{m['chk']['templates']} / {m['vio']['templates']} ({m['vio']['templates_sets']}) | "
                              f"{m['chk']['bookings_unresolved_sets']} / {m['chk']['templates_unresolved_sets']}")
                      print(line)
                      if cat.startswith("ignored") or "ignored when" in cat:
                          ignored_impact.append(line)

              print("\n== broken references (formula uses a field key the form does not show for that user type, or a non-numeric field) ==")
              broken = 0
              for eq_id in sorted(formula_rows):
                  eq = equipment[eq_id]
                  for r, kind, source, formula, cat in formula_rows[eq_id]:
                      shown = {x.field_key: x for x in shown_rows(eq_id, r.user_type)}
                      issues = []
                      missing_note = "formula ignored" if NEW_VALIDATOR else "counts as 0"
                      for t in tokens(formula):
                          if t not in shown:
                              issues.append(f"{t} missing ({missing_note})")
                          elif shown[t].field_type != DynamicInputFieldType.NUMERIC:
                              issues.append(f"{t} is {shown[t].field_type} (non-numeric, {missing_note} unless a number)")
                      if not issues:
                          continue
                      broken += 1
                      plain = []
                      for k, x in sorted(shown.items()):
                          if k == r.field_key or x.field_type != DynamicInputFieldType.NUMERIC:
                              continue
                          c = numeric_constraints(options=x.options, help_text=x.help_text)
                          if c["min"] is not None or c["max"] is not None:
                              plain.append(f"{k}: min={c['min']} max={c['max']}")
                      status = "ACTIVE" if eq.status == EquipmentStatus.ACTIVE else f"inactive({eq.status})"
                      print(f"  {status} | {eq.equipment_id}:{eq.code} {(eq.name or '')[:55]!r} | field {r.field_key} "
                            f"user_type={r.user_type or '<shared>'} | {source} {kind} {formula!r} | {'; '.join(issues)} | "
                            f"other fields' plain limits: {plain or 'none'}")
              print(f"  broken reference rows: {broken}")

              print("\n== summary: formula lines by validator outcome (active equipment / inactive) ==")
              cats = sorted({c for c, _ in by_cat})
              for c in cats:
                  print(f"  {c}: active={by_cat[(c, True)]} inactive={by_cat[(c, False)]}")

              transaction.set_rollback(True)
          print("\nDONE (read-only, rolled back)")
          PY
