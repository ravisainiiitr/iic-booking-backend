# Emergency path when the Linux self-hosted runner is offline:
# SSH from Windows build host to EC2, apply device_provisioning migrations,
# capture traceback, smoke POST /sessions/, and restart the Actions runner.
name: EC2 SSH Fix Provisioning Sessions

on:
  workflow_dispatch:
    inputs:
      restart_runner:
        description: Restart GitHub Actions runner service on EC2 after migrate
        required: false
        type: boolean
        default: true
      apply_migrate:
        description: Run manage.py migrate (including device_provisioning)
        required: false
        type: boolean
        default: true

concurrency:
  group: ec2-ssh-provisioning-fix
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fix:
    name: SSH diagnose + migrate
    runs-on: [self-hosted, Windows]
    steps:
      - name: Checkout remote script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci/ec2_fix_provisioning_sessions.sh
          sparse-checkout-cone-mode: false

      - name: Validate secrets
        shell: pwsh
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if (-not $env:EC2_HOST) { throw "Missing EC2_HOST" }
          if (-not $env:EC2_USER) { throw "Missing EC2_USER" }
          if (-not $env:EC2_SSH_KEY) { throw "Missing EC2_SSH_KEY" }
          Write-Host "Secrets present. Host=$($env:EC2_HOST) User=$($env:EC2_USER)"

      - name: Diagnose, migrate, smoke sessions
        shell: pwsh
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          APPLY_MIGRATE: ${{ inputs.apply_migrate }}
          RESTART_RUNNER: ${{ inputs.restart_runner }}
        run: |
          $ErrorActionPreference = "Stop"
          $keyPath = Join-Path $env:RUNNER_TEMP "ec2_deploy_key"
          $pem = $env:EC2_SSH_KEY -replace "`r",""
          if (-not $pem.EndsWith("`n")) { $pem += "`n" }
          [System.IO.File]::WriteAllText($keyPath, $pem)
          icacls $keyPath /inheritance:r | Out-Null
          icacls $keyPath /grant:r "$($env:USERNAME):(R)" | Out-Null

          $script = "scripts/ci/ec2_fix_provisioning_sessions.sh"
          if (-not (Test-Path $script)) { throw "Missing $script" }

          $port = if ($env:EC2_PORT) { $env:EC2_PORT } else { "22" }
          $target = "$($env:EC2_USER)@$($env:EC2_HOST)"
          Write-Host "SSH $target port=$port"
          $body = Get-Content -Raw $script
          $body = $body -replace "`r`n","`n"
          $wrapped = "export APPLY_MIGRATE='$($env:APPLY_MIGRATE)'; export RESTART_RUNNER='$($env:RESTART_RUNNER)';`n" + $body
          $wrapped | & ssh.exe -i $keyPath -p $port -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 $target "bash -s"
          if ($LASTEXITCODE -ne 0) { throw "Remote SSH script failed with exit $LASTEXITCODE" }
