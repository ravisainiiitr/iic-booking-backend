name: Verify RAVI Agent Heartbeat And RDP

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: self-hosted
    steps:
      - name: Check RAVI workstation heartbeat and RDP secret presence
        run: |
          set -euo pipefail
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          docker exec -i -w /app "$CID" python manage.py shell <<'PY'
          from django.utils import timezone
          from iic_booking.remote_analysis.models import AnalysisWorkstation
          from iic_booking.remote_analysis.session_models import WorkstationRdpSecret, RemoteDesktopSession
          from iic_booking.remote_analysis.constants import CommandStatus
          from iic_booking.remote_analysis.models import RemoteCommand

          now = timezone.now()
          for ws in AnalysisWorkstation.objects.filter(hostname__icontains='RAVI').order_by('-last_heartbeat'):
              age = int((now - ws.last_heartbeat).total_seconds()) if ws.last_heartbeat else None
              secret = WorkstationRdpSecret.objects.filter(workstation=ws).first()
              print('WS', ws.id, ws.hostname, 'status', ws.status, 'hb_age_s', age, 'agent', getattr(ws,'agent_id',None),
                    'rdp_secret', bool(secret), 'rdp_user', bool(secret and secret.username),
                    'rdp_password_set', bool(secret and (secret.password_encrypted or '').strip()))
          for c in RemoteCommand.objects.filter(workstation_id='d5cb9ef0-db96-4d6c-aa5d-523087a3f9cc').order_by('-created_at')[:5]:
              print('CMD', c.id, c.command_type, c.status, c.created_at)
          for s in RemoteDesktopSession.objects.filter(workstation_id='d5cb9ef0-db96-4d6c-aa5d-523087a3f9cc').order_by('-created_at')[:3]:
              print('SESSION', s.id, s.status, s.termination_reason)
          PY
