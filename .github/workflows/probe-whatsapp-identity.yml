# ONE-OFF TEST SEND (branch ops/whatsapp-test-send only, never merged): sends ONE approved template, iitr_booking_reminder
# with dummy booking details, to the number in the WHATSAPP_TEST_CONTACT_NUMBER secret, through the portal's own client
# and production's sender settings. Changes no setting: WHATSAPP_ENABLED stays as it is and nobody else gets anything.
# The run log is public: it prints only the last two digits of the number and whether Meta accepted the message.
name: Probe WhatsApp identity (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Send one test template
        env:
          TEST_TO: ${{ secrets.WHATSAPP_TEST_CONTACT_NUMBER }}
        run: |
          set -euo pipefail
          case "$TEST_TO" in (+[1-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]*) ;; (*) echo "WHATSAPP_TEST_CONTACT_NUMBER must look like +91XXXXXXXXXX"; exit 1 ;; esac
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          docker exec -i -w /app -e TEST_TO -e DJANGO_SETTINGS_MODULE=config.settings.production "$CID" python -c '
          import os, django
          django.setup()
          from django.utils import timezone
          from iic_booking.whatsapp import client, conf
          to = os.environ["TEST_TO"].strip()
          print("Sender configured:", bool(conf.phone_number_id() and conf.access_token()), "| sending switch (unchanged):", conf.enabled())
          print("Recipient: number ending", to[-2:])
          now = timezone.localtime()
          params = ["Test User", "TEST-0001", "Test message only, not a real booking", now.strftime("%d %b %Y"), now.strftime("%I:%M %p")]
          try:
              client.send_template(to, "iitr_booking_reminder", params, language="en")
              print("RESULT: Meta ACCEPTED the message (iitr_booking_reminder)")
          except client.WhatsAppError as exc:
              text = str(exc).replace(to, "[number]").replace(to.lstrip("+"), "[number]")
              for hidden in (conf.phone_number_id(), conf.access_token()):
                  if hidden:
                      text = text.replace(hidden, "[hidden]")
              print("RESULT: Meta did NOT accept it:", text[:300])
              raise SystemExit(1)
          '
