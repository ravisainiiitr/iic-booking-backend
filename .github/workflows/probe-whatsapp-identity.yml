# READ-ONLY: what Meta reports about the WhatsApp sender's identity. GET requests only: sends nothing and changes no name,
# registration, setting or record. Script and rules: scripts/ops/whatsapp_identity_probe.py. Run logs are public, so the
# Phone Number ID and the optional WABA ID come from secrets, not inputs: inputs would appear in the log.
#   WHATSAPP_DIAGNOSTIC_PHONE_NUMBER_ID  the sender to investigate (required)
#   WHATSAPP_DIAGNOSTIC_WABA_ID          the WABA from WhatsApp Manager (optional; otherwise the token's scopes are asked)
name: Probe WhatsApp identity (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - name: Ask Meta
        env:
          TARGET_ID: ${{ secrets.WHATSAPP_DIAGNOSTIC_PHONE_NUMBER_ID }}
          WABA_ID: ${{ secrets.WHATSAPP_DIAGNOSTIC_WABA_ID }}
        run: |
          set -euo pipefail
          case "$TARGET_ID" in (*[!0-9]*|'') echo "WHATSAPP_DIAGNOSTIC_PHONE_NUMBER_ID must be set and numeric"; exit 1 ;; esac
          case "$WABA_ID" in (*[!0-9]*) echo "WHATSAPP_DIAGNOSTIC_WABA_ID must be numeric"; exit 1 ;; esac
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          # The runner's checkout is sparse, so the script is read from git rather than from disk.
          git -C "$GITHUB_WORKSPACE" show HEAD:scripts/ops/whatsapp_identity_probe.py \
            | docker exec -i -w /app -e TARGET_ID -e WABA_ID -e DJANGO_SETTINGS_MODULE=config.settings.production "$CID" \
              python -
