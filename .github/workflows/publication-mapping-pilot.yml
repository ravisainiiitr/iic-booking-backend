name: Publication Mapping Pilot (dry run unless APPLY)

on:
  workflow_dispatch:
    inputs:
      step:
        description: "seed_facility_aliases | link_faculty_authors | verify_publication_acknowledgements | daily_publication_scan (runs the scheduled scan now; ignores APPLY)"
        required: true
        default: verify_publication_acknowledgements
      user_ids:
        description: "Space-separated portal user ids (link / verify)"
        required: false
        default: ""
      department:
        description: "Department code, or ALL (link_faculty_authors only, instead of user ids)"
        required: false
        default: ""
      limit:
        description: "Papers per user (verify) or users (link)"
        required: false
        default: "50"
      apply:
        description: "Type APPLY to save (anything else = dry run)"
        required: false
        default: ""

jobs:
  pilot:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Run the pilot step
        env:
          STEP: ${{ github.event.inputs.step }}
          USER_IDS: ${{ github.event.inputs.user_ids }}
          DEPARTMENT: ${{ github.event.inputs.department }}
          LIMIT: ${{ github.event.inputs.limit }}
          APPLY: ${{ github.event.inputs.apply }}
        run: |
          set -euo pipefail
          case "$STEP" in
            seed_facility_aliases|link_faculty_authors|verify_publication_acknowledgements|daily_publication_scan) ;;
            *) echo "Unknown step: $STEP"; exit 1 ;;
          esac
          cd /home/ubuntu/iic-booking-backend
          CID=$(docker compose -f docker-compose.production.yml ps --format '{{.Name}}' | grep django | head -n1)
          if [ "$STEP" = "daily_publication_scan" ]; then
            docker exec -w /app "$CID" python manage.py shell -c "import json; from iic_booking.impact.service import daily_publication_scan; print('SCAN RESULT', json.dumps(daily_publication_scan(), default=str))"
            exit 0
          fi
          if [ "$STEP" = "link_faculty_authors" ] && [ "$DEPARTMENT" = "ALL" ]; then
            CODES=$(docker exec -w /app "$CID" python manage.py shell -c "from iic_booking.users.models.user_type import UserType; from django.contrib.auth import get_user_model as g; print(' '.join(sorted(set(c for c in g().objects.filter(user_type=UserType.FACULTY, is_active=True).values_list('department__code', flat=True) if c))))" | tail -n1)
            echo "Departments with active faculty: $CODES"
            EXTRA=()
            if [ "$APPLY" = "APPLY" ]; then EXTRA+=(--apply --discover); fi
            for code in $CODES; do
              case "$code" in (*[!A-Za-z0-9_-]*) echo "Skipping odd code: $code"; continue ;; esac
              echo "=== $code ==="
              docker exec -w /app "$CID" python manage.py link_faculty_authors --department "$code" --limit "${LIMIT:-200}" "${EXTRA[@]}" | grep -E "^(DRY RUN|APPLY) user=|^users=" || echo "(failed for $code)"
            done
            exit 0
          fi
          ARGS=()
          for id in $USER_IDS; do
            case "$id" in (*[!0-9]*|'') echo "Bad user id: $id"; exit 1 ;; esac
            ARGS+=(--user-id "$id")
          done
          if [ "$STEP" = "link_faculty_authors" ] && [ -n "$DEPARTMENT" ]; then ARGS+=(--department "$DEPARTMENT"); fi
          if [ "$STEP" != "seed_facility_aliases" ]; then ARGS+=(--limit "${LIMIT:-50}"); fi
          if [ "$APPLY" = "APPLY" ]; then ARGS+=(--apply); fi
          docker exec -w /app "$CID" python manage.py "$STEP" "${ARGS[@]}"
