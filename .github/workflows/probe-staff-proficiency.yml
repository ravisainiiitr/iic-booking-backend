# Read-only: the deployed Lab Operator / Officer in Charge proficiency ranking as the Main Administrator sees it
# (institute scope, or one department), inside a rolled-back transaction. Prints user ids and figures only — no
# names or emails (CI logs are public).
name: Probe Staff Proficiency

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Handled-in period (days)"
        required: false
        default: "30"
      dept:
        description: "Department id (blank = institute)"
        required: false
        default: ""

jobs:
  probe:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Probe
        env:
          DAYS: ${{ inputs.days }}
          DEPT: ${{ inputs.dept }}
        run: |
          set -euo pipefail
          for d in \
            /home/ubuntu/iic-booking-backend \
            /home/ubuntu/iic_booking_backend \
            /home/ubuntu/iic-booking-backend-rt-port
          do
            if [[ -f "$d/docker-compose.production.yml" ]]; then
              cd "$d"
              echo "DESCRIBE=$(git describe --tags --always 2>/dev/null || true)"
              CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1 || true)"
              test -n "$CID"
              docker exec -i -w /app -e DAYS="$DAYS" -e DEPT="$DEPT" "$CID" python - <<'PY'
          import os, django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings.production")
          django.setup()
          from django.db import transaction
          from iic_booking.equipment.admin_insights.proficiency import build_staff_proficiency
          from iic_booking.users.models import User

          admin = User.objects.filter(user_type="admin", is_active=True, is_test_account=False).order_by("pk").first()
          params = {"days": os.environ.get("DAYS") or "30"}
          if (os.environ.get("DEPT") or "").strip():
              params["dept"] = os.environ["DEPT"].strip()
          with transaction.atomic():
              data = build_staff_proficiency(admin, params)
              transaction.set_rollback(True)
          print(f"scope={data.get('scope')} dept={data.get('selected_department_id')} "
                f"period={data['date_from']}..{data['date_to']} ({data['days']} days)")
          print(f"formula: {data['formula']}")
          for key, title in (("operators", "LAB OPERATORS"), ("oics", "OFFICERS IN CHARGE")):
              rows = data[key]
              print(f"\n== {title}: {len(rows)} (rank | user id | equipment | pending | overdue | handled | avg response h | score)")
              for r in rows:
                  avg = "-" if r["avg_response_hours"] is None else f"{r['avg_response_hours']:.1f}"
                  print(f"{r['rank'] or '-'} | {r['id']} | {len(r['equipment'])} | {r['pending']} | {r['overdue']} | "
                        f"{r['handled']} | {avg} | {r['score'] if r['score'] is not None else 'no work'}")
          PY
              exit 0
            fi
          done
          echo "No production checkout found" >&2
          exit 1
