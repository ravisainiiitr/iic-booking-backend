# Programme / employment end dates on production. report, degree-names, recompute-dry-run and
# backfill-links-dry-run are read-only and print counts / ids only (no names or email addresses).
# recompute-apply stores the computed end dates (no emails). backfill-links-apply creates the automatic
# wallet links for already-approved post-docs / RAs and emails each linked user (faculty copied).
# Suspension and reminders are switched by the ACCOUNT_END_DATE_ENFORCEMENT environment flag, not here.
name: Account Lifecycle

on:
  workflow_dispatch:
    inputs:
      action:
        description: "report | degree-names | recompute-dry-run | recompute-apply | backfill-links-dry-run | backfill-links-apply"
        required: true
        default: "report"
        type: choice
        options: [report, degree-names, recompute-dry-run, recompute-apply, backfill-links-dry-run, backfill-links-apply]
      confirm:
        description: "Type APPLY to run an -apply action"
        required: false
        default: ""

jobs:
  run:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Run
        env:
          AL_ACTION: ${{ github.event.inputs.action }}
          AL_CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          case "$AL_ACTION" in
            report) ARGS="report" ;;
            degree-names) ARGS="degree-names" ;;
            recompute-dry-run) ARGS="recompute" ;;
            backfill-links-dry-run) ARGS="backfill-links" ;;
            recompute-apply|backfill-links-apply)
              if [[ "$AL_CONFIRM" != "APPLY" ]]; then echo "confirm=APPLY is required for $AL_ACTION"; exit 1; fi
              ARGS="${AL_ACTION%-apply} --apply" ;;
            *) echo "unknown action"; exit 1 ;;
          esac
          for d in \
            /home/ubuntu/iic-booking-backend \
            /home/ubuntu/iic_booking_backend \
            /home/ubuntu/iic-booking-backend-rt-port
          do
            if [[ -f "$d/docker-compose.production.yml" ]]; then
              cd "$d"
              echo "DESCRIBE=$(git describe --tags --always 2>/dev/null || true)"
              CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1 || true)"
              test -n "$CID"
              # shellcheck disable=SC2086
              docker exec -w /app "$CID" python manage.py account_lifecycle $ARGS 2>&1 \
                | sed -E 's/([A-Za-z0-9])[A-Za-z0-9._%+-]*@([A-Za-z0-9.-]+)/\1***@\2/g'
              exit 0
            fi
          done
          echo "No production compose path found"
          exit 1
