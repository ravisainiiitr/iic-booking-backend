# Read-only, counts only (no booking ids, no names): stored booking status counts, open bookings whose
# sample the lab has, and (once deployed) the View Booking display statuses Pending / Result Overdue.
name: Probe Pending / Result Overdue Status

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Probe
        run: |
          set -euo pipefail
          for d in \
            /home/ubuntu/iic-booking-backend \
            /home/ubuntu/iic_booking_backend \
            /home/ubuntu/iic-booking-backend-rt-port
          do
            if [[ -f "$d/docker-compose.production.yml" ]]; then
              cd "$d"
              echo "DESCRIBE=$(git describe --tags --always 2>/dev/null || true)"
              CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1 || true)"
              test -n "$CID"
              docker exec -i -w /app "$CID" python - <<'PY'
          import os, django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings.production")
          django.setup()
          from django.db.models import Count
          from django.utils import timezone
          from iic_booking.equipment.models import Booking
          from iic_booking.equipment import results_deadline as rd

          now = timezone.now()
          print(f"now={now.isoformat()}")
          for row in Booking.objects.values("status").annotate(n=Count("booking_id")).order_by("status"):
              print(f"stored_status {row['status']}={row['n']}")
          open_qs = rd.annotate_sample_receipt(Booking.objects.filter(status__in=rd._open_statuses()))
          print(f"open_with_sample_received_trace={open_qs.filter(_sample_received=True).count()}")
          print(f"results_overdue_now={len(rd.overdue_bookings(Booking.objects.all(), now))}")
          try:
              from iic_booking.equipment import booking_list_status as bls
          except ImportError:
              print("booking_list_status=not deployed")
          else:
              qs = bls.annotate_list_status(Booking.objects.all(), now=now)
              for row in qs.values("_list_status").annotate(n=Count("booking_id")).order_by("_list_status"):
                  print(f"list_status {row['_list_status']}={row['n']}")
              for row in qs.values("_list_group").annotate(n=Count("booking_id")).order_by("_list_group"):
                  print(f"list_group {row['_list_group']}={row['n']}")
          PY
              exit 0
            fi
          done
          echo "backend checkout not found"
          exit 1
