name: Recover PXRD Booking RA Allocation

# Free stuck RESERVED workstation, recreate reservation with a near-term window,
# seed inventory if needed, and allocate again for IICPXRD [A]202600040.

on:
  workflow_dispatch:
    inputs:
      booking_id:
        required: true
        default: "IICPXRD [A]202600040"
      hostname:
        required: true
        default: "DESKTOP-CSMH6BU"

jobs:
  recover:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Recover allocation
        env:
          BID: ${{ github.event.inputs.booking_id }}
          HOST: ${{ github.event.inputs.hostname }}
        run: |
          set -euo pipefail
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          docker exec -e BID="$BID" -e HOST="$HOST" -w /app "$CID" python manage.py shell -c "
          import os, json
          from datetime import timedelta
          from django.utils import timezone
          from iic_booking.equipment.models import Booking
          from iic_booking.remote_analysis.models import AnalysisWorkstation, InstalledSoftware
          from iic_booking.remote_analysis.scheduler_models import AnalysisReservation, ReservationQueue
          from iic_booking.remote_analysis.constants import ReservationStatus, QueueEntryStatus, WorkstationStatus
          from iic_booking.equipment.remote_analysis_integration.software import SoftwareMappingService
          from iic_booking.remote_analysis.services.scheduler import SchedulerService
          from iic_booking.remote_analysis.services.reservation import ReservationService

          bid=os.environ['BID'].strip(); host=os.environ['HOST'].strip()
          b=Booking.objects.select_related('equipment').filter(virtual_booking_id=bid).first()
          w=AnalysisWorkstation.objects.filter(hostname__iexact=host).first()
          if not b or not w: print('MISSING', bool(b), bool(w)); raise SystemExit(1)
          required=SoftwareMappingService().required_software_names(b.equipment)
          for name in required:
              row=InstalledSoftware.objects.filter(workstation=w, software_name__iexact=name).order_by('-is_present','-id').first()
              if row is None:
                  InstalledSoftware.objects.create(workstation=w, software_name=name, category='catalog', is_present=True)
              elif not row.is_present:
                  row.is_present=True; row.save(update_fields=['is_present','last_updated'])
          # Free stuck WS
          if w.status in {WorkstationStatus.RESERVED, WorkstationStatus.BUSY, WorkstationStatus.PREPARING}:
              print('FREEING', w.hostname, w.status)
              w.status=WorkstationStatus.AVAILABLE
              w.save(update_fields=['status','updated_at'])
          # Expire old reservations for this booking
          for r in AnalysisReservation.objects.filter(booking=b).exclude(status__in=[ReservationStatus.COMPLETED, ReservationStatus.CANCELLED, ReservationStatus.EXPIRED]):
              print('CLOSING_OLD', r.id, r.status)
              ReservationService().transition(r, ReservationStatus.EXPIRED, reason='Recover workflow')
              ReservationQueue.objects.filter(reservation=r).update(status=QueueEntryStatus.EXPIRED)
          now=timezone.now()
          # Create near-term reservation via existing service path
          from iic_booking.equipment.remote_analysis_integration.service import BookingRemoteAnalysisService
          svc=BookingRemoteAnalysisService()
          # Prefer ensure_reservation if available
          if hasattr(svc, 'ensure_reservation'):
              out=svc.ensure_reservation(b, actor=b.user)
              print('ENSURE', type(out).__name__, str(out)[:500])
          reservation=AnalysisReservation.objects.filter(booking=b).order_by('-created_at').first()
          if reservation and reservation.status in {ReservationStatus.QUEUED, ReservationStatus.REQUESTED, ReservationStatus.EXPIRED}:
              # Reset window to now for immediate allocation eligibility
              reservation.requested_start=now
              reservation.requested_end=now+timedelta(minutes=30)
              reservation.reserved_start=now
              reservation.reserved_end=now+timedelta(minutes=30)
              if reservation.status==ReservationStatus.EXPIRED:
                  reservation.status=ReservationStatus.QUEUED
              reservation.workstation=None
              reservation.save()
              ReservationQueue.objects.update_or_create(
                  reservation=reservation,
                  defaults={'status': QueueEntryStatus.WAITING, 'priority': 50, 'enqueued_at': now},
              )
              print('PROCESS', SchedulerService().process_queue(limit=20))
              reservation.refresh_from_db()
          print(json.dumps({'reservation': str(reservation.id) if reservation else None, 'status': getattr(reservation,'status',None), 'ws': str(getattr(reservation,'workstation_id',None)), 'host_status': w.status}, default=str))
          w.refresh_from_db(); print('HOST_AFTER', w.hostname, w.status)
          "
