# End-to-end check of Slot Exchange (options, propose, accept, decline, withdraw, refusals) with the test
# accounts. All data is created inside a database transaction that is rolled back.
name: E2E Slot Exchange

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Run end-to-end test in the django container
        run: |
          set -euo pipefail
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1 || true)"
          test -n "$CID"
          cd "$GITHUB_WORKSPACE"
          echo "workspace: $(pwd) at $(git rev-parse --short HEAD)"
          # Read the script from the checked-out commit itself, so a stale working tree cannot hide it.
          git show HEAD:scripts/ops/e2e_slot_exchange.py | \
            docker exec -i -w /app -e DJANGO_SETTINGS_MODULE=config.settings.production "$CID" python -
