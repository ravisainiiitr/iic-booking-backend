# Read-only HTTPS 443 vs IMAP 993 reachability comparison for mail.iitr.ac.in from the production Django container.
name: Probe IITR mail HTTPS 443 vs IMAP 993

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    steps:
      - name: HTTPS vs IMAP reachability
        run: |
          echo '' | base64 -d > /tmp/https_probe.sh
          bash /tmp/https_probe.sh