# I-STEM pilot configuration for production (31 Oct 2026): registration with an existing I-STEM account and I-STEM
# linking for test accounts, against I-STEM STAGING until I-STEM issues production credentials.
#   enable  : ISTEM_ENABLED, ISTEM_MODE=live, OTP linking on, staging URL and credentials (repository secrets
#             ISTEM_STAGING_USERNAME / ISTEM_STAGING_PASSWORD), the CA chain shipped in the code, and the
#             registration test key (secret ISTEM_REGISTRATION_TEST_KEY): "Already registered on I-STEM?" shows only
#             on /auth?istem_test=<key>, and accounts registered through it are test accounts. Signed-in linking is
#             limited to test accounts by the external pilot. User creation stays off; Confirm and FBR Execute stay off unless
#             booking_steps=on (then only the I-STEM Single Booking workflow sends them, one booking at a time).
#             booking_steps=automatic: as on, plus automatic FBR (ISTEM_AUTOMATIC_FBR), closing cancelled bookings on
#             I-STEM (ISTEM_CANCEL_ENABLED) and the "I-STEM sync (every 5 minutes)" schedule switched on, so every new
#             booking that needs an I-STEM FBR is created, confirmed and executed by the portal. off/on switch them off.
#             user_linking=automatic ([USER 2026-11-08]): the portal links users to I-STEM itself. Create User is
#             sent when a booking needs it, and an "already exists" answer stores that I-STEM user id without an OTP
#             (ISTEM_USER_CREATION_ENABLED + ISTEM_ACCEPT_DUPLICATE_USER_ID). manual (default) keeps both off.
#   open    : as enable, but without the test key: "Already registered on I-STEM?" shows for every external
#             visitor and those sign-ups are ordinary (not test) accounts. Still I-STEM STAGING: for a temporary
#             evaluation of the flow and screens only; switch back with enable (test link only) or disable.
#   disable : I-STEM off again (ISTEM_ENABLED=False, ISTEM_MODE=off, OTP linking off); credentials removed.
# Only the django service is recreated. Secrets are never printed.
name: Apply I-STEM Pilot Config

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "enable | disable"
        required: true
        type: choice
        options: [enable, open, disable]
      confirm:
        description: "Type ISTEM to proceed"
        required: true
      test_otp_inbox:
        description: "enable/open only: inbox for OTPs of made-up @example.com I-STEM staging users (empty: none)"
        required: false
        default: ""
      booking_steps:
        description: "enable/open only: on = Confirm Booking and FBR Execute allowed for bookings sent one at a time by the I-STEM Single Booking workflow; automatic = the portal sends every new I-STEM booking itself (5-minute sync); off = all off"
        required: false
        type: choice
        options: ["off", "on", "automatic"]
        default: "off"
      user_linking:
        description: "enable/open only: automatic = the portal creates the I-STEM user or stores the existing one's id (no OTP); manual = users link by OTP"
        required: false
        type: choice
        options: ["manual", "automatic"]
        default: "manual"

permissions:
  contents: read

jobs:
  apply:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Require confirmation
        run: test "${{ github.event.inputs.confirm }}" = "ISTEM"

      - name: Update env file and recreate django
        env:
          MODE: ${{ github.event.inputs.mode }}
          TEST_OTP_INBOX: ${{ github.event.inputs.test_otp_inbox }}
          BOOKING_STEPS: ${{ github.event.inputs.booking_steps }}
          USER_LINKING: ${{ github.event.inputs.user_linking }}
          ISTEM_STAGING_USERNAME: ${{ secrets.ISTEM_STAGING_USERNAME }}
          ISTEM_STAGING_PASSWORD: ${{ secrets.ISTEM_STAGING_PASSWORD }}
          ISTEM_REGISTRATION_TEST_KEY: ${{ secrets.ISTEM_REGISTRATION_TEST_KEY }}
        run: |
          set -euo pipefail
          DEPLOY=/home/ubuntu/iic-booking-backend
          ENV_FILE="$DEPLOY/.envs/.production/.django"
          test -f "$ENV_FILE"
          cp -p "$ENV_FILE" "$ENV_FILE.bak-istem-$(date -u +%Y%m%dT%H%M%SZ)"
          export ENV_FILE
          python3 <<'PY'
          import os
          from pathlib import Path

          mode = os.environ["MODE"]
          env_file = Path(os.environ["ENV_FILE"])
          secret_keys = ["ISTEM_USERNAME", "ISTEM_PASSWORD", "ISTEM_REGISTRATION_TEST_KEY"]
          upsert, remove = {}, set()
          if mode in ("enable", "open"):
              for name in ("ISTEM_STAGING_USERNAME", "ISTEM_STAGING_PASSWORD", "ISTEM_REGISTRATION_TEST_KEY"):
                  if not os.environ.get(name):
                      raise SystemExit(f"repository secret {name} is not set")
              upsert = {
                  "ISTEM_ENABLED": "True",
                  "ISTEM_MODE": "live",
                  "ISTEM_BASE_URL": "https://istemstaging.iisc.ac.in/istem1",
                  "ISTEM_USERNAME": os.environ["ISTEM_STAGING_USERNAME"],
                  "ISTEM_PASSWORD": os.environ["ISTEM_STAGING_PASSWORD"],
                  "ISTEM_CA_BUNDLE": "/app/iic_booking/istem/certs/istem_ca_chain.pem",
                  "ISTEM_CONNECT_TIMEOUT": "20",
                  "ISTEM_OTP_LINKING_ENABLED": "True",
                  "ISTEM_REGISTRATION_TEST_KEY": os.environ["ISTEM_REGISTRATION_TEST_KEY"],
                  "ISTEM_USER_CREATION_ENABLED": "False",
                  "ISTEM_CONFIRM_ENABLED": "False",
                  "ISTEM_EXECUTE_ENABLED": "False",
                  "ISTEM_AUTOMATIC_FBR": "False",
                  "ISTEM_CANCEL_ENABLED": "False",
              }
              if os.environ.get("BOOKING_STEPS") in ("on", "automatic"):
                  from datetime import datetime, timezone
                  upsert.update({
                      "ISTEM_CONFIRM_ENABLED": "True",
                      "ISTEM_EXECUTE_ENABLED": "True",
                      "ISTEM_CONFIRM_APPROVED_BY": "IIT Roorkee Booking Portal",  # confirmation is automatic (no manual approver)
                      # I-STEM (30 Oct 2026): silent=true on Create, Confirm and Cancel, so I-STEM emails nobody.
                      "ISTEM_SILENT_MODE_FIELD": "silent",
                      "ISTEM_SILENT_MODE_VALUE": "true",
                      # Safety net: bookings made before this moment are never sent, even by istem_sync --enqueue.
                      "ISTEM_SYNC_START_AT": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  })
              if os.environ.get("BOOKING_STEPS") == "automatic":
                  upsert.update({"ISTEM_AUTOMATIC_FBR": "True", "ISTEM_CANCEL_ENABLED": "True"})
              automatic_linking = os.environ.get("USER_LINKING") == "automatic"
              upsert["ISTEM_USER_CREATION_ENABLED"] = "True" if automatic_linking else "False"
              upsert["ISTEM_ACCEPT_DUPLICATE_USER_ID"] = "True" if automatic_linking else "False"
              if mode == "open":
                  del upsert["ISTEM_REGISTRATION_TEST_KEY"]
                  remove = {"ISTEM_REGISTRATION_TEST_KEY"}
              inbox = os.environ.get("TEST_OTP_INBOX", "").strip()
              if inbox:
                  if "@" not in inbox:
                      raise SystemExit("test_otp_inbox must be an email address")
                  upsert["ISTEM_TEST_OTP_INBOX"] = inbox
              else:
                  remove.add("ISTEM_TEST_OTP_INBOX")
          elif mode == "disable":
              upsert = {"ISTEM_ENABLED": "False", "ISTEM_MODE": "off", "ISTEM_OTP_LINKING_ENABLED": "False",
                        "ISTEM_USER_CREATION_ENABLED": "False", "ISTEM_ACCEPT_DUPLICATE_USER_ID": "False",
                        "ISTEM_AUTOMATIC_FBR": "False", "ISTEM_CANCEL_ENABLED": "False"}
              remove = set(secret_keys) | {"ISTEM_TEST_OTP_INBOX", "ISTEM_CONFIRM_APPROVED_BY"}
          else:
              raise SystemExit("unknown mode")

          # The institute is the one I-STEM names in its token response; it is no longer configured on the portal.
          remove = set(remove) | {"ISTEM_INSTITUTE_ID"}
          out, seen = [], set()
          for line in env_file.read_text(encoding="utf-8", errors="replace").splitlines():
              key = line.split("=", 1)[0].strip() if "=" in line and not line.lstrip().startswith("#") else None
              if key in remove:
                  continue
              if key in upsert:
                  if key not in seen:
                      out.append(f"{key}={upsert[key]}")
                      seen.add(key)
                  continue
              out.append(line)
          for key, value in upsert.items():
              if key not in seen:
                  out.append(f"{key}={value}")
          env_file.write_text("\n".join(out).rstrip() + "\n", encoding="utf-8")
          print("mode=", mode, " upserted=", sorted(upsert), " removed=", sorted(remove))
          PY
          grep -E '^ISTEM_' "$ENV_FILE" | grep -v -E '^ISTEM_(USERNAME|PASSWORD|REGISTRATION_TEST_KEY)=' || true
          cd "$DEPLOY"
          docker compose -f docker-compose.production.yml up -d --force-recreate --no-deps django
          for i in $(seq 1 30); do
            CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1 || true)"
            if [ -n "$CID" ] && docker exec "$CID" true 2>/dev/null; then break; fi
            sleep 2
          done
          sleep 6
          docker ps --format '{{.Names}} {{.Status}}' | grep -E 'django' || true

      - name: Runtime verification
        env:
          MODE: ${{ github.event.inputs.mode }}
          BOOKING_STEPS: ${{ github.event.inputs.booking_steps }}
        run: |
          set -euo pipefail
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          docker exec -i -w /app -e MODE -e BOOKING_STEPS -e DJANGO_SETTINGS_MODULE=config.settings.production "$CID" python - <<'PY'
          import django

          django.setup()

          import os

          from django_celery_beat.models import PeriodicTask

          from iic_booking.istem import conf, registration_lookup

          # The 5-minute sync runs only with booking_steps=automatic (the task itself also skips unless automatic FBR is on).
          sync = PeriodicTask.objects.filter(name="I-STEM sync (every 5 minutes)", task="istem.run_sync").first()
          if sync is None:
              print("SYNC SCHEDULE MISSING: deploy the release with istem migration 0008 first")
          else:
              want = os.environ.get("MODE") in ("enable", "open") and os.environ.get("BOOKING_STEPS") == "automatic"
              if sync.enabled != want:
                  sync.enabled = want
                  sync.save()
              print("RUNTIME sync schedule enabled=", sync.enabled, " last_run_at=", sync.last_run_at)

          print("RUNTIME istem_enabled=", conf.istem_enabled(), " mode=", conf.istem_mode(),
                " network_allowed=", conf.network_allowed(), " missing=", conf.missing_live_settings())
          print("RUNTIME otp_linking=", conf.otp_linking_enabled(), " user_creation=", conf.user_creation_enabled(),
                " link_existing_user_automatically=", conf.accept_duplicate_user_id(),
                " test_key_set=", bool(registration_lookup._test_key()))
          print("RUNTIME confirm=", conf.confirm_enabled(), " execute=", conf.execute_enabled(),
                " automatic_fbr=", conf.automatic_fbr_enabled() if hasattr(conf, "automatic_fbr_enabled") else "n/a",
                " cancel=", conf.cancel_enabled() if hasattr(conf, "cancel_enabled") else "n/a")
          print("RUNTIME registration available without the key=", registration_lookup.available(""))
          print("RUNTIME test OTP inbox for @example.com staging users set=",
                bool(registration_lookup.test_otp_inbox("check@example.com")) if hasattr(registration_lookup, "test_otp_inbox") else "n/a")
          if conf.network_allowed():
              from iic_booking.istem.service import default_client

              try:
                  default_client().lookup_public_user(user_email="nobody@iic-booking.test")
                  print("I-STEM staging reachable: token and look-up OK")
              except Exception as exc:  # only the class and message, never credentials
                  print("I-STEM staging check:", type(exc).__name__, str(exc)[:200])
          PY
