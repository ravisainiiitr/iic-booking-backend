# Opens the new external workflow (central window, checkout before booking, special requests, cancellation and
# reschedule cut-off, invoices, government credit) to every external user, and the online-payment fallback to every
# internal user whose wallet falls short; or returns both to test accounts only.
#   all       : EXTERNAL_WORKFLOW_ALL_EXTERNAL_USERS=True, INTERNAL_GATEWAY_FALLBACK_ALL_USERS=True
#   test-only : both False (test accounts only, the pilot state)
# Backs up the env file first. Recreates django and the Celery worker only. Secrets are never printed.
name: Apply External Workflow Rollout

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "all | test-only"
        required: true
        type: choice
        options: [all, test-only]
      confirm:
        description: "Type ROLLOUT to proceed"
        required: true

permissions:
  contents: read

jobs:
  apply:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Require confirmation
        run: test "${{ github.event.inputs.confirm }}" = "ROLLOUT"

      - name: Update env file and recreate services
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          set -euo pipefail
          DEPLOY=/home/ubuntu/iic-booking-backend
          ENV_FILE="$DEPLOY/.envs/.production/.django"
          test -f "$ENV_FILE"
          cp -p "$ENV_FILE" "$ENV_FILE.bak-external-$(date -u +%Y%m%dT%H%M%SZ)"
          export ENV_FILE
          python3 <<'PY'
          import os
          from pathlib import Path

          value = "True" if os.environ["MODE"] == "all" else "False"
          upsert = {"EXTERNAL_WORKFLOW_ALL_EXTERNAL_USERS": value, "INTERNAL_GATEWAY_FALLBACK_ALL_USERS": value}
          env_file = Path(os.environ["ENV_FILE"])
          out, seen = [], set()
          for line in env_file.read_text(encoding="utf-8", errors="replace").splitlines():
              key = line.split("=", 1)[0].strip() if "=" in line and not line.lstrip().startswith("#") else None
              if key in upsert:
                  if key not in seen:
                      out.append(f"{key}={upsert[key]}")
                      seen.add(key)
                  continue
              out.append(line)
          for key, val in upsert.items():
              if key not in seen:
                  out.append(f"{key}={val}")
          env_file.write_text("\n".join(out).rstrip() + "\n", encoding="utf-8")
          print("set=", upsert)
          PY
          cd "$DEPLOY"
          docker compose -f docker-compose.production.yml up -d --force-recreate --no-deps django celeryworker
          for i in $(seq 1 30); do
            CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1 || true)"
            if [ -n "$CID" ] && docker exec "$CID" true 2>/dev/null; then break; fi
            sleep 2
          done
          sleep 6
          docker ps --format '{{.Names}} {{.Status}}' | grep -E 'django|celeryworker' || true

      - name: Runtime verification
        run: |
          set -euo pipefail
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          docker exec -i -w /app -e DJANGO_SETTINGS_MODULE=config.settings.production "$CID" python - <<'PY'
          import django

          django.setup()
          from django.conf import settings

          print("RUNTIME EXTERNAL_WORKFLOW_ALL_EXTERNAL_USERS=", settings.EXTERNAL_WORKFLOW_ALL_EXTERNAL_USERS)
          print("RUNTIME INTERNAL_GATEWAY_FALLBACK_ALL_USERS=", settings.INTERNAL_GATEWAY_FALLBACK_ALL_USERS)
          PY
          curl -s -o /dev/null -w "health=%{http_code}\n" http://127.0.0.1:8080/api/v1/analysis/health/ready/ || true
