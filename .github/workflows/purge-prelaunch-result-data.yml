# Archive booking result files / rows created before booking opened (2026-09-30 21:00 IST).
# Dry run by default. Apply moves S3 objects to archive/pre-launch-2026-09-30/ (nothing is destroyed) and
# copies the manifest + row backup to /home/ubuntu/backups/prelaunch-purge-2026-09-30/<run id>/ on the host.
# Logs are counts only (repository is public).
name: Purge Pre-launch Result Data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (read-only) or apply"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      confirm:
        description: "Type PURGE-PRE-LAUNCH to apply"
        required: false
        default: ""
        type: string

jobs:
  purge:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Run
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == "apply" && "$CONFIRM" != "PURGE-PRE-LAUNCH" ]]; then
            echo "apply requires confirm=PURGE-PRE-LAUNCH"
            exit 1
          fi
          for d in \
            /home/ubuntu/iic-booking-backend \
            /home/ubuntu/iic_booking_backend \
            /home/ubuntu/iic-booking-backend-rt-port
          do
            if [[ -f "$d/docker-compose.production.yml" ]]; then
              cd "$d"
              echo "DESCRIBE=$(git describe --tags --always 2>/dev/null || true)"
              CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1 || true)"
              test -n "$CID"
              IN_DIR="/tmp/prelaunch-purge/${GITHUB_RUN_ID}"
              if [[ "$MODE" == "apply" ]]; then
                RC=0
                docker exec -w /app "$CID" python manage.py purge_prelaunch_result_data \
                  --apply --confirm "$CONFIRM" --backup-dir "$IN_DIR" || RC=$?
                # Copy the backup out of the container even on partial failure.
                HOST_DIR="/home/ubuntu/backups/prelaunch-purge-2026-09-30/${GITHUB_RUN_ID}"
                mkdir -p "$HOST_DIR"
                docker cp "$CID:$IN_DIR/." "$HOST_DIR/" || true
                chmod 700 "$HOST_DIR"
                chmod 600 "$HOST_DIR"/* || true
                echo "host_backup_dir=$HOST_DIR files=$(ls -1 "$HOST_DIR" | wc -l)"
                exit "$RC"
              else
                docker exec -w /app "$CID" python manage.py purge_prelaunch_result_data --backup-dir "$IN_DIR"
              fi
              exit 0
            fi
          done
          echo "No production compose path found"
          exit 1
