# SRIC wallet recharge (Wallet_Recharge.csv emails): status, read-only dry-run scan of the real mailbox (parse +
# match only, nothing stored or credited), or switch the 5-minute mailbox reading on / off. auto-credit-* shows or
# switches only the auto-credit setting (sender and origin checks untouched). Prints counts, flags and record ids only.
# test-sender-* / find-test-faculty: one-off run-scoped test with an email from a test sender; the real faculty in
# the file is only dry-run, the credit goes to an existing flagged test faculty account and is reversed afterwards.
name: SRIC Wallet Recharge Ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: "status | scan on/off | auto-credit-dry-run / -enable / -disable | test-sender-* | test-employee-id-* | test-reversal-link-*"
        required: true
        default: "status"
        type: choice
        options:
          - status
          - dry-run-scan
          - enable-scan
          - disable-scan
          - test-sender-dry-run
          - find-test-faculty
          - test-employee-id-dry-run
          - test-employee-id-apply
          - test-sender-e2e
          - test-sender-reverse
          - test-reversal-link-dry-run
          - test-reversal-link-apply
          - auto-credit-dry-run
          - auto-credit-enable
          - auto-credit-disable
      test_sender:
        description: "test-sender-dry-run / e2e: the one test sender address for this run (not saved)"
        required: false
        default: ""
      test_folder:
        description: "test-sender-e2e: folder of the test email (from the dry run)"
        required: false
        default: ""
      test_uid:
        description: "test-sender-e2e: IMAP UID of the test email (from the dry run)"
        required: false
        default: ""
      test_user_id:
        description: "test-sender-e2e: user id of the existing test faculty account (from find-test-faculty)"
        required: false
        default: ""
      test_row_id:
        description: "test-sender-reverse / test-reversal-link-*: id of the credited test row"
        required: false
        default: ""
      test_employee_id:
        description: "test-employee-id-*: invented test-only Employee ID (TEST-…); empty clears a TEST- id"
        required: false
        default: ""

jobs:
  ops:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Run
        env:
          ACTION: ${{ inputs.action }}
          TEST_SENDER: ${{ inputs.test_sender }}
          TEST_FOLDER: ${{ inputs.test_folder }}
          TEST_UID: ${{ inputs.test_uid }}
          TEST_USER_ID: ${{ inputs.test_user_id }}
          TEST_ROW_ID: ${{ inputs.test_row_id }}
          TEST_EMPLOYEE_ID: ${{ inputs.test_employee_id }}
        run: |
          set -euo pipefail
          for d in \
            /home/ubuntu/iic-booking-backend \
            /home/ubuntu/iic_booking_backend \
            /home/ubuntu/iic-booking-backend-rt-port
          do
            if [[ -f "$d/docker-compose.production.yml" ]]; then
              cd "$d"
              echo "DESCRIBE=$(git describe --tags --always 2>/dev/null || true)"
              CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1 || true)"
              test -n "$CID"
              if [[ "$ACTION" == test-* || "$ACTION" == auto-credit-* || "$ACTION" == find-test-faculty ]]; then
                docker exec -i -e DJANGO_SETTINGS_MODULE=config.settings.production -w /app "$CID" \
                  python manage.py sric_wallet_recharge "$ACTION" --test-sender "$TEST_SENDER" --folder "$TEST_FOLDER" \
                  --uid "$TEST_UID" --test-user-id "$TEST_USER_ID" --row-id "$TEST_ROW_ID" --employee-id "$TEST_EMPLOYEE_ID"
                exit 0
              fi
              docker exec -i -e DJANGO_SETTINGS_MODULE=config.settings.production -w /app "$CID" \
                python manage.py sric_wallet_recharge "$ACTION"
              echo "== celery beat / worker =="
              docker ps --format '{{.Names}} {{.Status}}' | grep -Ei 'celery|beat' || true
              BEAT="$(docker ps --format '{{.Names}}' | grep -Ei 'beat' | head -n 1 || true)"
              if [[ -n "$BEAT" ]]; then
                docker logs --since 30m "$BEAT" 2>&1 | grep -c "scan_sric_wallet_recharge_mailbox" | sed 's/^/beat_sends_last_30m=/' || true
              fi
              WORKER="$(docker ps --format '{{.Names}}' | grep -Ei 'celeryworker|worker' | head -n 1 || true)"
              if [[ -n "$WORKER" ]]; then
                docker logs --since 30m "$WORKER" 2>&1 | grep "scan_sric_wallet_recharge_mailbox" | grep -Eo "succeeded in [0-9.]+s: \{'status': '[a-z_]+'" | tail -n 5 || true
              fi
              exit 0
            fi
          done
          echo "No production compose path found"
          exit 1
