name: Probe API Version 500

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Probe /api/version and traceback
        run: |
          set -euo pipefail
          curl -sS -o /tmp/ver.json -w "http=%{http_code}\n" http://127.0.0.1:8080/api/version/ || true
          head -c 2000 /tmp/ver.json; echo
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          docker logs --tail 80 "$CID" 2>&1 | tail -n 80
          docker exec -w /app "$CID" python - <<'PY'
          import traceback
          try:
              from iic_booking.platform_compat.manifest import build_version_payload
              print(build_version_payload())
          except Exception:
              traceback.print_exc()
          PY
