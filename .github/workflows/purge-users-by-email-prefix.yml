name: Purge Users By Email Prefix (production)

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: 'Email prefix (case-insensitive), e.g. sat or n1.sat'
        required: true
        type: string
        default: 'sat'
      confirm:
        description: 'Type PURGE_USERS_BY_EMAIL_PREFIX to confirm irreversible delete (ignored when dry_run_only)'
        required: false
        type: string
        default: ''
      dry_run_only:
        description: 'If true, only print counts — do not delete'
        required: false
        type: boolean
        default: false

jobs:
  purge:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Verify confirmation token
        if: ${{ inputs.dry_run_only != true && inputs.dry_run_only != 'true' }}
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "PURGE_USERS_BY_EMAIL_PREFIX" ]; then
            echo "Confirmation token mismatch — aborting."
            exit 1
          fi

      - name: Locate production Django container
        id: find
        run: |
          set -euo pipefail
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' || true
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django|iic_booking_production_django' | head -n 1 || true)"
          if [ -z "$CID" ]; then
            CID="$(docker ps --format '{{.ID}} {{.Image}}' | grep -i 'django' | head -n 1 | awk '{print $1}' || true)"
          fi
          if [ -z "$CID" ]; then
            echo "Could not find a running Django container."
            exit 1
          fi
          echo "Using container: $CID"
          echo "container=$CID" >> "$GITHUB_OUTPUT"

      - name: Dry-run counts on production Django
        run: |
          docker exec "${{ steps.find.outputs.container }}" \
            python manage.py purge_users_by_email_prefix --prefix "${{ github.event.inputs.prefix }}"

      - name: Purge matching users on production
        if: ${{ inputs.dry_run_only != true && inputs.dry_run_only != 'true' }}
        run: |
          docker exec "${{ steps.find.outputs.container }}" \
            python manage.py purge_users_by_email_prefix \
              --prefix "${{ github.event.inputs.prefix }}" \
              --confirm PURGE_USERS_BY_EMAIL_PREFIX
