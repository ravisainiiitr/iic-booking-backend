# Read-only production probe for REAL integration qualification.
# Does NOT migrate. Does NOT POST provisioning. Does NOT print secrets.
name: Probe Production REAL RO Qualification

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Locate Django + deploy path
        id: find
        run: |
          set -euo pipefail
          for d in /home/ubuntu/iic-booking-backend /home/ubuntu/iic_booking_backend; do
            if [[ -f "$d/docker-compose.production.yml" ]]; then
              echo "DEPLOY_PATH=$d"
              cd "$d"
              echo "git_head=$(git rev-parse HEAD)"
              echo "git_short=$(git rev-parse --short HEAD)"
              echo "describe=$(git describe --tags --always)"
              test -f .deploy-state/current_release_tag && echo "current_release_tag=$(cat .deploy-state/current_release_tag)" || true
              test -f .deploy-state/previous_release_tag && echo "previous_release_tag=$(cat .deploy-state/previous_release_tag)" || true
              echo "deploy_path=$d" >> "$GITHUB_OUTPUT"
              break
            fi
          done
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1 || true)"
          echo "django_container=$CID"
          echo "container=$CID" >> "$GITHUB_OUTPUT"
          test -n "$CID"

      - name: Production settings hard-off + storage (presence only)
        run: |
          set -euo pipefail
          CID="${{ steps.find.outputs.container }}"
          docker exec -w /app "$CID" python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings.production")
          import django
          django.setup()
          from django.conf import settings

          def present(name: str) -> bool:
              return bool(str(getattr(settings, name, "") or "").strip())

          print("DEPLOYMENT_ENVIRONMENT=", getattr(settings, "DEPLOYMENT_ENVIRONMENT", None))
          print("REAL_INTEGRATION_ENABLED=", bool(getattr(settings, "REAL_INTEGRATION_ENABLED", False)))
          print("CHANNEL_I_STAGING_FIXTURE_MODE=", bool(getattr(settings, "CHANNEL_I_STAGING_FIXTURE_MODE", False)))
          print("LEGACY_MYSQL_STAGING_FIXTURE_MODE=", bool(getattr(settings, "LEGACY_MYSQL_STAGING_FIXTURE_MODE", False)))
          print("LOCAL_STAGING_ACCEPTED=", bool(getattr(settings, "LOCAL_STAGING_ACCEPTED", False)))
          print("USE_S3_MEDIA=", bool(getattr(settings, "USE_S3_MEDIA", False)))
          storage = getattr(settings, "DEFAULT_FILE_STORAGE", None) or getattr(settings, "STORAGES", {}).get("default", {}).get("BACKEND", "")
          print("DEFAULT_FILE_STORAGE_BACKEND=", storage)
          print("AWS_STORAGE_BUCKET_NAME_configured=", present("AWS_STORAGE_BUCKET_NAME"))
          print("AWS_ACCESS_KEY_ID_configured=", present("AWS_ACCESS_KEY_ID"))
          print("AWS_SECRET_ACCESS_KEY_configured=", present("AWS_SECRET_ACCESS_KEY"))
          print("OMNIPORT_CLIENT_ID_configured=", present("OMNIPORT_CLIENT_ID"))
          print("OMNIPORT_CLIENT_SECRET_configured=", present("OMNIPORT_CLIENT_SECRET"))
          redirect = str(getattr(settings, "OMNIPORT_REDIRECT_URI", "") or "")
          print("OMNIPORT_REDIRECT_URI_host_ok=", redirect.startswith("https://equip.iitr.ac.in/") and "callback" in redirect)
          print("OLD_MYSQL_HOST_configured=", present("OLD_MYSQL_HOST") or present("LEGACY_MYSQL_HOST"))
          print("OLD_MYSQL_USER_configured=", present("OLD_MYSQL_USER") or present("LEGACY_MYSQL_USER"))
          print("OLD_MYSQL_DATABASE_configured=", present("OLD_MYSQL_DATABASE") or present("LEGACY_MYSQL_DATABASE"))
          PY

      - name: showmigrations users (RO)
        run: |
          set -euo pipefail
          CID="${{ steps.find.outputs.container }}"
          docker exec -w /app "$CID" python manage.py showmigrations users | tee /tmp/showmig-users.txt
          echo "=== 0096-0100 lines ==="
          grep -E '0096|0097|0098|0099|0100' /tmp/showmig-users.txt || true
          echo "=== pending users ==="
          grep -E '^\s*\[ \]' /tmp/showmig-users.txt || echo "No pending users migrations listed"

      - name: S3 HEAD probe (no secrets)
        run: |
          set -euo pipefail
          CID="${{ steps.find.outputs.container }}"
          docker exec -w /app "$CID" python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings.production")
          import django
          django.setup()
          from django.conf import settings
          from django.core.files.storage import default_storage

          use_s3 = bool(getattr(settings, "USE_S3_MEDIA", False))
          backend = default_storage.__class__.__module__ + "." + default_storage.__class__.__name__
          print("default_storage_class=", backend)
          print("USE_S3_MEDIA=", use_s3)
          local_ok = bool(getattr(settings, "LOCAL_STAGING_ACCEPTED", False))
          print("LOCAL_STAGING_ACCEPTED=", local_ok)
          if local_ok:
              print("S3_RESULT=FAIL_LOCAL_STAGING_ACCEPTED")
              raise SystemExit(0)
          if not use_s3 and "s3" not in backend.lower() and "S3" not in backend:
              print("S3_RESULT=NOT_VERIFIED_NON_S3_BACKEND")
              raise SystemExit(0)
          try:
              # listdir root is read-ish; catch errors without printing credentials
              default_storage.listdir("")
              print("S3_RESULT=PASS_LISTDIR")
          except Exception as exc:
              print("S3_RESULT=NOT_VERIFIED")
              print("S3_ERROR_TYPE=", type(exc).__name__)
          PY

      - name: Legacy MySQL RO probe (SELECT-only)
        run: |
          set -euo pipefail
          CID="${{ steps.find.outputs.container }}"
          docker exec -w /app "$CID" python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings.production")
          import django
          django.setup()
          from django.conf import settings

          fixture = bool(getattr(settings, "LEGACY_MYSQL_STAGING_FIXTURE_MODE", False))
          print("LEGACY_MYSQL_STAGING_FIXTURE_MODE=", fixture)
          if fixture:
              print("MYSQL_RESULT=FAIL_FIXTURE_MODE")
              raise SystemExit(0)

          user = str(getattr(settings, "OLD_MYSQL_USER", None) or getattr(settings, "LEGACY_MYSQL_USER", "") or "")
          host = str(getattr(settings, "OLD_MYSQL_HOST", None) or getattr(settings, "LEGACY_MYSQL_HOST", "") or "")
          db = str(getattr(settings, "OLD_MYSQL_DATABASE", None) or getattr(settings, "LEGACY_MYSQL_DATABASE", "") or "")
          print("OLD_MYSQL_USER=", user if user else "<unset>")
          print("OLD_MYSQL_HOST_configured=", bool(host))
          print("OLD_MYSQL_DATABASE_configured=", bool(db))
          if user.lower() == "harshit":
              print("MYSQL_RESULT=FAIL_FORBIDDEN_ACCOUNT")
              raise SystemExit(0)
          if not user or not host or not db:
              print("MYSQL_RESULT=NOT_VERIFIED_MISSING_CONFIG")
              raise SystemExit(0)

          try:
              from iic_booking.users.legacy_ledger.reader import OldMySQLReader
          except Exception as exc:
              print("MYSQL_RESULT=NOT_VERIFIED_IMPORT")
              print("IMPORT_ERROR_TYPE=", type(exc).__name__)
              raise SystemExit(0)

          reader = OldMySQLReader()
          # Prefer built-in RO helpers if present; otherwise raw SELECT COUNT via reader API
          results = {}
          for label, fn_names in [
              ("users", ("count_users", "get_user_count")),
              ("wallets", ("count_wallets", "get_wallet_count")),
              ("ledger", ("count_wallet_transactions", "count_transactions", "get_transaction_count")),
              ("bookings", ("count_bookings", "get_booking_count")),
          ]:
              val = None
              for name in fn_names:
                  fn = getattr(reader, name, None)
                  if callable(fn):
                      try:
                          val = fn()
                          break
                      except Exception as exc:
                          print(f"{label}_method_error=", name, type(exc).__name__)
              results[label] = val
              print(f"{label}_read=", "PASS" if val is not None else "NOT_VERIFIED", "count_type=", type(val).__name__ if val is not None else None)

          # Write protection: attempt a rejected write SQL path if helper exists
          denied = None
          for name in ("assert_readonly_sql", "execute_readonly"):
              fn = getattr(reader, name, None)
              if name == "assert_readonly_sql" and callable(fn):
                  try:
                      fn("UPDATE admin.users SET emp_id=emp_id WHERE 1=0")
                      denied = False
                  except Exception as exc:
                      denied = True
                      print("write_guard_error_type=", type(exc).__name__)
                  break
          print("account_appears_writable=", False if denied else "UNKNOWN")
          print("fixture_fallback=", "NONE")
          if all(results[k] is not None for k in ("users", "wallets", "ledger", "bookings")):
              print("MYSQL_RESULT=PASS")
          else:
              print("MYSQL_RESULT=PARTIAL_OR_NOT_VERIFIED")
          PY
