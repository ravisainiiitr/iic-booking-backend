name: Test R11 Multi-PC Allocation

# Runs on a throwaway GitHub-hosted runner with its own Postgres.
# Never run these tests inside the production containers on the EC2 runner.
on:
  workflow_dispatch:
  push:
    paths:
      - "iic_booking/remote_analysis/services/allocation.py"
      - "iic_booking/remote_analysis/services/availability.py"
      - "iic_booking/remote_analysis/services/scheduler.py"
      - "iic_booking/remote_analysis/tests/test_r11_allocation_multi_pc.py"
      - ".github/workflows/test-r11-multi-pc-allocation.yml"

permissions:
  contents: read

concurrency:
  group: test-r11-multi-pc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iic
          POSTGRES_PASSWORD: iic
          POSTGRES_DB: iic_booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://iic:iic@localhost:5432/iic_booking
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_READ_DOT_ENV_FILE: "False"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Pytest multi-PC same-software failover
        run: uv run pytest iic_booking/remote_analysis/tests/test_r11_allocation_multi_pc.py -q --tb=short --create-db -p no:sugar
