name: Probe Booking 312 Summary HTTP Path

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: self-hosted
    steps:
      - name: Probe get_summary exception path
        run: |
          set -euo pipefail
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1)"
          docker exec -w /app "$CID" python manage.py shell -c "
          import traceback
          from django.test import RequestFactory
          from iic_booking.equipment.models import Booking
          from iic_booking.equipment.remote_analysis_integration.service import BookingRemoteAnalysisService
          from iic_booking.users.models import User
          b = Booking.objects.select_related('equipment','user').get(pk=312)
          user = b.user
          rf = RequestFactory()
          req = rf.get('/api/v1/bookings/312/analysis/')
          req.user = user
          svc = BookingRemoteAnalysisService()
          try:
              ctx = svc.get_analyze_context(b, user=user, request=req)
              print('CTX_OK', {k: ctx.get(k) for k in ['can_analyze','software_configured','raw_ready','require_raw_files','can_launch']})
          except Exception:
              print('CTX_FAIL')
              traceback.print_exc()
          try:
              summary = svc.get_summary(b, user=user, request=req)
              print('SUM can_analyze', summary.get('can_analyze'), 'raw_ready', summary.get('raw_ready'))
              print('SUM analyze keys', sorted((summary.get('analyze') or {}).keys()))
              print('SUM elig', summary.get('eligibility'))
          except Exception:
              print('SUM_FAIL')
              traceback.print_exc()
          # Simulate swallowed exception by calling with bad request?
          print('user_id', user.pk, 'booking.user_id', b.user_id)
          "
