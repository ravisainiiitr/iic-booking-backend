# Read-only test of an IITR IMAP endpoint (TCP 993) and nsmtp.iitr.ac.in from the production Django container.
# Credentials come from the container env (IMAP_USER / IMAP_PASSWORD); nothing is written to the mailbox.
name: Probe official IITR IMAP imap.iitr.ac.in

on:
  workflow_dispatch:
    inputs:
      imap_host:
        description: IMAP hostname to test on port 993
        required: true
        default: imap.iitr.ac.in

jobs:
  probe:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    env:
      IMAP_HOST_UNDER_TEST: ${{ inputs.imap_host }}
    steps:
      - name: Official IITR mail endpoint test
        run: |
          if ! printf '%s' "$IMAP_HOST_UNDER_TEST" | grep -Eq '^[A-Za-z0-9.-]+$'; then echo "invalid imap_host"; exit 1; fi
          echo '' | base64 -d > /tmp/official_probe.sh
          echo '' | base64 -d > /tmp/official_probe.py
          bash /tmp/official_probe.sh