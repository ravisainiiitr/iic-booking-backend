name: Diagnose Bookings 500

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: self-hosted
    steps:
      - name: Hit bookings API via Django test client
        run: |
          set -euo pipefail
          CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1 || true)"
          echo "container=$CID"
          docker exec -w /app "$CID" python manage.py shell -c "
          import traceback
          from django.test import Client
          from django.contrib.auth import get_user_model
          from rest_framework.authtoken.models import Token
          from iic_booking.equipment.models import Booking
          User = get_user_model()
          print('booked_count', Booking.objects.filter(status='BOOKED').count())
          admin = User.objects.filter(user_type='admin', is_active=True).order_by('id').first()
          print('admin', admin and admin.email, admin and admin.id)
          token, _ = Token.objects.get_or_create(user=admin)
          c = Client()
          try:
              r = c.get('/api/bookings/?status=BOOKED&limit=10&offset=0&list_view=1', HTTP_AUTHORIZATION='Token ' + token.key)
              print('status', r.status_code)
              print('body', r.content[:1000])
          except Exception:
              print('CLIENT_FAIL')
              traceback.print_exc()
          "
