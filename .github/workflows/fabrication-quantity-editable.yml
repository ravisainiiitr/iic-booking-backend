# Fabrication "Quantity Required" editable after booking.
# dry-run : read-only. Counts and ids of the system Quantity Required inputs (key A) of 3D print / laser cutting
#           equipment that are still locked (editing_required=False).
# apply   : sets editing_required=True on exactly those inputs; needs confirm = MAKE_QUANTITY_EDITABLE.
# verify  : read-only. Fails if any of those inputs is still locked.
# Counts and input / equipment ids only (public logs).
name: Fabrication Quantity Editable

on:
  workflow_dispatch:
    inputs:
      action:
        description: "dry-run | apply | verify"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - apply
          - verify
      confirm:
        description: "apply only: type MAKE_QUANTITY_EDITABLE"
        required: false
        default: ""

jobs:
  run:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Run
        env:
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          ARGS=()
          if [[ "$ACTION" == "apply" ]]; then
            if [[ "$CONFIRM" != "MAKE_QUANTITY_EDITABLE" ]]; then echo "confirm must be MAKE_QUANTITY_EDITABLE to apply"; exit 1; fi
            ARGS+=(--apply --confirm MAKE_QUANTITY_EDITABLE)
          elif [[ "$ACTION" == "verify" ]]; then
            ARGS+=(--verify)
          fi
          for d in \
            /home/ubuntu/iic-booking-backend \
            /home/ubuntu/iic_booking_backend \
            /home/ubuntu/iic-booking-backend-rt-port
          do
            if [[ -f "$d/docker-compose.production.yml" ]]; then
              cd "$d"
              echo "DESCRIBE=$(git describe --tags --always 2>/dev/null || true)"
              CID="$(docker ps --format '{{.Names}}' | grep -E 'django' | head -n 1 || true)"
              test -n "$CID"
              docker exec -i -e DJANGO_SETTINGS_MODULE=config.settings.production -w /app "$CID" \
                python manage.py make_fabrication_quantity_editable ${ARGS[@]+"${ARGS[@]}"}
              exit 0
            fi
          done
          echo "No production compose path found"
          exit 1
